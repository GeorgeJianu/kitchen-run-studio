    o.push('<line x1="'+(x+W)+'" y1="'+(dy-tick)+'" x2="'+(x+W)+'" y2="'+(dy+tick)+'" stroke="var(--ink-soft)" stroke-width="5"/>');
    o.push('<text x="'+(x+W/2)+'" y="'+(dy+fs*1.35)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="'+fs+'" fill="var(--ink-soft)">'+Math.round(u.W)+'</text>');

    var dx = x+W+110, my = y+H/2, tx = dx+fs*0.85;
    o.push('<line x1="'+dx+'" y1="'+y+'" x2="'+dx+'" y2="'+(y+H)+'" stroke="var(--ink-soft)" stroke-width="5"/>');
    o.push('<line x1="'+(dx-tick)+'" y1="'+y+'" x2="'+(dx+tick)+'" y2="'+y+'" stroke="var(--ink-soft)" stroke-width="5"/>');
    o.push('<line x1="'+(dx-tick)+'" y1="'+(y+H)+'" x2="'+(dx+tick)+'" y2="'+(y+H)+'" stroke="var(--ink-soft)" stroke-width="5"/>');
    o.push('<text x="'+tx+'" y="'+my+'" text-anchor="middle" transform="rotate(-90 '+tx+' '+my+')" font-family="IBM Plex Mono, monospace" font-size="'+fs+'" fill="var(--ink-soft)">'+Math.round(u.H)+'</text>');

    // no caption in the drawing — the block header above it already carries
    // the name, the type code and the full W × H × D

    return '<svg viewBox="0 0 '+vbW+' '+vbH+'" style="width:'+Math.round(pxW)+'px" role="img" aria-label="Front elevation of '+
      escAttr(u.name||TYPES[u.type].label)+', '+Math.round(u.W)+' by '+Math.round(u.H)+' mm">'+o.join('')+'</svg>';
  }

  /* ================= small drawings ================= */
  function typeIcon(type){
    var VBW=60, VBH=50, x0=4, y0=3, w=VBW-8, h=VBH-6;
    var ink='var(--ink)', line='var(--line)', s2='var(--surface-2)', acc='var(--accent)', wood='var(--wood)', stone='var(--stone)';
    var o = ['<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" fill="'+s2+'" stroke="'+ink+'" stroke-width="1.5"/>'];
    if(type==='frame'){
      o.push('<line x1="'+(x0+3)+'" y1="'+(y0+6)+'" x2="'+(x0+w-3)+'" y2="'+(y0+6)+'" stroke="'+line+'" stroke-width="1" stroke-dasharray="2,2"/>');
      o.push('<line x1="'+(x0+3)+'" y1="'+(y0+h-6)+'" x2="'+(x0+w-3)+'" y2="'+(y0+h-6)+'" stroke="'+line+'" stroke-width="1" stroke-dasharray="2,2"/>');
    }
    // Pictograms, not scale drawings — but they still show the construction
    // the tool builds: fronts cover the face, shelves sit between the sides.
    var T = 2.5;
    if(type==='shelf' || type==='combo'){
      var n = type==='shelf' ? 2 : 1, bot = type==='combo' ? y0+h*0.55 : y0+h;
      for(var i=1;i<=n;i++) o.push('<rect x="'+(x0+T)+'" y="'+(y0+(bot-y0)*(i/(n+1))-1)+'" width="'+(w-2*T)+'" height="2" fill="'+acc+'" opacity="0.6"/>');
    }
    if(type==='drawer' || type==='combo'){
      var n2 = type==='combo'?2:3, top = type==='combo' ? y0+h*0.55 : y0, band=(y0+h-top)/n2;
      for(var d=0;d<n2;d++){
        o.push('<rect x="'+(x0+0.6)+'" y="'+(top+d*band+0.9)+'" width="'+(w-1.2)+'" height="'+(band-1.8)+'" fill="'+wood+'" opacity="0.3" stroke="'+ink+'" stroke-width="0.9"/>');
      }
    }
    if(type==='door' || type==='sink'){
      var top2 = type==='sink' ? y0+10 : y0+0.6;
      if(type==='sink') o.push('<rect x="'+(x0+0.6)+'" y="'+(y0+0.6)+'" width="'+(w-1.2)+'" height="8" fill="'+wood+'" opacity="0.22" stroke="'+ink+'" stroke-width="0.7"/>');
      var dw=(w-1.2-1.8)/2;
      for(var k=0;k<2;k++){
        var dx=x0+0.6+k*(dw+1.8);
        o.push('<rect x="'+dx+'" y="'+top2+'" width="'+dw+'" height="'+(y0+h-0.6-top2)+'" fill="'+wood+'" opacity="0.25" stroke="'+ink+'" stroke-width="0.9"/>');
        o.push('<circle cx="'+(k===0?dx+1.6:dx+dw-1.6)+'" cy="'+(top2+4)+'" r="0.9" fill="'+ink+'" opacity="0.5"/>');
      }
    }
    if(type==='wine'){
      for(var r=1;r<3;r++) o.push('<rect x="'+(x0+T)+'" y="'+(y0+h*r/3-1)+'" width="'+(w-2*T)+'" height="2" fill="'+acc+'" opacity="0.6"/>');
      for(var b=0;b<3;b++) o.push('<circle cx="'+(x0+w*((b+0.5)/3))+'" cy="'+(y0+h*0.5)+'" r="3.4" fill="'+wood+'" opacity="0.32" stroke="'+ink+'" stroke-width="0.5"/>');
    }
    if(type==='corner'){
      var sx=x0+w*0.55;
      o.push('<line x1="'+sx+'" y1="'+y0+'" x2="'+sx+'" y2="'+(y0+h)+'" stroke="'+ink+'" stroke-width="1"/>');
      for(var hx=sx+4; hx<x0+w-1; hx+=6) o.push('<line x1="'+hx+'" y1="'+(y0+1)+'" x2="'+Math.max(hx-7,sx)+'" y2="'+(y0+h-1)+'" stroke="'+line+'" stroke-width="0.7"/>');
    }
    if(type==='gap'){
      for(var g2=-h; g2<w; g2+=7) o.push('<line x1="'+(x0+g2)+'" y1="'+(y0+h)+'" x2="'+(x0+g2+h)+'" y2="'+y0+'" stroke="'+stone+'" stroke-width="1" opacity="0.6"/>');
    }
    return '<svg viewBox="0 0 '+VBW+' '+VBH+'" role="img" aria-hidden="true">'+o.join('')+'</svg>';
  }

  function sheetSVG(items, sheetW, sheetH, trim){
    trim = trim||0;
    var VBW=230, VBH=Math.round(230*sheetH/sheetW), scale=VBW/sheetW;
    var ink='var(--ink)', line='var(--line)';
    var o = ['<rect x="0" y="0" width="'+VBW+'" height="'+VBH+'" fill="var(--surface-2)" stroke="'+ink+'" stroke-width="2"/>'];
    if(trim>0){
      var t=trim*scale;
      o.push('<rect x="'+t+'" y="'+t+'" width="'+(VBW-2*t)+'" height="'+(VBH-2*t)+'" fill="none" stroke="'+line+'" stroke-width="1" stroke-dasharray="2,2"/>');
    }
    items.forEach(function(it){
      var x=(it.x+trim)*scale, y=(it.y+trim)*scale, w=Math.max(it.w*scale-1,0), h=Math.max(it.h*scale-1,0);
      o.push('<rect class="pc" data-piece="'+escAttr(it.key||it.label||'')+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="var(--wood-soft)" stroke="'+line+'" stroke-width="1"/>');
      if(w>8 && h>8) o.push('<text class="pn" x="'+(x+1.6)+'" y="'+(y+5.2)+'" font-family="JetBrains Mono, monospace" font-size="4.6" font-weight="700" fill="'+ink+'">'+(items.indexOf(it)+1)+'</text>');
      // faint grain lines when the grain is pinned: they run along the sheet's
      // long side, which is the whole point of pinning it
      if(state.settings.grain==='length' && it.grain && w>14 && h>14){
        var horiz = sheetW>=sheetH, gl=[];
        if(horiz){ for(var gy=y+4; gy<y+h-2; gy+=5) gl.push('<line x1="'+(x+2)+'" y1="'+gy+'" x2="'+(x+w-2)+'" y2="'+gy+'"/>'); }
        else { for(var gx=x+4; gx<x+w-2; gx+=5) gl.push('<line x1="'+gx+'" y1="'+(y+2)+'" x2="'+gx+'" y2="'+(y+h-2)+'"/>'); }
        o.push('<g stroke="var(--wood)" stroke-width="0.35" opacity="0.5" pointer-events="none">'+gl.join('')+'</g>');
      }
      if(w>26 && h>11){
        var cx=x+w/2, dim=Math.round(it.w)+'×'+Math.round(it.h);
        if(w>36 && h>22 && it.label){
          var nm = it.label.length>Math.floor(w/3.3) ? it.label.slice(0,Math.max(Math.floor(w/3.3)-1,3))+'…' : it.label;
          o.push('<text x="'+cx+'" y="'+(y+h/2-2.5)+'" text-anchor="middle" font-family="Archivo, sans-serif" font-size="5.4" fill="'+ink+'">'+esc(nm)+'</text>');
          o.push('<text x="'+cx+'" y="'+(y+h/2+5.5)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="6" fill="'+ink+'">'+dim+'</text>');
        } else {
          o.push('<text x="'+cx+'" y="'+(y+h/2+2.2)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="6" fill="'+ink+'">'+dim+'</text>');
        }
      }
    });
    return '<svg viewBox="0 0 '+VBW+' '+VBH+'" role="img" aria-label="Sheet cutting layout">'+o.join('')+'</svg>';
  }

  function singleUnit(){
    var s = state.single;
    return {id:'single', type:s.type, level:s.level, name:s.name||TYPES[s.type].label,
      W:s.W, H:s.H, D:s.D, opts:s.opts};
  }

  function notesFor(u, sum){
    var S = state.standards, steps = [];
    var lazy = u.type==='corner' && (u.opts.cornerStyle||'blind')==='lazysusan';
    steps.push('Cut every panel to the sizes in the list, face up, and label each one in pencil on a raw edge.');
    if(sum.edgeMM>0) steps.push('Edge-band the faces marked in the list (about '+(sum.edgeMM/1000).toFixed(1)+' m in total), then trim flush.');
    if(u.type==='shelf' || u.type==='combo' || u.type==='wine'){
      steps.push('Drill 5 mm shelf-pin holes on the inside face of both sides on a 32 mm grid — the System 32 spacing — starting '+K.shelfSetback+' mm back from the front edge.');
    }
    if(!lazy){
      steps.push('Join the sides to the top and bottom with cam locks or glued dowels, keeping every edge flush and the box square.');
      steps.push('Check the diagonals match, then screw the back on flush to the rear edges every ~100 mm — the back is what holds the carcass square.');
    } else {
      steps.push('Screw each return panel’s back to its own rear edge, then join the two returns at the corner to make the frame the door and susan hardware mount to.');
    }
    if(u.type==='drawer' || u.type==='combo'){
      steps.push('Build each drawer box, mount the runners with '+K.slideClearanceEach+' mm clear between the carcass and the box side, then screw the front on from inside the box and set the gaps to '+state.settings.gap+' mm.');
    }
    if(u.type==='door' || u.type==='sink' || (u.type==='corner' && !lazy)){
      var hwx = hardwareFor(u), nd = (u.type==='corner') ? 1 : (u.opts.doorCount||2);
      var per = nd ? Math.round(hwx.hinge/nd) : 2;
      var dh = Math.round(u.H-2*state.settings.gap);
      var dwv = nd===1 ? u.W-2*state.settings.gap : (u.W-3*state.settings.gap)/2;
      var kg = doorWeightKg(dwv, dh, state.settings.thickness);
      steps.push('Bore 35 mm hinge cups 21.5 mm in from the door edge, 100 mm from the top and bottom'+
        (per>2 ? ' with '+(per-2)+' more spaced evenly between — '+per+' per door, for a '+dh+' mm door of about '+kg.toFixed(1)+' kg' : '')+
        '; fix the plates to the side panel and set the reveal to '+state.settings.gap+' mm all round.');
    }
    if(u.type==='sink') steps.push('Leave the top open — the two stretchers stand in for a top panel so the bowl and its plumbing drop through. Hang the tip-out tray front above the doors on tip-out hardware.');
    if(u.type==='wine') steps.push('Fit the dividers between the sides like shelves — bottles lie side by side across each row rather than in individual cubbies.');
    if(u.type==='corner'){
      steps.push(lazy
        ? 'Cut both stiles of the diagonal door to your actual corner angle on site, then fit the susan hardware and its round shelves — this planner does not size those for you.'
        : 'Screw the blind front panel on fixed — it is not hinged — over the hidden section, and hinge only the door section. A pull-out basket makes the blind cavity reachable.');
    }
    if(u.level==='wall'){
      steps.push('Hang it on its brackets with the underside at '+(S.plinth+S.baseH+S.worktopT+S.splash)+' mm above the floor — the empty carcass is about '+
        unitWeightKg(u).toFixed(0)+' kg, so use fixings rated well above that — level it, and screw it to the cabinet beside it.');
    } else {
      steps.push('Stand it on its legs, level it, clip the kickboard on in front, and screw it to the neighbouring cabinets and to the wall.');
    }
    return steps;
  }

  function singleReport(){
    var u = singleUnit(), s = state.settings;
    var qty = Math.max(1, Math.round(state.single.qty||1));
    var sum = unitSummary(u), hw = hardwareFor(u), mins = labourMinutes(u);
    var cost = unitCost(u);

    // nest just this cabinet (times the quantity) to see the sheets it needs
    var groups = {};
    for(var c=0;c<qty;c++){
      sum.parts.forEach(function(p){
        var key = String(p.thick);
        if(!groups[key]) groups[key] = [];
        for(var i=0;i<p.qty;i++) groups[key].push({w:p.w, h:p.h, label:p.name, key:'single|'+p.name, grain:grainOf(p.name)});
      });
    }
    // The workbench prices this cabinet on its own, so it always nests against
    // fresh sheets — stock you own is shared across the whole project, not
    // attributable to one cabinet.
    var plan = [], sheetCost = 0, sheets = 0;
    Object.keys(groups).sort(function(a,b){ return parseFloat(b)-parseFloat(a); }).forEach(function(th){
      var thickness = parseFloat(th);
      var bins = binsFor(thickness).filter(function(b){ return !b.onHand; });
      var packed = packSheets(groups[th], bins, s.kerf, s.trim);
      var first = packed.sheets[0] || bins[0];
      var area = (first.sheetW*first.sheetH)/1e6;
      var cost = packed.sheets.reduce(function(a,x){ return a + (x.sheetW*x.sheetH/1e6)*(x.price||0); }, 0);
      sheets += packed.count; sheetCost += cost;
      plan.push({thickness:thickness, pieceCount:groups[th].length, count:packed.count,
        sheets:packed.sheets, oversized:packed.oversized, sheetW:first.sheetW, sheetH:first.sheetH,
        unpriced: !buyRowFor(thickness),
        utilization: packed.usableArea>0 ? (packed.usedArea/packed.usableArea)*100 : 0,
        cost: cost});
    });
    return {u:u, qty:qty, sum:sum, hw:hw, minutes:mins*qty, cost:cost, plan:plan,
      sheets:sheets, sheetCost:sheetCost, notes:notesFor(u, sum)};
  }


  /* ================= interface ================= */
  var $ = function(id){ return document.getElementById(id); };
  var view = 'plan', selUnit = null, selRun = null, rafId = null, lastTotal = null;

  function findUnit(id){
    for(var i=0;i<state.runs.length;i++){
      var u = state.runs[i].units.find(function(x){ return x.id===id; });
      if(u) return {run:state.runs[i], unit:u};
    }
    return null;
  }
  function findRun(id){ return state.runs.find(function(r){ return r.id===id; }) || null; }

  // Everything recomputes live; the frame is the only thing debouncing it.
  function scheduleRender(){
    if(rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(function(){ rafId = null; render(); });
  }
  function touch(){ invalidate(); save(); scheduleRender(); }

  // Undo: a snapshot of the whole project before every structural change
  // (add, remove, move, paste) — not per keystroke, which would make Ctrl+Z
  // step back one digit at a time. Capped so the stack cannot grow forever.
  var undoStack = [], redoStack = [];
  function snapshot(){
    undoStack.push(JSON.stringify({runs:state.runs, single:state.single, settings:state.settings, standards:state.standards}));
    if(undoStack.length>40) undoStack.shift();
    redoStack.length = 0;
  }
  function restore(json){
    var o = JSON.parse(json);
    state.runs = o.runs; state.single = o.single; state.settings = o.settings; state.standards = o.standards;
    selUnit = findUnit(selUnit) ? selUnit : null;
    selRun = findRun(selRun) ? selRun : null;
    invalidate(); save(); render(true);
    if($('drawer').classList.contains('on')) renderSettings();
  }
  function undo(){
    if(!undoStack.length){ toast('Nothing to undo'); return; }
    redoStack.push(JSON.stringify({runs:state.runs, single:state.single, settings:state.settings, standards:state.standards}));
    restore(undoStack.pop()); toast('Undone');
  }
  function redo(){
    if(!redoStack.length) return;
    undoStack.push(JSON.stringify({runs:state.runs, single:state.single, settings:state.settings, standards:state.standards}));
    restore(redoStack.pop()); toast('Redone');
  }
  function toast(msg, ms){
    var t = $('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, ms||1900);
  }

  function select(unitId, runId){
    selUnit = unitId || null;
    var f = unitId ? findUnit(unitId) : null;
    selRun = runId || (f ? f.run.id : null);
    scheduleRender();
    // Below the split layout the inspector sits under the canvas, so a tap on
    // a cabinet would otherwise change something far off screen.
    if(selUnit && window.matchMedia('(max-width:1040px)').matches){
      requestAnimationFrame(function(){
        var ins = $('inspector');
        if(ins) ins.scrollIntoView({behavior:'smooth', block:'start'});
      });
    }
  }

  /* ---------------- readouts ---------------- */
  function renderReadouts(){
    var c = compute();
    var html =
      ro('Cabinets', c.unitCount) +
      ro('Sheets', c.sheetsToBuy) +
      ro('Board', c.area.toFixed(1)+' m²') +
      ro('Total', money0(c.total), true);
    $('readouts').innerHTML = html;
    if(lastTotal!==null && Math.abs(lastTotal-c.total)>0.005){
      var hero = document.querySelector('.ro.hero');
      if(hero){ hero.classList.remove('pulse'); void hero.offsetWidth; hero.classList.add('pulse'); }
    }
    lastTotal = c.total;
  }
  function ro(k,v,hero){
    return '<div class="ro'+(hero?' hero':'')+'"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';
  }

  /* ---------------- plan view ---------------- */
  function fitChip(run){
    var g = runGeometry(run);
    if(g.floorGap < -1) return '<span class="chip bad">'+mm(-g.floorGap)+' over</span>';
    if(g.floorFiller>0) return '<span class="chip warn">'+mm(g.floorFiller)+' filler</span>';
    if(g.floorGap>1)    return '<span class="chip warn">'+mm(g.floorGap)+' free</span>';
    return '<span class="chip ok">exact fit</span>';
  }
  function runNotes(run){
    var g = runGeometry(run), s = state.settings, out = [];
    if(g.floorGap < -1) out.push('<div class="note bad">The floor row is '+mm(-g.floorGap)+' longer than the wall.</div>');
    else if(g.floorGap > s.fillerMax) out.push('<div class="note warn">'+mm(g.floorGap)+' of wall still free — too wide for a scribe filler.</div>');
    if(g.wallGap < -1) out.push('<div class="note bad">The wall row overhangs by '+mm(-g.wallGap)+'.</div>');
    if(g.clash) out.push('<div class="note warn">A wall unit sits in front of a tall unit — reorder the wall row.</div>');
    return out.length ? '<div class="body tight">'+out.join('')+'</div>' : '';
  }

  function unitRow(u){
    var t = TYPES[u.type];
    return '<div class="urow'+(u.id===selUnit?' sel':'')+'" data-unit="'+u.id+'" draggable="true">'+
      '<span class="grip" aria-hidden="true">⠿</span>'+
      '<span class="badge '+u.level+'">'+t.code+'</span>'+
      '<span class="nm">'+esc(u.name||t.label)+'</span>'+
      '<span class="dim">'+u.W+'×'+u.H+'×'+u.D+'</span>'+
      '<span class="cost">'+(u.type==='gap' ? '—' : money(unitCost(u).total))+'</span>'+
    '</div>';
  }

  function renderPlan(){
    if(!state.runs.length){
      return '<div class="card"><div class="empty">No runs yet — add a wall to start laying cabinets along it.'+
        '<div style="margin-top:14px;"><button type="button" class="btn primary" data-act="add-run">Add a wall run</button></div></div></div>';
    }
    var maxLen = state.runs.reduce(function(a,r){ return Math.max(a, r.wallLength); }, 1000);
    return state.runs.map(function(run){
      return '<section class="card run'+(run.id===selRun&&!selUnit?' sel':'')+'" data-run="'+run.id+'">'+
        '<header>'+
          '<input class="runname" data-rfield="name" value="'+escAttr(run.name)+'" aria-label="Run name">'+
          '<span class="inrow"><input type="number" inputmode="decimal" data-rfield="wallLength" value="'+run.wallLength+'" min="300" max="12000" step="10" style="width:88px" aria-label="Wall length"><span class="unit screen-only">mm</span>'+
            '<span class="print-only wallprint">'+run.wallLength+' mm wall</span></span>'+
          '<span data-fit>'+fitChip(run)+'</span>'+
          '<button type="button" class="xbtn" data-act="del-run" title="Remove run">✕</button>'+
        '</header>'+
        '<div class="elevwrap" data-elev>'+elevationSVG(run, maxLen)+
          '<div class="legend">'+
            '<span><i style="background:var(--board);border-color:var(--board-line)"></i>Front</span>'+
            '<span><i style="background:var(--panel-3)"></i>Carcass</span>'+
            '<span><i style="background:var(--panel-2);border-color:var(--ink-3)"></i>Worktop</span>'+
            '<span class="screen-only">Click a cabinet to edit it</span>'+
          '</div>'+
        '</div>'+
        '<div data-notes>'+runNotes(run)+'</div>'+
        '<div data-units>'+(run.units.length ? '<div class="unitlist">'+run.units.map(unitRow).join('')+'</div>'
                          : '<div class="empty">Nothing on this wall yet.</div>')+'</div>'+
        '<div class="body tight"><button type="button" class="btn sm" data-act="add-unit">+ Add cabinet</button></div>'+
      '</section>';
    }).join('') +
    '<div class="btnrow"><button type="button" class="btn primary" data-act="add-run">+ Add a wall run</button>'+
    '<button type="button" class="btn ghost danger" data-act="clear">Clear project</button></div>';
  }

  /* ---------------- cut list view ---------------- */
  function pieceKey(u, part){ return (u.name||TYPES[u.type].label)+' — '+part.name; }

  function renderCut(){
    var c = compute(), s = state.settings;
    if(!state.runs.length) return '<div class="card"><div class="empty">Add a run first.</div></div>';

    var plan = c.plan.map(function(g){
      var tiles = g.sheets.map(function(sh,i){
        // pieces in cutting order — row by row, left to right — so the numbers
        // on the drawing and in the list below it agree
        var items = sh.items.slice().sort(function(a,b){ return a.y-b.y || a.x-b.x; });
        var list = items.map(function(it,k){
          var lab = it.label||'', cut = lab.indexOf(' \u2014 ');
          var cab = cut>=0 ? lab.slice(0,cut) : '', part = cut>=0 ? lab.slice(cut+3) : lab;
          return '<tr><td class="n">'+(k+1)+'</td><td>'+esc(part)+'</td><td><small>'+esc(cab)+'</small></td>'+
            '<td class="n">'+Math.round(it.w)+'</td><td class="n">'+Math.round(it.h)+'</td><td><small>'+(it.turned?'turned 90\u00b0':'')+'</small></td></tr>';
        }).join('');
        var status = sh.onHand ? 'from stock' : sh.precut ? 'buy these pieces pre-cut' : 'to buy';
        return '<div class="sh'+(i>=8?' xtra':'')+(sh.onHand?' stock':'')+(sh.precut?' precut':'')+'">'+
          '<div class="cap">'+sheetTileLabel(sh,i,g.sheets.length)+'</div>'+
          '<div class="print-only sheethead"><b>'+g.thickness+' mm \u2014 sheet '+(i+1)+' of '+g.sheets.length+'</b>'+
            '<span>'+sh.sheetW+' \u00d7 '+sh.sheetH+' mm \u00b7 '+status+' \u00b7 '+Math.round(sh.fill*100)+'% used \u00b7 '+items.length+' pieces</span></div>'+
          sheetSVG(items, sh.sheetW, sh.sheetH, s.trim)+
          '<div class="print-only sheetlist"><table class="dt"><thead><tr><th class="n">#</th><th>Part</th><th>Cabinet</th><th class="n">W</th><th class="n">H</th><th></th></tr></thead>'+
            '<tbody>'+list+'</tbody></table></div>'+
        '</div>';
      }).join('');
      var more = g.sheets.length>8 ? '<div class="sh more"><div class="cap">+'+(g.sheets.length-8)+' more</div><div class="empty" style="padding:26px 6px">shown when printed</div></div>' : '';
      return '<div class="grp">'+
        '<div class="grp-head"><b>'+g.thickness+' mm</b><span>'+g.pieceCount+' pieces · '+sheetPhrase(g)+' · '+g.utilization.toFixed(0)+'% used · '+(g.unpriced?'not priced':money(g.cost))+'</span></div>'+
        (g.unpriced ? '<div class="note info">No stock row for '+g.thickness+' mm — planned on your default '+s.defaultSheetW+'×'+s.defaultSheetH+' sheet, not priced.</div>' : '')+
        (g.oversized.length ? '<div class="note bad">'+g.oversized.length+' piece(s) fit no available sheet.</div>' : '')+
        '<div class="strip">'+tiles+more+'</div></div>';
    }).join('');

    var byRun = {};
    c.lines.forEach(function(l){ (byRun[l.run.id] = byRun[l.run.id] || []).push(l); });

    var parts = state.runs.map(function(run){
      var lines = byRun[run.id]; if(!lines) return '';
      var body = lines.map(function(l){
        if(!l.sum.parts.length) return '';
        var u = l.unit;
        var head = u
          ? '<tr class="grp"><td colspan="7">'+esc(u.name||TYPES[u.type].label)+' <span class="badge '+u.level+'">'+TYPES[u.type].code+'</span> <small>'+u.W+'×'+u.H+'×'+u.D+' mm</small></td></tr>'
          : '<tr class="grp"><td colspan="7">Run extras</td></tr>';
        // one body per cabinet, so a cabinet's parts print on one page
        return '<tbody>'+head + l.sum.parts.map(function(p){
          var key = (u ? u.id : run.id)+'|'+p.name;
          return '<tr data-piece="'+escAttr(key)+'"><td>'+esc(p.name)+'</td><td class="n">'+p.qty+'</td>'+
            '<td class="n">'+p.w+'</td><td class="n">'+p.h+'</td><td class="n">'+p.thick+'</td>'+
            '<td class="n">'+p.area.toFixed(2)+'</td><td><small>'+esc(partNote(p))+'</small></td></tr>';
        }).join('')+'</tbody>';
      }).join('');
      if(!body) return '';
      return '<section class="card"><header><h2>'+esc(run.name)+'</h2><span class="sub">'+run.units.length+' units</span></header>'+
        '<div class="tw"><table class="dt"><thead><tr><th>Part</th><th class="n">Qty</th><th class="n">W</th><th class="n">H</th><th class="n">T</th><th class="n">m²</th><th>Note</th></tr></thead>'+
        body+'</table></div></section>';
    }).join('');

    var summary = '<div class="print-only printsummary"><table class="dt"><thead><tr><th>Board</th><th class="n">Pieces</th><th class="n">Sheets</th><th class="n">From stock</th><th class="n">To buy</th><th class="n">Used</th><th class="n">Cost</th></tr></thead><tbody>'+
      c.plan.map(function(g){
        return '<tr><td>'+g.thickness+' mm</td><td class="n">'+g.pieceCount+'</td><td class="n">'+g.needed+'</td><td class="n">'+g.onHandUsed+'</td>'+
          '<td class="n">'+g.toBuy+(g.precutCount?' + '+g.precutArea.toFixed(2)+' m\u00b2 pre-cut':'')+'</td><td class="n">'+g.utilization.toFixed(0)+'%</td>'+
          '<td class="n">'+(g.unpriced?'not priced':money(g.cost))+'</td></tr>';
      }).join('')+'</tbody></table>'+
      c.plan.filter(function(g){ return g.oversized.length; }).map(function(g){
        return '<p class="hint" style="margin:10px 0 0;color:var(--bad)"><b>'+g.oversized.length+' piece(s) of '+g.thickness+' mm fit no available sheet</b> \u2014 check the stock sizes before cutting.</p>';
      }).join('')+
      '<p class="hint" style="margin:10px 0 0">One sheet per page follows, each with its pieces numbered in cutting order \u2014 row by row, left to right. Rows are full-width cuts; pieces within a row are cut across the strip.</p></div>';
    return '<section class="card"><header><h2>Cutting plan</h2>'+
        '<span class="sub">'+c.pieces+' pieces · '+c.area.toFixed(2)+' m² · '+c.sheetsToBuy+' to buy</span>'+
        '<button type="button" class="btn sm ghost" data-act="copy" data-kind="cut">Copy as spreadsheet</button>'+
        '<button type="button" class="btn sm ghost" data-act="print">Print</button></header>'+
        '<div class="body">'+summary+plan+'</div></section>' + parts;
  }

  /* ---------------- order view ---------------- */
  function renderOrder(){
    var c = compute(), s = state.settings, S = state.standards;
    if(!state.runs.length) return '<div class="card"><div class="empty">Add a run first.</div></div>';

    var sheetRows = c.plan.map(function(g){
      var sizes = g.buySizes.length ? g.buySizes.map(function(x){ return x.qty+' × '+x.sheetW+'×'+x.sheetH; }).join('<br>') : '<small>none</small>';
      var row = '<tr><td>'+g.thickness+' mm board<br><small>'+sizes+'</small></td>'+
        '<td class="n">'+g.needed+'</td><td class="n">'+g.onHandUsed+'</td><td class="n">'+g.toBuy+'</td>'+
        '<td class="n">'+(g.unpriced?'—':money(priceFor(g.thickness))+'/m²')+'</td>'+
        '<td class="n">'+(g.unpriced?'not priced':money(g.cost-g.precutCost))+'</td></tr>';
      if(g.precutCount>0){
        row += '<tr><td style="padding-left:22px">↳ pre-cut to size<br><small>'+g.precutCount+' barely-used sheet'+(g.precutCount===1?'':'s')+'</small></td>'+
          '<td class="n">—</td><td class="n">—</td><td class="n">'+g.precutArea.toFixed(2)+' m²</td>'+
          '<td class="n">'+money(g.precutRate)+'/m²</td><td class="n">'+money(g.precutCost)+'</td></tr>';
      }
      return row;
    }).join('');

    var hw = c.hwRows.map(function(r){
      return '<tr><td>'+esc(r.label)+(r.custom?' <span class="badge">yours</span>':'')+'</td><td class="n">'+r.qty+'</td><td>'+r.unit+'</td>'+
        '<td class="n">'+money(r.price)+'</td><td class="n">'+money(r.cost)+'</td></tr>';
    }).join('');

    var units = c.lines.filter(function(l){ return l.unit && l.unit.type!=='gap'; }).map(function(l){
      var uc = unitCost(l.unit);
      return '<tr data-unit="'+l.unit.id+'" style="cursor:pointer"><td>'+esc(l.unit.name||TYPES[l.unit.type].label)+'<br><small>'+esc(l.run.name)+' · '+unitWeightKg(l.unit).toFixed(0)+' kg</small></td>'+
        '<td class="n">'+money(uc.material)+'</td><td class="n">'+money(uc.hardware)+'</td>'+
        (s.edgeOn ? '<td class="n">'+money(uc.edge)+'</td>' : '')+(s.labourOn ? '<td class="n">'+money(uc.labour)+'</td>' : '')+
        '<td class="n">'+money(uc.total)+'</td></tr>';
    }).join('');

    return '<section class="card"><header><h2>Totals</h2><span class="sub">'+esc(s.project||'Project')+'</span>'+
        '<button type="button" class="btn sm ghost" data-act="copy" data-kind="order">Copy as spreadsheet</button>'+
        '<button type="button" class="btn sm ghost" data-act="print">Print</button></header>'+
      '<div class="body"><div class="tiles">'+
        tile('Sheet material', money(c.sheetCost), c.sheetsToBuy+' to buy')+
        tile('Hardware', money(c.hwCost), c.hwRows.length+' lines')+
        (s.edgeOn ? tile('Edge banding', money(c.edgeCost), c.edgeM.toFixed(1)+' m') : '')+
        (s.worktopOn ? tile('Worktop', money(c.worktopCost), c.worktopArea.toFixed(2)+' m²') : '')+
        (s.labourOn ? tile('Shop time', money(c.labourCost), c.hours.toFixed(1)+' h') : '')+
        '<div class="tile hero"><span class="k">Project total</span><span class="v">'+money(c.total)+'</span><span class="s">'+c.unitCount+' cabinets</span></div>'+
      '</div></div></section>'+

      '<section class="card"><header><h2>Sheets to order</h2><span class="sub">'+money(c.sheetCost)+'</span></header>'+
        '<div class="tw"><table class="dt"><thead><tr><th>Board</th><th class="n">Needed</th><th class="n">Stock</th><th class="n">Buy</th><th class="n">Price</th><th class="n">Cost</th></tr></thead>'+
        '<tbody>'+sheetRows+
        (s.edgeOn ? '<tr class="grp"><td>Edge banding <small>'+s.edgeThickness+' mm</small></td><td class="n">'+c.edgeM.toFixed(1)+' m</td><td class="n">—</td><td class="n">'+Math.ceil(c.edgeM)+' m</td><td class="n">'+money(s.edgePrice)+'/m</td><td class="n">'+money(c.edgeCost)+'</td></tr>' : '')+
        '</tbody></table></div></section>'+

      '<section class="card"><header><h2>Hardware</h2><span class="sub">'+money(c.hwCost)+'</span></header>'+
        '<div class="tw"><table class="dt"><thead><tr><th>Item</th><th class="n">Qty</th><th>Unit</th><th class="n">Price</th><th class="n">Cost</th></tr></thead>'+
        '<tbody>'+(hw||'<tr><td colspan="5">Nothing yet.</td></tr>')+'</tbody></table></div></section>'+

      (s.worktopOn ? '<section class="card"><header><h2>Worktop</h2><span class="sub">'+money(c.worktopCost)+'</span></header>'+
        '<div class="body"><p class="hint" style="margin:0">'+(c.worktopLen/1000).toFixed(2)+' m of run at '+S.worktopD+' mm deep — '+c.worktopArea.toFixed(2)+' m² at '+money(s.worktopPrice)+'/m². Cut-outs and joints are not priced.</p></div></section>' : '')+

      '<section class="card"><header><h2>Cost per cabinet</h2><span class="sub screen-only">click a row to edit</span></header>'+
        '<div class="tw"><table class="dt"><thead><tr><th>Cabinet</th><th class="n">Board</th><th class="n">Hardware</th>'+
          (s.edgeOn?'<th class="n">Edging</th>':'')+(s.labourOn?'<th class="n">Labour</th>':'')+'<th class="n">Total</th></tr></thead>'+
        '<tbody>'+units+'</tbody></table></div></section>';
  }
  function tile(k,v,s2){ return '<div class="tile"><span class="k">'+k+'</span><span class="v">'+v+'</span>'+(s2?'<span class="s">'+s2+'</span>':'')+'</div>'; }

  /* ---------------- bench view ---------------- */
  function renderBench(){

            return '<option value="'+l+'"'+(l===sg.level?' selected':'')+'>'+LEVELS[l].label+'</option>'; }).join('')+'</select></div>'+
          '<div class="field"><label>How many</label><input type="number" inputmode="decimal" data-sf="qty" value="'+sg.qty+'" min="1" max="50"></div>'+

          numIn('sf','W','Width', sg.W,'mm')+numIn('sf','H','Height', sg.H,'mm')+numIn('sf','D','Depth', sg.D,'mm')+
        '</div>'+
        '<div class="field"><label>Options</label>'+optsHTML(u,'so')+'</div>'+
        '<div class="btnrow">'+
          '<button type="button" class="btn sm" data-act="bench-preset" data-level="base">Base</button>'+
          '<button type="button" class="btn sm" data-act="bench-preset" data-level="wall">Wall</button>'+

              return '<option value="'+rn.id+'">'+esc(rn.name)+'</option>'; }).join('')+'</select>'+
            '<button type="button" class="btn primary sm" data-act="bench-add">Add to run</button>' : '')+

        '<button type="button" class="btn sm ghost" data-act="print">Print</button></header>'+
        '<div class="body">'+
          '<div class="tiles" style="margin-bottom:12px">'+
            tile('Board', (r.sum.area*r.qty).toFixed(2)+' m²', r.sum.pieces*r.qty+' pieces')+
            (s.edgeOn ? tile('Edging', ((r.sum.edgeMM/1000)*r.qty).toFixed(1)+' m','') : '')+
            tile('Sheets', r.sheets, money(r.sheetCost))+
            tile('Weight', unitWeightKg(u).toFixed(1)+' kg', 'board only')+
            '<div class="tile hero"><span class="k">'+(r.qty>1?'For '+r.qty:'Cabinet')+'</span><span class="v">'+money(r.cost.total*r.qty)+'</span><span class="s">'+money(r.cost.total)+' each</span></div>'+
          '</div>'+

            '<tbody>'+(partRows||'<tr><td colspan="7">Nothing to cut.</td></tr>')+'</tbody></table></div>'+
          '</div>'+

      (hwRows ? '<section class="card"><header><h2>Hardware</h2><span class="sub">'+money(r.cost.hardware*r.qty)+'</span></header>'+

      '<section class="card"><header><h2>Build order</h2><span class="sub">'+r.notes.length+' steps</span></header>'+

      '</div>';
  }
  function benchOutHTML(){
    var tmp = document.createElement('div');
    tmp.innerHTML = renderBench();
    var out = tmp.querySelector('#bench-out');

  }

  function numIn(scope, key, label, val, unit, min, max, step){
    return '<div class="field"><label>'+label+'</label><div class="inrow">'+
      '<input type="number" inputmode="decimal" data-'+scope+'="'+key+'" value="'+val+'"'+
      (min!==undefined?' min="'+min+'"':' min="1"')+(max!==undefined?' max="'+max+'"':'')+' step="'+(step||1)+'">'+
      (unit?'<span class="unit">'+unit+'</span>':'')+'</div></div>';
  }

  function optsHTML(u, scope){
    var o = u.opts, h = '';
    function n(key,label,val,min,max){
      return '<div class="field" style="margin:0"><label>'+label+'</label><input type="number" inputmode="decimal" data-'+scope+'="'+key+'" value="'+val+'" min="'+min+'" max="'+max+'"></div>';
    }
    function sel(key,label,items,cur){
      return '<div class="field" style="margin:0"><label>'+label+'</label><select data-'+scope+'="'+key+'">'+
        items.map(function(it){ return '<option value="'+it.v+'"'+(String(it.v)===String(cur)?' selected':'')+'>'+it.t+'</option>'; }).join('')+'</select></div>';
    }
    if(u.type==='shelf')  h += n('shelfCount','Shelves',o.shelfCount,0,20);
    if(u.type==='drawer') h += n('drawerCount','Drawers',o.drawerCount,1,12);
    if(u.type==='door' || u.type==='sink') h += sel('doorCount','Doors',[{v:1,t:'1 single'},{v:2,t:'2 double'}], o.doorCount||2);
    if(u.type==='combo')  h += n('drawerZone','Zone mm',o.drawerZone,100,2000)+n('drawerCount','Drawers',o.drawerCount,1,8)+n('shelfCount','Shelves',o.shelfCount,0,10);
    if(u.type==='wine')   h += n('wineRows','Rows',o.wineRows,1,20);
    if(u.type==='corner') h += sel('cornerStyle','Style',[{v:'blind',t:'Blind corner'},{v:'lazysusan',t:'Lazy susan'}], o.cornerStyle||'blind')+n('doorWidth','Door W',o.doorWidth||450,200,900);
    if(u.type==='gap')    h += sel('appliance','Appliance',[{v:'under',t:'Under counter'},{v:'tall',t:'Full height'}], o.appliance||'under');
    return h ? '<div class="g3">'+h+'</div>' : '<p class="hint" style="margin:0">No options for this type.</p>';
  }

  /* ---------------- render ---------------- */
  // A caret cannot be restored inside a number input — the browser refuses to
  // report its position — so a field being typed into is never rebuilt. While
  // focus is in a form, only what is derived from it is refreshed: the
  // drawing, the chips, the notes, the totals.
  function buildView(){
    return view==='plan' ? renderPlan() : view==='cut' ? renderCut() : view==='order' ? renderOrder() : renderBench();
  }
  function refreshCanvas(){
    if(view==='plan'){
      var maxLen = state.runs.reduce(function(a,r){ return Math.max(a, r.wallLength); }, 1000);
      state.runs.forEach(function(run){
        var card = document.querySelector('[data-run="'+run.id+'"]');
        if(!card) return;
        var e1 = card.querySelector('[data-elev] .elev');
        if(e1) e1.outerHTML = elevationSVG(run, maxLen);
        var f1 = card.querySelector('[data-fit]');
        if(f1) f1.innerHTML = fitChip(run);
        var n1 = card.querySelector('[data-notes]');
        if(n1) n1.innerHTML = runNotes(run);
        var u1 = card.querySelector('[data-units]');
        if(u1) u1.innerHTML = run.units.length ? '<div class="unitlist">'+run.units.map(unitRow).join('')+'</div>'
                                               : '<div class="empty">Nothing on this wall yet.</div>';
      });
      return;
    }
    if(view==='bench'){
      var out = document.getElementById('bench-out');
      if(out){ out.innerHTML = benchOutHTML(); return; }
    }
    $('canvas').innerHTML = buildView();
  }
  function refreshInspector(){

        '<div class="tile"><span class="k">Weight</span><span class="v">'+unitWeightKg(f.unit).toFixed(1)+' kg</span><span class="s">board only, empty</span></div></div>';
    }

  function renderPrintHead(){
    var c = compute(), s = state.settings;
    var title = view==='plan' ? 'Kitchen plan' : view==='cut' ? 'Cut list & cutting plan' : view==='order' ? 'Order list' : 'Cabinet plan';
    var d = new Date(), date = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    $('print-head').innerHTML =

  function render(force){

  /* ---------------- project files ----------------
     Projects live in this browser's storage only. A project file is how one
     moves between the phone, the tablet and the PC — or gets kept for good. */
  var FILE_KIND = 'kitchen-run-studio/project';
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  function isStandalone(){
    return navigator.standalone===true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }
  function projectFileName(){
    var n = String(state.settings.project||'kitchen').replace(/[\\\/:*?"<>|]+/g,' ').trim().replace(/\s+/g,'-').slice(0,60);
    return (n||'kitchen')+'.kitchen.json';
  }
  function projectFileText(){
    return JSON.stringify({kind:FILE_KIND, app:'Kitchen Run Studio', version:APP_VERSION, savedAt:new Date().toISOString(),
      project:{runs:state.runs, single:state.single, settings:state.settings, standards:state.standards}}, null, 1);
  }
  function saveProjectFile(){
    downloadText(projectFileText(), projectFileName());
  }
  function downloadText(text, name){
    // on claude.ai the page hands the file to the viewer through the platform
    if(window.claude && typeof window.claude.use==='function'){
      window.claude.use('downloads').then(function(dl){
        if(!dl) return plainDownload(text, name);
        return dl.save({filename:name, data:text}).then(function(){ toast('Saved '+name); })
          .catch(function(e){
            var code = e && e.code;
            if(code==='declined' || code==='rate_limited') return;
            if(code==='unavailable' || code==='not_granted' || code==='capability_disabled' || code==='capability_removed') return plainDownload(text, name);
            toast('Could not save the file');
          });
      }).catch(function(){ plainDownload(text, name); });
      return;
    }
    plainDownload(text, name);
  }
  function plainDownload(text, name){
    var blob = new Blob([text], {type:'application/json'});
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
    toast('Saved '+name);
  }
  function readProjectFile(file){
    if(!file) return;
    var r = new FileReader();
    r.onload = function(){ importProject(String(r.result||''), file.name); };
    r.onerror = function(){ toast('Could not read '+file.name); };
    r.readAsText(file);
  }
  function importProject(text, name){
    var o;
    try{ o = JSON.parse(text); }catch(e){ toast('That is not a project file'); return; }
    var p = o && o.project ? o.project : o;
    if(!p || !Array.isArray(p.runs) || !p.settings || typeof p.settings!=='object'){ toast('That is not a Kitchen Run project file'); return; }
    snapshot();
    state.runs = p.runs; state.settings = p.settings;
    state.standards = p.standards || JSON.parse(JSON.stringify(DEFAULT_STANDARDS));
    state.single = p.single || JSON.parse(JSON.stringify(DEFAULT_SINGLE));
    normalize();
    selUnit = null; selRun = null; pickerFor = null;
    invalidate(); save(); render(true);
    if($('drawer').classList.contains('on')) renderSettings();
    toast('Opened '+(name||'project')+' — Ctrl+Z brings the previous project back', 3200);
  }
  $('file-in').addEventListener('change', function(){ readProjectFile(this.files && this.files[0]); this.value = ''; });

    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];

  /* ---------------- installable app ----------------
     Served from a website with sw.js beside it, the page installs as an app
     and works offline. Elsewhere (a local file, the claude.ai page) this is
     simply skipped. */
  var deferredInstall = null, wantReload = false;
  function showUpdate(onReload){
    var u = $('update'); u.classList.add('on');
    u.querySelector('button').onclick = function(){ u.classList.remove('on'); onReload(); };
  }
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude\.ai$/.test(location.hostname)){
    // listen before anything else: the worker may report a newer page while
    // this one is still loading, and messages wait until startMessages()
    navigator.serviceWorker.addEventListener('message', function(e){
      if(e.data && e.data.type==='index-updated') showUpdate(function(){ location.reload(); });
    });
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(!wantReload) return; wantReload = false; location.reload();
    });
    if(navigator.serviceWorker.startMessages) navigator.serviceWorker.startMessages();
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        function watch(w){
          w.addEventListener('statechange', function(){
            if(w.state==='installed' && navigator.serviceWorker.controller){
              showUpdate(function(){ wantReload = true; if(reg.waiting) reg.waiting.postMessage('skipWaiting'); else location.reload(); });
            }
          });
        }
        if(reg.waiting && navigator.serviceWorker.controller){
          showUpdate(function(){ wantReload = true; reg.waiting.postMessage('skipWaiting'); });
        }
        if(reg.installing) watch(reg.installing);
        reg.addEventListener('updatefound', function(){ if(reg.installing) watch(reg.installing); });

      '</div></details>'+

      '<details class="grp-set"><summary>Hardware prices</summary><div class="in">'+
        HW.map(function(i){
          return '<div class="hwline"><span class="n">'+i.label+'<small>per '+i.unit+'</small></span>'+
            '<input type="number" inputmode="decimal" data-hw="'+i.k+'" value="'+s.hw[i.k]+'" min="0" step="0.05"></div>';
        }).join('')+
        '<p class="hint" style="margin-top:12px">Anything else the job needs — name it yourself.</p>'+
        custom+
        '<button type="button" class="btn sm ghost full" data-act="add-custom">+ Add your own line</button>'+
      '</div></details>'+

      '<details class="grp-set"><summary>How it calculates</summary><div class="in">'+
        '<p class="hint" style="margin:0">'+assumptions()+'</p>'+
        '<div class="btnrow" style="margin-top:10px"><button type="button" class="btn sm ghost" data-act="undo">Undo last change (Ctrl+Z)</button></div>'+
      '</div></details>'+
      '<details class="grp-set"><summary>Worktop, labour &amp; currency</summary><div class="in">'+
        sw('worktopOn','Include a worktop','Adds it to the costs', s.worktopOn)+
        (s.worktopOn ? nf('worktopPrice','Worktop price', s.worktopPrice,'per m²',0,undefined,5) : '')+
        sw('labourOn','Include shop time','45 min a carcass, 15 a door, 25 a drawer', s.labourOn)+
        (s.labourOn ? nf('labourRate','Shop rate', s.labourRate,'per h',0,undefined,5) : '')+
        '<div class="field"><label>Currency</label><select data-set="currency">'+
          Object.keys(CUR).map(function(k){ return '<option value="'+k+'"'+(s.currency===k?' selected':'')+'>'+k+'</option>'; }).join('')+
        '</select></div>'+
      '</div></details>'+
      appGroup();
  }

  // Refresh just the stock warnings, so they follow what is typed without
  // rebuilding the field under the caret.
  function updateStockWarnings(){
    var n = document.getElementById('thick-notes');
    if(!n) return;
    var s = state.settings;
    n.innerHTML = thickWarn(s.thickness,'the carcass is') + thickWarn(s.back,'the back panel is') +
                  thickWarn(s.drawerBox,'drawer boxes are');
  }
  function assumptions(){
    var S = state.standards, s = state.settings;
    return 'Frameless (System 32) construction. Sizes are exterior carcass sizes; the back is cut full size and screwed to the rear edges. '+
      'Fronts are full overlay with a '+s.gap+' mm gap at every edge and between neighbours. '+
      (s.edgeOn ? 'Edge banding is on at '+s.edgeThickness+' mm: banded panels are cut undersize by that much per banded edge and the list shows both sizes. '
                : 'Edge banding is off: panels are cut at their finished size. ')+
      'Hinges: 35 mm cups bored 21.5 mm from the door edge and 100 mm from each end, the count from the door\u2019s height and weight (board at '+s.density+' kg/m\u00b3). '+
      'Drawer boxes allow '+K.slideClearanceEach+' mm each side and '+K.slideDepthClearance+' mm of depth for runners, on '+s.drawerBox+' mm board; fronts stay on the carcass board. Shelves sit on 5 mm pins in a 32 mm grid. '+
      (s.baseType==='ladder' ? 'The run stands on a ladder-frame base set back '+s.toeRecess+' mm, no legs. ' : 'The run stands on adjustable legs with a continuous kickboard cut into pieces of at most '+K.kickMaxPiece+' mm. ')+
      'A gap at the end of a run under '+s.fillerMax+' mm becomes a scribe filler. '+
      (s.worktopOn ? 'The worktop covers base units and under-counter appliances at '+S.worktopD+' mm deep. ' : 'No worktop is costed. ')+
      'Nesting: first-fit decreasing-height shelf packing with kerf and trim, a two-stage guillotine pattern a panel saw can actually cut, stock you own used first (smallest first) and the largest row of a thickness bought. '+
      (s.grain==='length' ? 'Grain is pinned along the sheet, so no part is turned. ' : 'Parts may be turned 90\u00b0 to fit. ')+
      (s.precutOn ? 'A sheet under '+s.precutThreshold+'% full is bought as parts cut to size at its pre-cut rate when that is cheaper. ' : '')+
      'A planning estimate \u2014 check hardware specs and wall measurements on site before cutting.';
  }
  // Copies a table as tab-separated text — it pastes straight into Excel,
  // Numbers or Sheets as columns, which is how a cut list reaches a supplier.
  function copyTable(kind){
    var c = compute(), s = state.settings, rows = [];
    if(kind==='cut'){
      rows.push(['Run','Cabinet','Part','Qty','W mm','H mm','T mm','m²','Note']);
      c.lines.forEach(function(l){
        var who = l.unit ? (l.unit.name||TYPES[l.unit.type].label) : 'Run extras';
        l.sum.parts.forEach(function(p){
          rows.push([l.run.name, who, p.name, p.qty, p.w, p.h, p.thick, p.area.toFixed(3), partNote(p)]);
        });
      });
    } else {
      rows.push(['Item','Detail','Qty','Unit','Unit price','Cost']);
      c.plan.forEach(function(g){
        g.buySizes.forEach(function(b){ rows.push([g.thickness+' mm board', b.sheetW+' x '+b.sheetH+' mm', b.qty, 'sheet', g.unpriced?'':priceFor(g.thickness)+'/m²', g.unpriced?'':(b.qty*b.sheetW*b.sheetH/1e6*priceFor(g.thickness)).toFixed(2)]); });
        if(g.precutCount>0) rows.push([g.thickness+' mm pre-cut to size','', g.precutArea.toFixed(2), 'm²', g.precutRate, g.precutCost.toFixed(2)]);
      });
      if(s.edgeOn) rows.push(['Edge banding', s.edgeThickness+' mm', Math.ceil(c.edgeM), 'm', s.edgePrice, c.edgeCost.toFixed(2)]);
      c.hwRows.forEach(function(r){ rows.push([r.label,'', r.qty, r.unit, r.price, r.cost.toFixed(2)]); });
      if(s.worktopOn) rows.push(['Worktop', Math.round(c.worktopLen)+' mm x '+state.standards.worktopD+' mm', c.worktopArea.toFixed(2), 'm²', s.worktopPrice, c.worktopCost.toFixed(2)]);
      if(s.labourOn) rows.push(['Shop time','', c.hours.toFixed(1), 'h', s.labourRate, c.labourCost.toFixed(2)]);
      rows.push(['Total','','','','', c.total.toFixed(2)]);
    }
    var tsv = rows.map(function(r){ return r.map(function(v){ return String(v==null?'':v).replace(/\t|\n/g,' '); }).join('\t'); }).join('\n');
    var done = function(){ toast('Copied — paste into a spreadsheet'); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(tsv).then(done, function(){ fallbackCopy(tsv, done); }); }
    else fallbackCopy(tsv, done);
  }
  function fallbackCopy(text, done){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy failed'); }
    document.body.removeChild(ta);
  }
  function openSettings(on){
    $('drawer').classList.toggle('on', on);
    $('scrim').classList.toggle('on', on);
    if(on) renderSettings();
  }

  /* ---------------- bindings ---------------- */
  // digits only in number fields
  document.addEventListener('keydown', function(e){
    var t = e.target;
    if(t && t.type==='number' && !e.ctrlKey && !e.metaKey && !e.altKey &&
       (e.key==='e'||e.key==='E'||e.key==='+'||e.key==='-')) e.preventDefault();
  });

  function numOf(el){ var v = parseFloat(el.value); return isNaN(v) ? null : v; }

  // one delegated handler for every value in the app
  function onInput(e){
    var el = e.target;
    if(e.type==='change' && el.tagName!=='SELECT' && el.type!=='checkbox') return;
    var a;

    if(el.id==='projname'){ state.settings.project = el.value; save(); return; }

    if((a = el.getAttribute('data-rfield'))){
      var run = findRun(el.closest('[data-run]').getAttribute('data-run'));
      if(!run) return;
      if(a==='name'){ run.name = el.value; save(); invalidate(); return; }
      var v = numOf(el); if(v===null) return;
      run.wallLength = v; touch(); return;
    }
    if((a = el.getAttribute('data-uf')) || (a = el.getAttribute('data-uo'))){
      var f = findUnit(selUnit); if(!f) return;
      var isOpt = el.hasAttribute('data-uo');
      applyUnitField(f, a, el, isOpt); return;
    }
    if((a = el.getAttribute('data-sf')) || (a = el.getAttribute('data-so'))){
      var sg = state.single, isO = el.hasAttribute('data-so');
      if(isO){
        if(a==='cornerStyle'||a==='appliance') sg.opts[a] = el.value;
        else { var ov = parseFloat(el.value); if(isNaN(ov)) return; sg.opts[a] = ov; }
      } else if(a==='name'){ sg.name = el.value; save(); invalidate(); scheduleRender(); return; }
      else if(a==='level'){
        var pv = levelDefaults(sg.level), nx = levelDefaults(el.value);
        if(sg.H===pv.H) sg.H = nx.H;
        if(sg.D===pv.D) sg.D = nx.D;
        sg.level = el.value;
      } else { var sv = numOf(el); if(sv===null) return; sg[a] = a==='qty' ? Math.max(1,Math.round(sv)) : sv; }
      touch(); return;
    }
    if((a = el.getAttribute('data-set'))){
      var parts = a.split(':');
      if(parts[0]==='std'){ var dv = numOf(el); if(dv===null) return; state.standards[parts[1]] = dv; }
      else if(el.tagName==='SELECT') state.settings[a] = el.value;
      else { var nv = numOf(el); if(nv===null) return; state.settings[a] = nv; }
      touch();
      if($('drawer').classList.contains('on')){
        if(a==='baseType' || a==='grain') renderSettings();
        else if(a==='thickness' || a==='back' || a==='drawerBox') updateStockWarnings();
      }
      return;
    }
    if((a = el.getAttribute('data-sw'))){
      state.settings[a] = el.checked;
      touch(); renderSettings(); return;
    }
    if((a = el.getAttribute('data-hw'))){
      var hv = numOf(el); if(hv===null) return;
      state.settings.hw[a] = hv; touch(); return;
    }
    if((a = el.getAttribute('data-sheet'))){
      var sp = a.split(':'), row = state.settings.sheets.find(function(r){ return r.id===sp[0]; });
      if(!row) return;
      var shv = numOf(el); if(shv===null) return;
      row[sp[1]] = shv; touch(); updateStockWarnings(); return;
    }
    if((a = el.getAttribute('data-cf'))){
      var cp = a.split(':'), crow = (state.settings.customHw||[]).find(function(x){ return x.id===cp[0]; });
      if(!crow) return;
      if(cp[1]==='name'||cp[1]==='per') crow[cp[1]] = el.value;
      else { var cv = numOf(el); if(cv===null) return; crow[cp[1]] = cv; }
      touch(); return;
    }
  }
  function applyUnitField(f, key, el, isOpt){
    var u = f.unit;
    if(!isOpt && key==='run'){
      var dest = findRun(el.value);
      if(dest && dest!==f.run){
        snapshot();
        f.run.units = f.run.units.filter(function(x){ return x!==u; });
        dest.units.push(u);
        selRun = dest.id;
        touch(); toast('Moved to '+dest.name);
      }
      return;
    }
    if(isOpt){
      if(key==='cornerStyle'||key==='appliance') u.opts[key] = el.value;
      else { var ov = parseFloat(el.value); if(isNaN(ov)) return; u.opts[key] = ov; }
    } else if(key==='name'){ u.name = el.value; save(); invalidate(); scheduleRender(); return; }
    else if(key==='level'){
      var pv = levelDefaults(u.level), nx = levelDefaults(el.value);
      if(u.H===pv.H) u.H = nx.H;
      if(u.D===pv.D) u.D = nx.D;
      u.level = el.value;
    } else { var v = numOf(el); if(v===null) return; u[key] = v; }
    touch();
  }
  function levelDefaults(level){
    var S = state.standards;
    if(level==='wall') return {H:S.wallH, D:S.wallD};
    if(level==='tall') return {H:S.tallH, D:S.tallD};
    return {H:S.baseH, D:S.baseD};
  }
  document.addEventListener('input', onInput);
  document.addEventListener('change', onInput);

  /* clicks */
  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-act]');
    if(btn){
      var act = btn.getAttribute('data-act');
      if(act==='open-settings'){ openSettings(true); return; }
      if(act==='deselect'){ selUnit = selRun = null; scheduleRender(); return; }
      if(act==='print'){
        window.print();
        // an installed iPhone app has no share sheet, and its print dialog does not always open
        if(isIOS && isStandalone()) toast('No print dialog? Open the page in Safari and print from the Share menu.', 4500);
        return;
      }
      if(act==='copy'){ copyTable(btn.getAttribute('data-kind')); return; }
      if(act==='undo'){ undo(); return; }
      if(act==='save-file'){ saveProjectFile(); return; }
      if(act==='open-file'){ $('file-in').click(); return; }
      if(act==='install-app'){ installApp(); return; }
      if(act==='add-run'){
        snapshot();
        state.runs.push({id:uid(), name:'Wall '+String.fromCharCode(65+state.runs.length), wallLength:3000, units:[]});
        selRun = state.runs[state.runs.length-1].id; selUnit = null;
        touch(); toast('Run added'); return;
      }
      if(act==='clear'){
        if(btn.dataset.armed==='1'){ snapshot(); state.runs=[]; selUnit=selRun=null; touch(); toast('Project cleared'); }
        else { btn.dataset.armed='1'; btn.textContent='Confirm — remove everything?';
               setTimeout(function(){ if(btn.isConnected){ btn.dataset.armed='0'; btn.textContent='Clear project'; } },3000); }
        return;
      }
      if(act==='del-run'){
        snapshot();
        var rid = btn.getAttribute('data-run') || btn.closest('[data-run]').getAttribute('data-run');
        state.runs = state.runs.filter(function(r){ return r.id!==rid; });
        selRun = selUnit = null; touch(); toast('Run removed'); return;
      }
      if(act==='add-unit'){
        snapshot();
        var rid2 = btn.getAttribute('data-run') || btn.closest('[data-run]').getAttribute('data-run');
        var r2 = findRun(rid2); if(!r2) return;
        // a new cabinet goes right after the selected one when there is one
        // in this run, otherwise at the end — and it copies that cabinet's
        // row, so a wall unit added beside a wall unit lands on the wall
        var d = levelDefaults('base'), at = r2.units.length, level = 'base';
        var cur = selUnit && findUnit(selUnit);
        if(cur && cur.run===r2){ at = r2.units.indexOf(cur.unit)+1; level = cur.unit.level; d = levelDefaults(level); }
        var nu = {id:uid(), type:'door', level:level, name:'', W:600, H:d.H, D:d.D, opts:defaultOpts('door')};
        r2.units.splice(at, 0, nu); selUnit = nu.id; selRun = r2.id;
        touch(); toast('Cabinet added — edit it on the right'); return;
      }
      if(act==='del-unit'){
        snapshot();
        var fu = findUnit(selUnit); if(!fu) return;
        fu.run.units = fu.run.units.filter(function(x){ return x.id!==selUnit; });
        selUnit = null; touch(); toast('Cabinet removed'); return;
      }
      if(act==='dup'){
        snapshot();
        var fd = findUnit(selUnit); if(!fd) return;
        var copy = JSON.parse(JSON.stringify(fd.unit)); copy.id = uid();
        fd.run.units.splice(fd.run.units.indexOf(fd.unit)+1, 0, copy);
        selUnit = copy.id; touch(); toast('Duplicated'); return;
      }
      if(act==='move'){
        snapshot();
        var fm = findUnit(selUnit); if(!fm) return;
        var list = fm.run.units, i = list.indexOf(fm.unit), dir = +btn.getAttribute('data-dir');
        if(i+dir<0 || i+dir>=list.length) return;
        list.splice(i+dir, 0, list.splice(i,1)[0]); touch(); return;
      }
      if(act==='add-sheet'){
        snapshot();
        var last = state.settings.sheets[state.settings.sheets.length-1];
        state.settings.sheets.push({id:uid(), thickness:last?last.thickness:18, sheetW:last?last.sheetW:2500,
          sheetH:last?last.sheetH:1250, qty:0, price:last?last.price:40, precutPrice:last?last.precutPrice:0});
        touch(); renderSettings(); return;
      }
      if(act==='del-sheet'){
        if(state.settings.sheets.length<=1) return;
        snapshot();
        var sid = btn.closest('[data-sheet]').getAttribute('data-sheet');
        state.settings.sheets = state.settings.sheets.filter(function(r){ return r.id!==sid; });
        touch(); renderSettings(); return;
      }
      if(act==='add-custom'){
        snapshot();
        state.settings.customHw = state.settings.customHw||[];
        state.settings.customHw.push({id:uid(), name:'', price:0, qty:1, per:'project'});
        touch(); renderSettings(); return;
      }
      if(act==='del-custom'){
        snapshot();
        var cid = btn.closest('[data-custom]').getAttribute('data-custom');
        state.settings.customHw = state.settings.customHw.filter(function(x){ return x.id!==cid; });
        touch(); renderSettings(); return;
      }
      if(act==='bench-type'){
        state.single.type = btn.getAttribute('data-type');
        state.single.opts = defaultOpts(state.single.type);
        touch(); return;
      }
      if(act==='bench-preset'){
        var lv = btn.getAttribute('data-level'), dd = levelDefaults(lv);
        state.single.level = lv; state.single.H = dd.H; state.single.D = dd.D;
        touch(); return;
      }
      if(act==='bench-add'){
        snapshot();
        var sel = $('bench-run'), rr = sel && findRun(sel.value); if(!rr) return;
        var sg2 = state.single;
        for(var q=0;q<Math.max(1,Math.round(sg2.qty||1));q++){
          rr.units.push({id:uid(), type:sg2.type, level:sg2.level, name:sg2.name||'',
            W:sg2.W, H:sg2.H, D:sg2.D, opts:JSON.parse(JSON.stringify(sg2.opts))});
        }
        view = 'plan'; selRun = rr.id; touch(); toast('Added to '+rr.name); return;
      }
    }

    // selecting things
    var g = e.target.closest('.eu');
    if(g){ select(g.getAttribute('data-unit')); return; }
    var row = e.target.closest('.urow, tr[data-unit]');
    if(row){ select(row.getAttribute('data-unit')); if(view==='order'){ view='plan'; } scheduleRender(); return; }
    var runCard = e.target.closest('[data-run]');
    if(runCard && !e.target.closest('input,select,button')){
      selUnit = null; selRun = runCard.getAttribute('data-run'); scheduleRender(); return;
    }
  });

  $('views').addEventListener('click', function(e){
    var b = e.target.closest('[data-view]');
    if(b){ view = b.getAttribute('data-view'); scheduleRender(); }
  });
  $('btn-settings').addEventListener('click', function(){ openSettings(true); });
  $('btn-close-settings').addEventListener('click', function(){ openSettings(false); });
  $('scrim').addEventListener('click', function(){ openSettings(false); });

  /* hover links a cut-list row to its piece on the sheet */
  document.addEventListener('mouseover', function(e){
    var key = null;
    var tr = e.target.closest('tr[data-piece]');
    if(tr) key = tr.getAttribute('data-piece');
    var pc = e.target.closest('.pc');
    if(pc) key = pc.getAttribute('data-piece');
    if(!key) return;
    document.querySelectorAll('.pc[data-piece="'+CSS.escape(key)+'"]').forEach(function(n){ n.classList.add('hl'); });
    document.querySelectorAll('tr[data-piece="'+CSS.escape(key)+'"]').forEach(function(n){ n.classList.add('hl'); });
  });
  document.addEventListener('mouseout', function(e){
    if(!e.target.closest('tr[data-piece], .pc')) return;
    document.querySelectorAll('.pc.hl, tr.hl').forEach(function(n){ n.classList.remove('hl'); });
  });

  /* drag to reorder within a run */
  var dragId = null;
  document.addEventListener('dragstart', function(e){
    var row = e.target.closest('.urow');
    if(!row) return;
    dragId = row.getAttribute('data-unit');
    row.classList.add('drag');
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', dragId); }catch(err){}
  });
  document.addEventListener('dragover', function(e){
    var row = e.target.closest('.urow');
    if(!row || !dragId) return;
    e.preventDefault();
    document.querySelectorAll('.urow.over').forEach(function(n){ n.classList.remove('over'); });
    row.classList.add('over');
  });
  document.addEventListener('drop', function(e){
    var row = e.target.closest('.urow');
    if(!row || !dragId) return;
    e.preventDefault();
    var from = findUnit(dragId), to = findUnit(row.getAttribute('data-unit'));
    if(from && to && from.unit!==to.unit){
      snapshot();
      var src = from.run.units, dst = to.run.units;
      src.splice(src.indexOf(from.unit), 1);
      dst.splice(dst.indexOf(to.unit), 0, from.unit);
      selUnit = dragId; selRun = to.run.id;
      touch();
      if(from.run!==to.run) toast('Moved to '+to.run.name);
    }
    dragId = null;
  });
  document.addEventListener('dragend', function(){
    dragId = null;
    document.querySelectorAll('.urow.drag, .urow.over').forEach(function(n){ n.classList.remove('drag','over'); });
  });

  /* keyboard */
  document.addEventListener('keydown', function(e){
    var ae = document.activeElement;
    var inText = ae && (/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) || ae.isContentEditable);
    if((e.ctrlKey||e.metaKey) && !inText && (e.key==='z'||e.key==='Z'||e.key==='y')){
      e.preventDefault();
      if(e.key==='y' || e.shiftKey) redo(); else undo();
      return;
    }
    if((e.ctrlKey||e.metaKey) && !e.shiftKey && !e.altKey && (e.key==='s' || e.key==='o')){
      e.preventDefault();
      if(e.key==='s') saveProjectFile(); else $('file-in').click();
      return;
    }
    if(e.key==='Escape'){
      if($('drawer').classList.contains('on')) openSettings(false);
      else { selUnit = selRun = null; scheduleRender(); }
      return;
    }
    // Shortcuts only when nothing is focused. A button keeps focus after a
    // click, and Delete there would silently bin the cabinet you just edited.
    if(ae && (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(ae.tagName) || ae.isContentEditable)) return;
    if(!selUnit) return;
    var f = findUnit(selUnit); if(!f) return;
    var list = f.run.units, i = list.indexOf(f.unit);
    if(e.key==='ArrowRight' && i<list.length-1){ e.preventDefault(); select(list[i+1].id); }
    if(e.key==='ArrowLeft'  && i>0){ e.preventDefault(); select(list[i-1].id); }
    if((e.key==='Delete'||e.key==='Backspace')){
      e.preventDefault();
      snapshot();
      f.run.units = list.filter(function(x){ return x.id!==selUnit; });
      selUnit = null; touch(); toast('Cabinet removed');
    }
  });

  /* ================= go ================= */
  load();
  render();

})();
</script>
