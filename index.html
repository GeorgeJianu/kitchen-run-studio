  function sheetSVG(items, sheetW, sheetH, trim){
    trim = trim||0;
    var VBW=230, VBH=Math.round(230*sheetH/sheetW), scale=VBW/sheetW;
    var ink='var(--ink)', line='var(--line)';
    var o = ['<rect x="0" y="0" width="'+VBW+'" height="'+VBH+'" fill="var(--surface-2)" stroke="'+ink+'" stroke-width="2"/>'];
    if(trim>0){
      var t=trim*scale;
      o.push('<rect x="'+t+'" y="'+t+'" width="'+(VBW-2*t)+'" height="'+(VBH-2*t)+'" fill="none" stroke="'+line+'" stroke-width="1" stroke-dasharray="2,2"/>');
    }
    items.forEach(function(it){
      var x=(it.x+trim)*scale, y=(it.y+trim)*scale, w=Math.max(it.w*scale-1,0), h=Math.max(it.h*scale-1,0);
      o.push('<rect class="pc" data-piece="'+escAttr(it.key||it.label||'')+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="var(--wood-soft)" stroke="'+line+'" stroke-width="1"/>');
      if(w>8 && h>8) o.push('<text class="pn" x="'+(x+1.6)+'" y="'+(y+5.2)+'" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="4.6" font-weight="700" fill="'+ink+'">'+(items.indexOf(it)+1)+'</text>');
      // faint grain lines when the grain is pinned: they run along the sheet's
      // long side, which is the whole point of pinning it
      if(it.locked && it.grain && w>14 && h>14){
        var horiz = sheetW>=sheetH, gl=[];
        if(horiz){ for(var gy=y+4; gy<y+h-2; gy+=5) gl.push('<line x1="'+(x+2)+'" y1="'+gy+'" x2="'+(x+w-2)+'" y2="'+gy+'"/>'); }
        else { for(var gx=x+4; gx<x+w-2; gx+=5) gl.push('<line x1="'+gx+'" y1="'+(y+2)+'" x2="'+gx+'" y2="'+(y+h-2)+'"/>'); }
        o.push('<g stroke="var(--wood)" stroke-width="0.35" opacity="0.5" pointer-events="none">'+gl.join('')+'</g>');
      }
      if(w>26 && h>11){
        var cx=x+w/2, dim=Math.round(it.w)+'×'+Math.round(it.h);
        if(w>36 && h>22 && it.label){
          var nm = it.label.length>Math.floor(w/3.3) ? it.label.slice(0,Math.max(Math.floor(w/3.3)-1,3))+'…' : it.label;
          o.push('<text x="'+cx+'" y="'+(y+h/2-2.5)+'" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="5.4" fill="'+ink+'">'+esc(nm)+'</text>');
          o.push('<text x="'+cx+'" y="'+(y+h/2+5.5)+'" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="6" fill="'+ink+'">'+dim+'</text>');
        } else {
          o.push('<text x="'+cx+'" y="'+(y+h/2+2.2)+'" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="6" fill="'+ink+'">'+dim+'</text>');
        }
      }
    });
    return '<svg viewBox="0 0 '+VBW+' '+VBH+'" role="img" aria-label="Sheet cutting layout">'+o.join('')+'</svg>';
  }

  function singleUnit(){
    var s = state.single;
    return {id:'single', type:s.type, level:s.level, name:s.name||TYPES[s.type].label,
      W:s.W, H:s.H, D:s.D, opts:s.opts};
  }

  function notesFor(u, sum){
    var S = state.standards, steps = [];
    if(u.type==='gap'){
      if(applianceFront(u)) steps.push('Cut the door front to size and band it all round, then fix it to the appliance\u2019s door with the maker\u2019s fixing kit, its top edge level with the fronts beside it, and fit the handle.');
      return steps;
    }
    var lazy = u.type==='corner' && (u.opts.cornerStyle||'blind')==='lazysusan';
    var build = buildOf(u), carcass = build!=='fronts', fronts = build!=='carcass', metal = boxesOf(u)==='metal';
    steps.push('Cut every panel to the sizes in the list, face up, and label each one in pencil on a raw edge.');
    if(sum.edgeMM>0) steps.push('Edge-band the faces marked in the list (about '+(sum.edgeMM/1000).toFixed(1)+' m in total), then trim flush.');
    if(carcass && (u.type==='shelf' || u.type==='combo' || u.type==='wine' || (u.type==='door' && doorShelves(u)>0))){
      steps.push('Drill 5 mm shelf-pin holes on the inside face of both sides on a 32 mm grid — the System 32 spacing — starting '+K.shelfSetback+' mm back from the front edge.');
    }
    if(carcass && !lazy){
      steps.push('Join the sides to the top and bottom with cam locks or glued dowels, keeping every edge flush and the box square.');
      steps.push('Check the diagonals match, then screw the back on flush to the rear edges every ~100 mm — the back is what holds the carcass square.');
    } else if(carcass){
      steps.push('Screw each return panel’s back to its own rear edge, then join the two returns at the corner to make the frame the door and susan hardware mount to.');
    }
    if(u.type==='housing'){
      var secsN = housingSections(u), ndN = housingDrawers(u), dcN = Math.max(housingDoors(u), 1);
      if(carcass && secsN.length>1){
        steps.push('Fix a shelf between each pair of sections, its top face measured up from the inside of the bottom panel: '+
          secsN.slice(1).map(function(q){ return Math.round(q.y0)+' mm under the '+housingKindLabel(q.kind); }).join(', ')+
          '. Screw them through the sides — the oven and the microwave stand on theirs.');
        steps.push('Check the appliance makers’ niche sizes before you cut (a 60 cm oven usually wants 560 wide and about 590 high, a built-in microwave its own trim kit), and cut the back panel away behind the oven so it can vent.');
      }
      if(fronts && carcass && ndN>0){
        steps.push(metal
          ? 'Fit the metal drawer runners to the sides using the maker’s drilling template, hang the boxes, then clip the fronts on and set the gaps to '+state.settings.gap+' mm.'
          : 'Build each drawer box, mount the runners with '+K.slideClearanceEach+' mm clear between the carcass and the box side, then screw the front on from inside the box and set the gaps to '+state.settings.gap+' mm.');
      }
      if(fronts && !carcass && ndN>0) steps.push('Take the old drawer fronts off, transfer the handle and fixing holes to the new ones, and screw them to the boxes with the gaps set to '+state.settings.gap+' mm.');
      secsN.forEach(function(q){
        if(!fronts || (q.kind!=='door' && q.kind!=='top')) return;
        var dwN = dcN===1 ? u.W-2*state.settings.gap : (u.W-3*state.settings.gap)/2, dhN = Math.round(q.h-2*state.settings.gap), perN = hingesForDoor(dwN, dhN);
        steps.push('Bore 35 mm hinge cups 21.5 mm in from the '+housingKindLabel(q.kind)+' door’s edge'+(dcN===1 ? ' on the '+hingeSide(u)+'-hand side' : '')+', 100 mm from the top and bottom'+
          (perN>2 ? ' with '+(perN-2)+' more spaced evenly between — '+perN+' per door for a '+dhN+' mm door' : '')+'; fix the plates to the side panel and set the reveal to '+state.settings.gap+' mm all round.');
      });
      if(secsN.some(function(q){ return q.kind==='oven' || q.kind==='micro'; })) steps.push('Slide the oven and the microwave into their niches last, screw them to the fixed shelves through their trim frames, and set the fronts around them to the same gap.');
    }
    if(!carcass && fronts){
      steps.push('Check the existing box is square and its hinge plates and runners are sound before the new fronts go on; a worn runner shows on a new front straight away.');
    }
    if(build==='carcass' && (hasDrawers(u) || u.type==='door' || u.type==='sink' || u.type==='corner')){
      steps.push('Leave the front open: the doors, drawer fronts or drawers that go on this box are not part of this list. Drill the hinge plates or runner holes once you have them in hand.');
    }
    if(fronts && carcass && (u.type==='drawer' || u.type==='combo')){
      steps.push(metal
        ? 'Fit the metal drawer runners to the sides using the maker’s drilling template, hang the boxes, then clip the fronts on and set the gaps to '+state.settings.gap+' mm.'
        : 'Build each drawer box, mount the runners with '+K.slideClearanceEach+' mm clear between the carcass and the box side, then screw the front on from inside the box and set the gaps to '+state.settings.gap+' mm.');
    }
    if(fronts && !carcass && (u.type==='drawer' || u.type==='combo')){
      steps.push('Take the old drawer fronts off, transfer the handle and fixing holes to the new ones, and screw them to the boxes with the gaps set to '+state.settings.gap+' mm.');
    }
    if(fronts && (u.type==='door' || u.type==='sink' || (u.type==='corner' && !lazy))){
      var hwx = hardwareFor(u), nd = (u.type==='corner') ? 1 : (u.opts.doorCount||2);
      var per = nd ? Math.round(hwx.hinge/nd) : 2;
      var dh = Math.round(u.H-2*state.settings.gap);
      var dwv = nd===1 ? u.W-2*state.settings.gap : (u.W-3*state.settings.gap)/2;
      var kg = doorWeightKg(dwv, dh, state.settings.thickness);
      steps.push('Bore 35 mm hinge cups 21.5 mm in from the door edge'+(nd===1 && u.type!=='corner' ? ' on the '+hingeSide(u)+'-hand side' : '')+', 100 mm from the top and bottom'+
        (per>2 ? ' with '+(per-2)+' more spaced evenly between — '+per+' per door, for a '+dh+' mm door of about '+kg.toFixed(1)+' kg' : '')+
        '; fix the plates to the side panel and set the reveal to '+state.settings.gap+' mm all round.');
    }
    if(carcass && u.type==='sink') steps.push('Leave the top open — the two stretchers stand in for a top panel so the bowl and its plumbing drop through.'+(fronts?' Hang the tip-out tray front above the doors on tip-out hardware.':''));
    if(carcass && u.type==='wine') steps.push('Fit the dividers between the sides like shelves — bottles lie side by side across each row rather than in individual cubbies.');
    if(fronts && u.type==='corner'){
      steps.push(lazy
        ? 'Cut both stiles of the diagonal door to your actual corner angle on site, then fit the susan hardware and its round shelves — this planner does not size those for you.'
        : 'Screw the blind front panel on fixed — it is not hinged — over the hidden section, and hinge only the door section. A pull-out basket makes the blind cavity reachable.');
    }
    if(finBottom(u)) steps.push('Screw the finished bottom panel up under the carcass from inside, flush with the fronts'+(finSides(u).l||finSides(u).r ? ' and tucked behind the finished side' : '')+', before it goes up.');
    if(!carcass){
      steps.push('Hang the new fronts and set the gaps to '+state.settings.gap+' mm all round; the box stays where it is.');
    } else if(stackParentId(u)){
      steps.push('Stand it on the cabinet it belongs on, screw it down through its bottom into that cabinet\u2019s top and back to the wall \u2014 the empty carcass is about '+unitWeightKg(u).toFixed(0)+' kg.');
    } else if(isFree(u)){
      steps.push('Fix it at its own place, '+Math.round(+u.opts.pos.x||0)+' mm from the run\u2019s left end with its underside '+Math.round(+u.opts.pos.y||0)+' mm above the floor \u2014 the empty carcass is about '+unitWeightKg(u).toFixed(0)+' kg, so fix it to the wall with fixings rated well above that.');
    } else if(u.level==='upper'){
      steps.push('Stand it on the wall units with its underside at '+upperBottom()+' mm above the floor, screw it down through its bottom into their tops and back to the wall — the empty carcass is about '+
        unitWeightKg(u).toFixed(0)+' kg — then screw it to the box beside it.');
    } else if(u.level==='wall'){
      steps.push('Hang it on its brackets with the underside at '+wallUnitBottom(u)+' mm above the floor — the empty carcass is about '+
        unitWeightKg(u).toFixed(0)+' kg, so use fixings rated well above that — level it, and screw it to the cabinet beside it.');
    } else {
      steps.push('Stand it on its legs, level it, clip the kickboard on in front, and screw it to the neighbouring cabinets and to the wall.');
    }
    return steps;
  }

  function singleReport(){
    var u = singleUnit(), s = state.settings;
    var qty = Math.max(1, Math.round(state.single.qty||1));
    var sum = unitSummary(u), hw = hardwareFor(u), mins = labourMinutes(u);
    var cost = unitCost(u);

    // nest just this cabinet (times the quantity) to see the sheets it needs
    var groups = {};
    for(var c=0;c<qty;c++){
      sum.parts.forEach(function(p){
        var dec = partDecor(p, u), key = String(p.thick)+'|'+dec;
        if(!groups[key]) groups[key] = {thickness:p.thick, decor:dec, list:[]};
        for(var i=0;i<p.qty;i++) groups[key].list.push({w:p.w, h:p.h, label:p.name, key:'single|'+p.name, grain:partGrain('single', p.name)});
      });
    }
    // The workbench prices this cabinet on its own, so it always nests against
    // fresh sheets — stock you own is shared across the whole project, not
    // attributable to one cabinet.
    var plan = [], sheetCost = 0, sheets = 0;
    Object.keys(groups).sort(function(a,b){ return groups[b].thickness-groups[a].thickness || decorLabel(groups[a].decor).localeCompare(decorLabel(groups[b].decor)); }).forEach(function(gk){
      var thickness = groups[gk].thickness, decor = groups[gk].decor;
      var bins = binsFor(thickness, decor).filter(function(b){ return !b.onHand; });
      var packed = packSheets(groups[gk].list, bins, s.kerf, s.trim, grainPinned(decor));
      var first = packed.sheets[0] || bins[0];
      var area = (first.sheetW*first.sheetH)/1e6;
      var cost = packed.sheets.reduce(function(a,x){ return a + sheetCostOf(x, buyMode()); }, 0);
      sheets += packed.count; sheetCost += cost;
      plan.push({thickness:thickness, decor:decor, decorLabel:decorLabel(decor), pieceCount:groups[gk].list.length, count:packed.count,
        sheets:packed.sheets, oversized:packed.oversized, sheetW:first.sheetW, sheetH:first.sheetH,
        unpriced: !buyRowFor(thickness, decor),
        utilization: packed.usableArea>0 ? (packed.usedArea/packed.usableArea)*100 : 0,
        cost: cost});
    });
    return {u:u, qty:qty, sum:sum, hw:hw, minutes:mins*qty, cost:cost, plan:plan,
      sheets:sheets, sheetCost:sheetCost, notes:notesFor(u, sum)};
  }

  function findUnit(id){
    for(var i=0;i<state.runs.length;i++){
      var u = state.runs[i].units.find(function(x){ return x.id===id; });
      if(u) return {run:state.runs[i], unit:u};
    }
    return null;
  }
  function findRun(id){ return state.runs.find(function(r){ return r.id===id; }) || null; }

  // Everything recomputes live; the frame is the only thing debouncing it.
  function scheduleRender(){
    if(rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(function(){ rafId = null; render(); });
  }
  function touch(){ invalidate(); save(); scheduleRender(); }

  // Undo: a snapshot of the whole project before every structural change
  // (add, remove, move, paste) — not per keystroke, which would make Ctrl+Z
  // step back one digit at a time. Capped so the stack cannot grow forever.
  var undoStack = [], redoStack = [];
  function snapshot(){
    undoStack.push(JSON.stringify({runs:state.runs, single:state.single, settings:state.settings, standards:state.standards}));
    if(undoStack.length>40) undoStack.shift();
    redoStack.length = 0;
  }
  function restore(json){
    var o = JSON.parse(json);
    state.runs = o.runs; state.single = o.single; state.settings = o.settings; state.standards = o.standards;
    selUnit = findUnit(selUnit) ? selUnit : null;
    selRun = findRun(selRun) ? selRun : null;
    invalidate(); save(); render(true);
    if($('drawer').classList.contains('on')) renderSettings();
  }
  function undo(){
    if(!undoStack.length){ toast('Nothing to undo'); return; }
    redoStack.push(JSON.stringify({runs:state.runs, single:state.single, settings:state.settings, standards:state.standards}));
    restore(undoStack.pop()); toast('Undone');
  }
  function redo(){
    if(!redoStack.length) return;
    undoStack.push(JSON.stringify({runs:state.runs, single:state.single, settings:state.settings, standards:state.standards}));
    restore(redoStack.pop()); toast('Redone');
  }
  function toast(msg, ms){
    var t = $('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, ms||1900);
  }

  function select(unitId, runId){
    selUnit = unitId || null;
    var f = unitId ? findUnit(unitId) : null;
    selRun = runId || (f ? f.run.id : null);

    // Below the split layout the inspector sits under the canvas, so a tap on
    // a cabinet would otherwise change something far off screen.
    if(selUnit && window.matchMedia('(max-width:1040px)').matches && !window.matchMedia('(max-width:640px)').matches){
      requestAnimationFrame(function(){
        var ins = $('inspector');
        if(ins) ins.scrollIntoView({behavior:'smooth', block:'start'});
      });

        (c.mode==='precut' ? c.precutArea.toFixed(1)+' m\u00b2 cut to size' : c.mode==='service' ? n(c.sheetsToBuy,'sheet','sheets')+' cut and banded' : n(c.sheetsToBuy,'sheet','sheets')+' to buy')+', '+
        c.area.toFixed(1)+' m\u00b2 of board';

    if(bm && document.activeElement!==bm && bm.value!==c.mode) bm.value = c.mode;

  /* ---------------- the room's checks ---------------- */
  // Every piece of a run as a rectangle on the room plan, with the row it is in
  function roomRects(run, g, F){
    var out = [];
    function add(x0, x1, d, kind, u){
      var a = F.fwd(x0,0,0), b = F.fwd(x1,0,d);
      out.push({kind:kind, x0:Math.min(a[0],b[0]), x1:Math.max(a[0],b[0]), z0:Math.min(a[2],b[2]), z1:Math.max(a[2],b[2]), lx0:x0, lx1:x1, u:u});
    }
    g.rows.floor.forEach(function(p){ add(p.x, p.x+p.u.W, Math.max(p.u.D||0,100), isTallUnit(p.u) ? 'tall' : 'floor', p.u); });
    g.rows.wall.forEach(function(p){ add(p.x, p.x+p.u.W, Math.max(p.u.D||0,100), 'wall', p.u); });
    g.rows.upper.forEach(function(p){ add(p.x, p.x+p.u.W, Math.max(p.u.D||0,100), 'upper', p.u); });
    g.rows.stack.forEach(function(p){ add(p.x, p.x+p.u.W, Math.max(p.u.D||0,100), 'stack', p.u); });
    g.fillerGeo.forEach(function(fg){ add(fg.x, fg.x+fg.w, fg.D, fg.row==='floor' ? (fg.tall?'tall':'floor') : fg.row, null); });

  function roomChecks(){

    info.forEach(function(A){

      var over = (+p.off||0) + A.run.wallLength - A.F.len;

        ops.forEach(function(op){ if(overlap(p.x, p.x+p.u.W, op) && yb < op.y1-1 && yt > op.y0+1 && !said['w'+p.u.id]){ said['w'+p.u.id] = 1; notes.push({cls:'warn', text:esc(p.u.name||TYPES[p.u.type].label)+' on '+esc(A.run.name)+' hangs over the '+op.kind+'.'}); } });
      });
      g.rows.floor.forEach(function(p){
        if(!isTallUnit(p.u)) return;
        ops.forEach(function(op){ if(op.kind==='window' && overlap(p.x, p.x+p.u.W, op) && !said['t'+p.u.id]){ said['t'+p.u.id] = 1; notes.push({cls:'warn', text:esc(p.u.name||TYPES[p.u.type].label)+' on '+esc(A.run.name)+' stands in front of the window.'}); } });

      if(g.wallGap < -1) return nm+': the wall row would overhang by '+mm(-g.wallGap);
      if(g.upperGap < -1) return nm+': the upper row would overhang by '+mm(-g.upperGap);
      if(g.clash) return nm+': a wall unit would sit in front of a tall unit';
      if(g.clashUpper) return nm+': an upper unit would sit in front of a tall unit';

  // widths that fill a stretch: standard sizes, the last one taking the remainder

  /* ---------------- cut list view ---------------- */
  function pieceKey(u, part){ return (u.name||TYPES[u.type].label)+' — '+part.name; }

  function renderCut(){

    var plan = c.plan.map(function(g){
      var tiles = g.sheets.map(function(sh,i){

        var list = items.map(function(it,k){

          '<div class="cap">'+sheetTileLabel(sh,i,g.sheets.length)+'</div>'+

            '<span>'+sh.sheetW+' \u00d7 '+sh.sheetH+' mm, '+status+', '+Math.round(sh.fill*100)+'% used, '+items.length+' pieces</span></div>'+
          sheetSVG(items, sh.sheetW, sh.sheetH, s.trim)+

            '<tbody>'+list+'</tbody></table></div>'+
        '</div>';
      }).join('');

      return '<div class="grp">'+

    var byRun = {};
    c.lines.forEach(function(l){ (byRun[l.run.id] = byRun[l.run.id] || []).push(l); });

    var parts = state.runs.map(function(run){
      var lines = byRun[run.id]; if(!lines) return '';

          : '<tr class="grp"><td colspan="10">Run extras</td></tr>';

        return '<tbody>'+head + l.sum.parts.map(function(p){

          var gsel = '<select class="grainsel screen-only" data-grain="'+escAttr(key)+'" aria-label="Grain direction of '+escAttr(p.name)+'">'+
            [['h','Vertical'],['w','Horizontal'],['none','None']].map(function(o){ return '<option value="'+o[0]+'"'+((gr||'none')===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select>'+

            '<td><small>'+esc(decorShort(dec))+'</small></td><td class="edges">'+edgeCode(p.bands)+'</td><td>'+gsel+'</td>'+
            '<td class="n">'+p.area.toFixed(2)+'</td><td><small>'+esc(partNote(p))+'</small></td></tr>';
        }).join('')+'</tbody>';
      }).join('');
      if(!body) return '';
      return '<section class="card"><header><h2>'+esc(run.name)+'</h2><span class="sub">'+run.units.length+' units</span></header>'+
        '<div class="tw"><table class="dt"><thead><tr><th>Part</th><th class="n">Qty</th><th class="n">W</th><th class="n">H</th><th class="n">T</th><th>Colour</th><th>Edges</th><th>Grain</th><th class="n">m²</th><th>Note</th></tr></thead>'+
        body+'</table></div></section>';
    }).join('');

    var summary = '<div class="print-only printsummary"><table class="dt"><thead><tr><th>Board</th><th class="n">Pieces</th><th class="n">Sheets</th><th class="n">From stock</th><th class="n">To buy</th><th class="n">Used</th><th class="n">Cost</th></tr></thead><tbody>'+
      c.plan.map(function(g){
        return '<tr><td>'+matLabel(g)+'</td><td class="n">'+g.pieceCount+'</td><td class="n">'+g.needed+'</td><td class="n">'+g.onHandUsed+'</td>'+
          '<td class="n">'+g.toBuy+(g.precutCount?' + '+g.precutArea.toFixed(2)+' m\u00b2 pre-cut':'')+'</td><td class="n">'+g.utilization.toFixed(0)+'%</td>'+
          '<td class="n">'+(g.unpriced?'not priced':money(g.cost))+'</td></tr>';
      }).join('')+'</tbody></table>'+
      c.plan.filter(function(g){ return g.oversized.length; }).map(function(g){
        return '<p class="hint" style="margin:10px 0 0;color:var(--bad)"><b>'+g.oversized.length+' piece(s) of '+g.thickness+' mm fit no available sheet</b> \u2014 check the stock sizes before cutting.</p>';
      }).join('')+
      '<p class="hint" style="margin:10px 0 0">One sheet per page follows, each with its pieces numbered in cutting order \u2014 row by row, left to right. Rows are full-width cuts; pieces within a row are cut across the strip.</p></div>';
    return '<section class="card"><header><h2>Cutting plan</h2>'+
        '<span class="sub">'+c.pieces+' pieces, '+c.area.toFixed(2)+' m², '+c.sheetsToBuy+' sheets to buy</span>'+
        '<button type="button" class="btn sm primary" data-act="export-xlsx">Export Excel</button>'+
        '<button type="button" class="btn sm ghost" data-act="copy" data-kind="cut">Copy as spreadsheet</button>'+
        '<button type="button" class="btn sm ghost" data-act="print">Print</button></header>'+
        '<div class="body">'+summary+plan+
          '<p class="hint screen-only" style="margin:12px 0 0">The Excel file lists every part to cut with its board colour, finished and cut sizes, the edges to band and its grain, plus the boards and the cutting plan sheet by sheet. Each part’s grain can be set in the lists below.</p>'+
        '</div></section>' + parts;
  }

  /* ---------------- order view ---------------- */
  // which edges of a part get banded, the way a cutting company reads it:
  // L along its length (its height), W along its width
  function edgeCode(b){
    var o = [];
    for(var i=1;i<=((b&&b.w)||0);i++) o.push('L'+i);
    for(var j=1;j<=((b&&b.h)||0);j++) o.push('W'+j);
    return o.length ? o.join(' ') : '—';
  }
  function grainCode(gr){ return grainWord(gr); }
  // the parts list a cutting company works from, per board, numbered
  function serviceOrderHTML(c){
    var s = state.settings, n = 0;
    var groups = c.plan.map(function(g){
      var rows = g.parts.map(function(p){
        n++;
        return '<tr><td class="n">'+n+'</td><td>'+esc(p.name)+'<br><small>'+esc(p.cab)+'</small></td><td class="n">'+p.L+'</td><td class="n">'+p.W+'</td><td class="n">'+p.qty+'</td>'+
          '<td><small>'+grainCode(p.grain)+'</small></td><td class="edges">'+edgeCode(p.bands)+'</td></tr>';
      }).join('');
      var sizes = g.buySizes.map(function(b){ return b.qty+' × '+b.sheetW+'×'+b.sheetH; }).join(', ');
      return '<div class="grp"><div class="grp-head"><b>'+matLabel(g)+'</b><span>'+(g.toBuy ? g.toBuy+' sheet'+(g.toBuy===1?'':'s')+' ('+sizes+')' : 'from stock only')+', '+g.pieceCount+' pieces, '+(g.edgeRun/1000).toFixed(1)+' m of banding</span></div>'+
        '<div class="tw"><table class="dt"><thead><tr><th class="n">#</th><th>Part</th><th class="n">L mm</th><th class="n">W mm</th><th class="n">Qty</th><th>Grain</th><th>Edges</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
        '<div class="strip" style="margin-top:10px">'+g.sheets.map(function(sh, i){
          var items = sh.items.slice().sort(function(a,b){ return a.y-b.y || a.x-b.x; });
          return '<div class="sh'+(i>=8?' xtra':'')+(sh.onHand?' stock':'')+'"><div class="cap">'+sheetTileLabel(sh,i,g.sheets.length)+'</div>'+sheetSVG(items, sh.sheetW, sh.sheetH, s.trim)+'</div>';
        }).join('')+'</div></div>';
    }).join('');
    return '<section class="card"><header><h2>Order for the cutting company</h2><span class="sub">'+n+' lines</span>'+
        '<button type="button" class="btn sm primary" data-act="export-xlsx">Export Excel</button>'+
        '<button type="button" class="btn sm ghost" data-act="export-service">Export CSV</button>'+
        '<button type="button" class="btn sm ghost" data-act="print">Print</button></header>'+
      '<div class="body"><p class="hint" style="margin-top:0">Finished sizes, after banding. L is the length of the part as it stands (its height), W its width; L1 L2 are its two long edges, W1 W2 its two short ones. Banding '+edgeDesc()+'.</p>'+groups+'</div></section>';
  }
  /* ---------------- the Excel workbook ----------------
     The finished project as a spreadsheet to cut from: every part with its
     colour, sizes, the edges to band and its grain; the same parts board by
     board; the boards to buy; and the cutting plan sheet by sheet. The writer
     (SheetJS) is fetched the first time it is asked for. */
  var xlsxLib = null;
  function loadXLSX(){
    if(window.XLSX) return Promise.resolve(window.XLSX);
    if(xlsxLib) return xlsxLib;
    xlsxLib = new Promise(function(res, rej){
      var sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      sc.onload = function(){ window.XLSX ? res(window.XLSX) : rej(new Error('no XLSX')); };
      sc.onerror = function(){ xlsxLib = null; rej(new Error('load failed')); };
      document.head.appendChild(sc);
    });
    return xlsxLib;
  }
  function edgeMarks(b){ var w = (b&&b.w)||0, h = (b&&b.h)||0; return [w>=1?'✓':'', w>=2?'✓':'', h>=1?'✓':'', h>=2?'✓':'']; }
  function workbookSheets(){
    var c = compute(), s = state.settings, out = [];
    var decorCols = function(id){ var d = decorById(id); return [decorName(d), (d && d.code)||'', (d && d.finish)||'']; };
    // every part, cabinet by cabinet
    var parts = [['#','Run','Cabinet','Part','Colour','Decor code','Surface','Thickness mm','Length mm','Width mm','Cut length mm','Cut width mm','Qty','Grain','Edge L1','Edge L2','Edge W1','Edge W2','Edges','Banding mm','Banding m','Note']], n = 0;
    c.lines.forEach(function(l){
      var u = l.unit, owner = u ? u.id : l.run.id, cab = u ? (u.name||TYPES[u.type].label) : 'Run extras';
      l.sum.parts.forEach(function(p){
        n++;
        parts.push([n, l.run.name, cab, p.name].concat(decorCols(partDecor(p, u)), [p.thick, p.finH, p.finW, p.h, p.w, p.qty, grainWord(partGrain(owner, p.name))], edgeMarks(p.bands),
          [edgeCode(p.bands).replace('—',''), (p.bands && (p.bands.w||p.bands.h)) ? (p.edgeT||s.edgeThickness) : '', +((p.edgeRun||0)/1000).toFixed(2), partNote(p)]));
      });
    });
    out.push({name:'Parts', rows:parts, cols:[4,16,20,26,26,10,14,10,10,10,12,12,6,11,7,7,7,7,12,10,10,50]});
    // the same parts, board by board: what goes on the saw together
    var byBoard = [['Board','Thickness mm','#','Part','Cabinet','Length mm','Width mm','Cut length mm','Cut width mm','Qty','Grain','Grain kept','Edge L1','Edge L2','Edge W1','Edge W2','Edges']];
    c.plan.forEach(function(g){
      var kept = grainPinned(g.decor) ? 'yes' : 'no', k = 0;
      g.parts.forEach(function(p){ k++; byBoard.push([decorLabel(g.decor), g.thickness, k, p.name, p.cab, p.L, p.W, p.cutL, p.cutW, p.qty, grainWord(p.grain), p.grain ? kept : ''].concat(edgeMarks(p.bands), [edgeCode(p.bands).replace('—','')])); });
    });
    out.push({name:'By board', rows:byBoard, cols:[30,10,5,26,22,10,10,12,12,6,11,10,7,7,7,7,12]});
    // the boards
    var boards = [['Board','Decor code','Surface','Thickness mm','Pieces','Sheets used','From stock','To buy','Sheet sizes','Used %','Banding m','Grain kept','Cost']];
    c.plan.forEach(function(g){
      var sizes = g.sheets.reduce(function(a,sh){ var k2 = sh.sheetW+' x '+sh.sheetH; a[k2] = (a[k2]||0)+1; return a; }, {});
      boards.push(decorCols(g.decor).slice(0,1).concat(decorCols(g.decor).slice(1), [g.thickness, g.pieceCount, g.needed, g.onHandUsed, c.mode==='precut' ? 0 : g.toBuy,
        Object.keys(sizes).map(function(k2){ return sizes[k2]+' x '+k2; }).join(', '), Math.round(g.utilization), +(g.edgeRun/1000).toFixed(2), grainPinned(g.decor) ? 'yes' : 'no', g.unpriced ? 'not priced' : +g.cost.toFixed(2)]));
    });
    out.push({name:'Boards', rows:boards, cols:[30,10,14,10,8,10,10,8,24,8,10,10,12]});
    // the cutting plan: each sheet, its pieces numbered in cutting order as on the printed plan
    var plan = [['Board','Thickness mm','Sheet','Sheet size mm','Source','Piece','Part','Cabinet','X mm','Y mm','Width mm','Height mm','Grain','Turned']];
    c.plan.forEach(function(g){
      g.sheets.forEach(function(sh, i){
        var items = sh.items.slice().sort(function(a,b){ return a.y-b.y || a.x-b.x; });
        items.forEach(function(it, k){
          var lab = it.label||'', cut = lab.indexOf(': ');
          plan.push([decorLabel(g.decor), g.thickness, (i+1)+' of '+g.sheets.length, sh.sheetW+' x '+sh.sheetH, sh.onHand ? 'stock' : sh.precut ? 'pre-cut' : 'buy',
            k+1, cut>=0 ? lab.slice(cut+2) : lab, cut>=0 ? lab.slice(0,cut) : '', Math.round(it.x+(s.trim||0)), Math.round(it.y+(s.trim||0)), Math.round(it.w), Math.round(it.h),
            it.locked ? grainWord(it.grain) : (it.grain ? grainWord(it.grain)+' (free)' : 'None'), it.turned ? 'yes' : '']);
        });
      });
    });
    out.push({name:'Cutting plan', rows:plan, cols:[30,10,8,14,8,6,26,22,8,8,10,10,14,7]});
    var d = new Date();
    out.push({name:'Project', rows:[
      ['Project', s.project||'Kitchen'], ['Exported', d.toISOString().slice(0,10)], ['App', 'Kitchen Run Studio v'+APP_VERSION],
      ['Cabinets', c.unitCount], ['Pieces', c.pieces], ['Board area m²', +c.area.toFixed(2)], ['How the board is bought', modeName(c.mode)],
      ['Blade kerf mm', s.kerf], ['Edge trim mm', s.trim], ['Gap around fronts mm', s.gap], ['Edge banding', s.edgeOn ? edgeDesc()+', parts cut undersize' : 'off: parts cut at finished size'], ['Level', tierLabel()],
      ['Grain', s.grain==='length' ? 'kept on every board' : s.grain==='decor' ? 'kept on wood and stone decors' : 'parts may turn'],
      ['Sizes', 'Length is the part’s height as it stands, Width its width. L1 L2 are its long edges, W1 W2 its short ones. Vertical grain runs along the length, horizontal along the width.'],
      ['Total', +c.total.toFixed(2)+' '+s.currency]], cols:[24,90]});
    return out;
  }
  function exportXLSX(){
    var name = String(state.settings.project||'kitchen').replace(/[\\\/:*?"<>|]+/g,' ').trim()+' - cut list.xlsx';
    toast('Making the Excel file…');
    loadXLSX().then(function(X){
      var wb = X.utils.book_new();
      workbookSheets().forEach(function(sh){
        var ws = X.utils.aoa_to_sheet(sh.rows);
        ws['!cols'] = sh.cols.map(function(w){ return {wch:w}; });
        if(sh.name!=='Project' && sh.rows.length>1) ws['!autofilter'] = {ref:X.utils.encode_range({s:{r:0,c:0}, e:{r:sh.rows.length-1, c:sh.rows[0].length-1}})};
        X.utils.book_append_sheet(wb, ws, sh.name);
      });
      var data = X.write(wb, {bookType:'xlsx', type:'array'});
      downloadData(new Blob([data], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), name, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    }).catch(function(){
      // offline: the parts as a CSV file, which Excel opens too
      var rows = workbookSheets()[0].rows;
      var csv = rows.map(function(r){ return r.map(function(v){ var t = String(v==null?'':v); return /[",;\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t; }).join(','); }).join('\r\n');
      downloadData('﻿'+csv, name.replace(/\.xlsx$/, '.csv'), 'text/csv');
      toast('The Excel writer could not load, so the parts were saved as a CSV file', 3600);
    });
  }
  function serviceCSV(){
    var c = compute(), s = state.settings, rows = [['Board','Thickness mm','#','Part','Cabinet','Length mm','Width mm','Qty','Grain','Edges','Banding mm']], n = 0;
    c.plan.forEach(function(g){
      g.parts.forEach(function(p){ n++; rows.push([decorLabel(g.decor), g.thickness, n, p.name, p.cab, p.L, p.W, p.qty, grainCode(p.grain), edgeCode(p.bands), edgeTFor(p.name)]); });
    });

  function numIn(scope, key, label, val, unit, min, max, step){
    // a cabinet's sizes get −10 / +10 buttons, shown on a phone, where typing mm is slow
    var nud = (scope==='uf' && unit==='mm') ? ['<button type="button" class="nud screen-only" data-act="nudge" data-d="-10" aria-label="10 mm less">−</button>', '<button type="button" class="nud screen-only" data-act="nudge" data-d="10" aria-label="10 mm more">+</button>'] : ['', ''];
    return '<div class="field"><label>'+label+'</label><div class="inrow">'+nud[0]+
      '<input type="number" inputmode="decimal" data-'+scope+'="'+key+'" value="'+val+'"'+
      (min!==undefined?' min="'+min+'"':' min="1"')+(max!==undefined?' max="'+max+'"':'')+' step="'+(step||1)+'">'+
      (unit?'<span class="unit">'+unit+'</span>':'')+nud[1]+'</div></div>';
  }

  function optsHTML(u, scope){
    var o = u.opts, h = '';
    function n(key,label,val,min,max){
      return '<div class="field" style="margin:0"><label>'+label+'</label><input type="number" inputmode="decimal" data-'+scope+'="'+key+'" value="'+val+'" min="'+min+'" max="'+max+'"></div>';
    }
    function sel(key,label,items,cur){
      return '<div class="field" style="margin:0"><label>'+label+'</label><select data-'+scope+'="'+key+'">'+
        items.map(function(it){ return '<option value="'+it.v+'"'+(String(it.v)===String(cur)?' selected':'')+'>'+it.t+'</option>'; }).join('')+'</select></div>';
    }
    if(u.type==='shelf')  h += n('shelfCount','Shelves',o.shelfCount,0,20);
    if(u.type==='drawer') h += n('drawerCount','Drawers',o.drawerCount,1,12);
    if(u.type==='door' || u.type==='sink') h += sel('doorCount','Doors',[{v:1,t:'1 single'},{v:2,t:'2 double'}], o.doorCount||2);
    if(u.type==='door') h += n('shelfCount','Shelves inside',doorShelves(u),0,12);
    if(u.type==='combo')  h += n('drawerZone','Zone mm',o.drawerZone,100,2000)+n('drawerCount','Drawers',o.drawerCount,1,8)+n('shelfCount','Shelves',o.shelfCount,0,10);
    if(u.type==='wine')   h += n('wineRows','Rows',o.wineRows,1,20);
    if(u.type==='corner') h += sel('cornerStyle','Style',[{v:'blind',t:'Blind corner'},{v:'lazysusan',t:'Lazy susan'}], o.cornerStyle||'blind')+n('doorWidth','Door W',o.doorWidth||450,200,900);
    if(u.type==='gap'){
      h += sel('appliance','Appliance',[{v:'under',t:'Under counter'},{v:'tall',t:'Full height'}], o.appliance||'under');
      h += sel('kind','What goes in', APPLIANCES.map(function(a){ return {v:a.id, t:a.label}; }), applianceKind(u));
      h += sel('front','Its front',[{v:'none',t:'Its own (free-standing)'},{v:'door',t:'A furniture door'}], o.front||'none');
    }
    if(u.type==='housing'){
      var bottom = o.bottom||'drawers';
      h += sel('bottom','Bottom',[{v:'drawers',t:'Drawers'},{v:'door',t:'Door'},{v:'none',t:'Nothing'}], bottom);
      if(bottom!=='none') h += n('bottomH','Bottom mm',o.bottomH||0,60,2000);
      if(bottom==='drawers') h += n('drawerCount','Drawers',o.drawerCount||2,1,6);
      h += sel('oven','Oven',[{v:'yes',t:'Oven'},{v:'no',t:'No oven'}], o.oven||'yes');
      if((o.oven||'yes')!=='no') h += n('ovenH','Oven mm',o.ovenH||595,200,1000);
      h += sel('micro','Microwave',[{v:'yes',t:'Microwave'},{v:'no',t:'No microwave'}], o.micro||'yes');
      if((o.micro||'yes')!=='no') h += n('microH','Microwave mm',o.microH||380,150,800);
      h += sel('doorCount','Top doors',[{v:0,t:'None, open'},{v:1,t:'1 single'},{v:2,t:'2 double'}], housingDoors(u));
      h += n('shelfCount','Top shelves',o.shelfCount||0,0,10);
    }
    // a single door hinges on the side you choose
    if(singleDoor(u)) h += sel('hinge','Door opens',[{v:'left',t:'From the right (hinged left)'},{v:'right',t:'From the left (hinged right)'}], hingeSide(u));
    if(stackParentId(u)) h += n('before','From its left edge',o.before||0,-3000,3000);
    else if(isFree(u)){ h += n('posx','From the left',o.pos.x,-3000,20000); h += n('posy','Underside above floor',o.pos.y,0,6000); }
    else h += n('before','Space before',o.before||0,0,3000);
    h += sel('fin','Finished side',[{v:'none',t:'None'},{v:'left',t:'Left'},{v:'right',t:'Right'},{v:'both',t:'Both'}], o.fin||'none');
    if(isWallLike(u)) h += sel('finBottom','Finished bottom',[{v:'no',t:'None'},{v:'yes',t:'Panel under'}], o.finBottom||'no');
    if(scope==='uo'){
      var fu0 = findUnit(u.id), below = fu0 ? stackedOn(fu0.run, u) : [];
      var others = fu0 ? fu0.run.units.filter(function(x){ return x!==u && below.indexOf(x)<0; }) : [];
      var rowName = u.level==='upper' ? 'The wall units\u2019 line' : u.level==='wall' ? 'The wall, on its line' : 'The floor, in its row';
      h += sel('on','Stands on',[{v:'',t:rowName},{v:'__free',t:'Nothing: a place of its own'}].concat(others.map(function(x){ return {v:x.id, t:(x.name||TYPES[x.type].label)+' ('+TYPES[x.type].code+', '+LEVELS[x.level].label+')'}; })), isFree(u) ? '__free' : stackParentId(u));
    }
    var decs = DECORS.map(function(d){ return {v:d.id, t:decorShort(d)}; });
    // a decor, and its surface when it comes in more than one
    function decorSel(key, label, first, curId){
      var cur = curId ? decorBase(curId) : first.v, d = curId && decorById(curId, DECORS);
      var out = sel(key, label, [first].concat(decs), cur);

  /* ---------------- render ---------------- */
  // A caret cannot be restored inside a number input — the browser refuses to

  /* ---------------- project files ----------------
     Projects live in this browser's storage only. A project file is how one
     moves between the phone, the tablet and the PC — or gets kept for good. */
  var FILE_KIND = 'kitchen-run-studio/project';
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  function isStandalone(){
    return navigator.standalone===true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  function projectFileName(){
    var n = String(state.settings.project||'kitchen').replace(/[\\\/:*?"<>|]+/g,' ').trim().replace(/\s+/g,'-').slice(0,60);
    return (n||'kitchen')+'.kitchen.json';
  }
  function projectFileText(){
    return JSON.stringify({kind:FILE_KIND, app:'Kitchen Run Studio', version:APP_VERSION, savedAt:new Date().toISOString(),
      project:{runs:state.runs, single:state.single, settings:state.settings, standards:state.standards}}, null, 1);
  }
  function saveProjectFile(){

  function downloadText(text, name){ downloadData(text, name, 'application/json'); }
  function downloadData(data, name, mime){
    // on claude.ai the page hands the file to the viewer through the platform
    if(window.claude && typeof window.claude.use==='function'){
      window.claude.use('downloads').then(function(dl){
        if(!dl) return plainDownload(data, name, mime);
        return dl.save({filename:name, data:data}).then(function(){ toast('Saved '+name); })
          .catch(function(e){
            var code = e && e.code;
            if(code==='declined' || code==='rate_limited') return;
            if(code==='unavailable' || code==='not_granted' || code==='capability_disabled' || code==='capability_removed') return plainDownload(data, name, mime);
            toast('Could not save the file');
          });
      }).catch(function(){ plainDownload(data, name, mime); });
      return;
    }
    plainDownload(data, name, mime);
  }
  // the drawings colour themselves from the theme's variables, which a file
  // on its own cannot read, so the values are written in before it leaves
  function cssVarsResolved(text){
    var cs = getComputedStyle(document.documentElement);
    for(var i=0;i<4 && text.indexOf('var(--')>=0;i++){
      text = text.replace(/var\(--([a-z0-9-]+)\)/g, function(m, v){ return cs.getPropertyValue('--'+v).trim() || '#888'; });
    }
    return text;
  }
  function save3dImage(runId){
    var room = runId==='room', run = room ? {name:'The room'} : findRun(runId);
    var svg = document.querySelector(room ? '[data-room] .elev-3d' : '[data-run="'+runId+'"] .elev-3d');
    if(!run || !svg) return;
    var vb = svg.getAttribute('viewBox').split(' ').map(Number), W = 2000, H = Math.max(200, Math.round(W*vb[3]/vb[2]));
    var bg = cssVarsResolved('var(--panel-2)');
    var src = cssVarsResolved(svg.outerHTML).replace(/ style="[^"]*"/, '').replace(/ class="[^"]*"/g, '')
      .replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" ');
    var url = URL.createObjectURL(new Blob([src], {type:'image/svg+xml;charset=utf-8'})), img = new Image();
    img.onload = function(){
      var c = document.createElement('canvas'); c.width = W; c.height = H;
      var ctx = c.getContext('2d'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H); ctx.drawImage(img, 0, 0, W, H);
      URL.revokeObjectURL(url);
      c.toBlob(function(blob){
        if(!blob){ toast('Could not make the picture'); return; }
        downloadData(blob, (state.settings.project||'Kitchen')+' - '+run.name+' (3D).png', 'image/png');
      }, 'image/png');
    };
    img.onerror = function(){ URL.revokeObjectURL(url); toast('Could not make the picture'); };

  }
  function plainDownload(data, name, mime){
    var blob = (data instanceof Blob) ? data : new Blob([data], {type:mime||'application/octet-stream'});
    var url = URL.createObjectURL(blob), a = document.createElement('a');

    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
    toast('Saved '+name);
  }
  function readProjectFile(file){

    r.onerror = function(){ toast('Could not read '+file.name); };
    r.readAsText(file);
  }
  function importProject(text, name){
    var o;

  // Copies a table as tab-separated text — it pastes straight into Excel,
  // Numbers or Sheets as columns, which is how a cut list reaches a supplier.
  function copyTable(kind){
    var c = compute(), s = state.settings, rows = [];
    if(kind==='cut'){
      rows.push(['Run','Cabinet','Part','Qty','W mm','H mm','T mm','Colour','Edges','Grain','m²','Note']);
      c.lines.forEach(function(l){
        var who = l.unit ? (l.unit.name||TYPES[l.unit.type].label) : 'Run extras', owner = l.unit ? l.unit.id : l.run.id;
        l.sum.parts.forEach(function(p){
          rows.push([l.run.name, who, p.name, p.qty, p.w, p.h, p.thick, decorLabel(partDecor(p, l.unit)), edgeCode(p.bands).replace('—',''), grainWord(partGrain(owner, p.name)), p.area.toFixed(3), partNote(p)]);
        });
      });
    } else {
      rows.push(['Item','Detail','Qty','Unit','Unit price','Cost']);
      c.plan.forEach(function(g){
        if(c.mode==='service'){
          g.buySizes.forEach(function(b){ rows.push([matLabel(g)+' board, cut by the service', b.sheetW+' x '+b.sheetH+' mm', b.qty, 'sheet', g.unpriced?'':(g.servicePrice+g.serviceFee)+' (sheet '+g.servicePrice+' + processing '+g.serviceFee+')', g.unpriced?'':(b.qty*(g.servicePrice+g.serviceFee)).toFixed(2)]); });
          return;
        }
        g.buySizes.forEach(function(b){ rows.push([matLabel(g)+' board', b.sheetW+' x '+b.sheetH+' mm', b.qty, 'sheet', g.unpriced?'':priceFor(g.thickness, g.decor)+'/m²', g.unpriced?'':(b.qty*b.sheetW*b.sheetH/1e6*priceFor(g.thickness, g.decor)).toFixed(2)]); });
        if(g.precutCount>0) rows.push([matLabel(g)+' pre-cut to size','', g.precutArea.toFixed(2), 'm²', g.precutRate, g.precutCost.toFixed(2)]);
      });
      if(c.edgeShown) rows.push(['Edge banding'+(c.mode==='service' ? ' by the service' : ''), edgeDesc(), Math.ceil(c.edgeM), 'm', c.edgeRate, c.edgeCost.toFixed(2)]);
      if(c.orderFee>0) rows.push(['Fee per order','', 1, 'order', c.orderFee, c.orderFee.toFixed(2)]);
      c.hwRows.forEach(function(r){ rows.push([r.label,'', r.qty, r.unit, r.price, r.cost.toFixed(2)]); });
      if(s.worktopOn) rows.push(['Worktop', Math.round(c.worktopLen)+' mm x '+(c.worktopVaries ? 'cabinet depths' : state.standards.worktopD+' mm'), c.worktopArea.toFixed(2), 'm²', s.worktopPrice, c.worktopCost.toFixed(2)]);
      if(s.labourOn) rows.push(['Shop time','', c.hours.toFixed(1), 'h', s.labourRate, c.labourCost.toFixed(2)]);
      rows.push(['Total','','','','', c.total.toFixed(2)]);
    }
    var tsv = rows.map(function(r){ return r.map(function(v){ return String(v==null?'':v).replace(/\t|\n/g,' '); }).join('\t'); }).join('\n');
    var done = function(){ toast('Copied — paste into a spreadsheet'); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(tsv).then(done, function(){ fallbackCopy(tsv, done); }); }
    else fallbackCopy(tsv, done);
  }
  function fallbackCopy(text, done){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy failed'); }
    document.body.removeChild(ta);
  }

  function numOf(el){ var v = parseFloat(el.value); return isNaN(v) ? null : v; }

  // one delegated handler for every value in the app
  function onInput(e){
    var el = e.target;
    if(el.closest && el.closest('[data-quotes]')){ qInput(e); return; }
    if(e.type==='change' && el.tagName!=='SELECT' && el.type!=='checkbox') return;
    var a;

    if(el.id==='projname'){ state.settings.project = el.value; save(); return; }
    if((a = el.getAttribute('data-grain'))){
      if(e.type!=='change') return;
      var gv = el.value, gname = a.slice(a.indexOf('|')+1);
      // the usual direction for that part needs no entry of its own
      var gnext = (grainOf(gname)||'none')===gv ? undefined : gv;
      if(state.settings.grainOv[a]===gnext) return;
      snapshot();
      if(gnext===undefined) delete state.settings.grainOv[a]; else state.settings.grainOv[a] = gnext;
      touch(); return;
    }
    if((a = el.getAttribute('data-dp'))){
      if(a==='q'){ if(e.type==='change') return; dp.q = el.value; dp.limit = 84; refreshPickers(true); return; }
      if(a==='fin'){ dp.fin = el.value; dp.limit = 84; refreshPickers(); return; }
      if(a==='finish'){ dpSet(composeDecor(decorBase(dpCurrentId()), el.value)); return; }
      return;
    }
    if((a = el.getAttribute('data-pick'))){
      if(a==='level') pickerLevel = el.value;
      else { var pw = numOf(el); if(pw!==null) pickerW = pw; }
      return;
    }

    if((a = el.getAttribute('data-rfield'))){
      var rh = el.closest('[data-run],[data-runins]');
      var run = rh && findRun(rh.getAttribute('data-run')||rh.getAttribute('data-runins'));
      if(!run) return;
      if(a==='name'){ run.name = el.value; save(); invalidate(); return; }
      if(a.indexOf('pl:')===0){
        run.place = run.place||{wall:'back', off:0, x:0, z:0, rot:0};
        var pk = a.slice(3);
        if(pk==='wall'){
          snapshot(); run.place.wall = el.value;
          if(el.value==='free' && !(run.place.x>0 || run.place.z>0)){ run.place.x = Math.round(state.room.W/20)*10; run.place.z = Math.round(state.room.D/20)*10; }
        } else { var pv2 = numOf(el); if(pv2===null) return; var wasP = run.place[pk]; if(!checked(function(){ run.place[pk] = pv2; })) el.value = wasP; }
        touch(); return;
      }
      if(a.indexOf('fl:')===0){
        run.fillers = run.fillers||{};
        run.fillers[a.slice(3)] = el.value.trim()==='' ? null : fillerVal(el.value);
        touch(); return;
      }
      if(a.indexOf('end:')===0){
        run.ends = run.ends||{};
        if(run.ends[a.slice(4)]===el.checked) return;
        run.ends[a.slice(4)] = el.checked; snapshot(); touch(); return;
      }
      var v = numOf(el); if(v===null) return;
      var wasL = run.wallLength;
      if(!checked(function(){ run.wallLength = v; })){ el.value = wasL; }
      touch(); return;
    }
    if((a = el.getAttribute('data-room'))){
      var rv = numOf(el); if(rv===null) return;
      state.room[a] = Math.max(500, rv); touch(); return;
    }
    if((a = el.getAttribute('data-op'))){
      var opp = a.split(':'), opn = state.room.openings[+opp[0]]; if(!opn) return;
      if(opp[1]==='kind' || opp[1]==='wall'){ snapshot(); opn[opp[1]] = el.value; if(opp[1]==='kind' && el.value==='door' && !(opn.h>1500)) opn.h = 2050; if(opp[1]==='kind' && el.value==='window' && opn.h>1800) opn.h = 1200; }
      else { var opv = numOf(el); if(opv===null) return; opn[opp[1]] = opv; }
      touch(); return;
    }
    if(el.getAttribute('data-start')==='W'){ var swv = numOf(el); if(swv!==null) startW = swv; return; }
    if((a = el.getAttribute('data-wiz'))){
      WIZ[a] = (el.type==='checkbox') ? el.checked : el.value; return;
    }
    if((a = el.getAttribute('data-uf')) || (a = el.getAttribute('data-uo'))){
      var f = findUnit(selUnit); if(!f) return;
      var isOpt = el.hasAttribute('data-uo');
      applyUnitField(f, a, el, isOpt); return;
    }
    if((a = el.getAttribute('data-sf')) || (a = el.getAttribute('data-so'))){
      var sg = state.single, isO = el.hasAttribute('data-so');

  function qEstBlock(){

  function qMini(){

      '<span class="s">'+qPl(e.c.unitCount,'cabinet','cabinets')+', '+Q_FINISH[Q.finish].label.toLowerCase()+', '+Q_SCOPE[Q.scope].label.toLowerCase()+'</span>';
  }
  var Q_LIVE = {

  function qEmpty(title, text, step, label){

  }

      var on = Q.step===i+1, dn = done[i] && !on;

  /* ---------------- step 1: the estimate ---------------- */
  function qNum(attr, key, label, val, unit, step){
    return '<div class="field"><label for="q'+attr+'-'+key+'">'+label+'</label><div class="inrow">'+

  function qStep1(){
    var e = qEstimate(), c = e.c, R = Q.rates, sym = qSym(), runs = state.runs.length;

            qNum('r','shopH','Workshop time per cabinet', R.shopH, 'h', 0.1)+

  /* ---------------- step 2: the request ---------------- */
  function qErr(k){ return Q.errors[k] ? '<div class="q-err" id="qe-'+k+'">'+Q.errors[k]+'</div>' : ''; }
  function qChoice(type, key, val, label, note, on){
    var id = 'qf-'+key.replace('.','-')+(type==='radio' ? '-'+val : '');

      '<span>'+label+(note ? '<small>'+note+'</small>' : '')+'</span></label>';
  }
  function qText(key, label, type, attrs, cls){
    var bad = !!Q.errors[key];

      '<input type="'+type+'" id="qf-'+key+'" data-qf="'+key+'" value="'+escAttr(String(Q[key]||''))+'"'+(attrs||'')+

  }
  function qPhotoThumbs(removable){

    }).join('')+'</div>';
  }
  function qStep2(){

        '</div></fieldset>'+
        '<fieldset><legend>The room</legend>'+

          '</div>'+

  function qKitchenLine(e){
    var c = e.c;

        qFact('Drawings', 'Front, top and 3D view of '+qPl(state.runs.length,'wall','walls'))+

        '<button type="button" class="btn primary" data-qact="sendA">'+(Q.aSent ? 'Update quote' : 'Send quote')+'</button></div>'+

          '<button type="button" data-qact="lead" data-v="full"'+(Q.lead==='full'?' class="on" aria-pressed="true"':'')+'>After accepting</button></span></header>'+
      '<div class="body">'+(Q.lead==='full' ? qLeadFull() : qLeadPreview())+'</div></section>';

  /* ---------------- step 4: compare ---------------- */
  function qLine(k, v){ return '<tr><td>'+k+'</td><td class="n">'+(+v>0 ? money0(+v) : '—')+'</td></tr>'; }
  function qCard(x, min){
    var q = x.q, t = x.t, est = Q.sentEst, on = Q.chosen===x.id;
    var chips = (t===min ? '<span class="chip ok">Lowest</span>' : '')+

    return '<article class="q-quote'+(on?' on':'')+'">'+
      '<header><span class="q-av">'+x.id+'</span><div><b>Contractor '+x.id+'</b><small>'+x.ct.trade+', '+x.ct.km+' km</small></div></header>'+
      '<div class="q-tot">'+money0(t)+'</div><div class="q-chips">'+chips+'</div>'+
      '<table class="dt q-lines"><tbody>'+qLine('Materials', q.mat)+qLine('Fabrication', q.fab)+qLine('Installation', q.inst)+qLine('Extras', q.extras)+'</tbody></table>'+
      '<dl class="q-facts sm">'+
        qFact('Site visit', Q_VISIT[q.visit]||'')+qFact('Valid for', (+q.valid||0)+' days')+qFact('Earliest start', 'In '+(+q.start||0)+' weeks')+
        (x.ct.pdf ? qFact('Attached', 'Their own PDF') : '')+
      '</dl>'+
      (on ? (access().dealDone
              ? '<div class="note ok" style="margin:0">Confirmed. '+x.ct.trade+': <b>'+esc('contractor'+x.id.toLowerCase()+'@example.ro')+'</b>, 07xx xxx xxx. The full plans are open in Cut list and Order.</div>'
              : '<div class="note warn" style="margin:0">Chosen. Waiting for Contractor '+x.id+' to confirm the job; you get their contact and the full plans then.</div>')
          : (Q.chosen ? '<button type="button" class="btn full" disabled>Not chosen</button>' : '<button type="button" class="btn primary full" data-qact="choose" data-id="'+x.id+'">Take this offer</button>'))+
    '</article>';
  }
  function qStep4(){
    if(!Q.sent) return qEmpty('No request yet', 'Quotes come back once the request from step 2 is sent.', 2, 'Go to the request');
    if(!Q.simulated) return qEmpty('Quotes arrive once contractors accept', 'In this preview, skip ahead 48 hours in step 3 to see them.', 3, 'Go to contractors');
    var xs = ['A','B','D'].map(function(id){ var q = Q.quotes[id]; return {id:id, ct:qCt(id), q:q, t:qTotal(q)}; });
    var min = Math.min.apply(null, xs.map(function(x){ return x.t; }));
    return '<section class="card"><header><h2>Your 3 quotes</h2><span class="sub">all priced on the same plan and cut list</span></header>'+
      '<div class="body">'+
        qBar(Q.sentEst, xs.map(function(x){ return {id:x.id, v:x.t, on:Q.chosen===x.id}; }))+
        '<p class="hint" style="margin-top:0">The band is the estimate you saw when you sent the request, the line its midpoint; each letter is a quote.</p>'+
        '<div class="q-quotes">'+xs.map(function(x){ return qCard(x, min); }).join('')+'</div>'+
        (Q.chosen && !access().dealDone ? '<p class="hint" style="margin-top:14px">In this prototype, switch to <b>Contractor</b> above to confirm the job and pay the platform’s share.</p>' : '')+
        (Q.chosen ? '<div class="btnrow" style="margin-top:14px"><button type="button" class="btn" data-qact="go" data-step="5">Go to the follow-up</button></div>' : '')+
      '</div></section>';
  }

  /* ---------------- step 5: follow-up ---------------- */
  function qCalib(){
    if(Q.fChosen==='none') return '<div class="note info q-calib">Without a final price there is nothing to learn from this request, so the estimate stays as it is.</div>';
    var fin = +Q.finalPrice, ratio = fin/Q.sentEst.mid;
    var n = Q_HISTORY.jobs, next = (Q_HISTORY.avg*n + ratio)/(n+1);
    var diff = Math.abs(ratio-1)*100;
    return '<div class="q-calib"><h3 class="q-h3">What this teaches the estimate</h3>'+
      '<div class="tiles">'+
        tile('Estimate midpoint', money0(Q.sentEst.mid), 'when the request went out')+
        tile('Final price', money0(fin), 'Contractor '+Q.fChosen)+
        tile('This job', '×'+ratio.toFixed(2), diff<0.5 ? 'right on the midpoint' : diff.toFixed(0)+'% '+(ratio>1 ? 'above' : 'below')+' the midpoint')+
        '<div class="tile hero"><span class="k">Area average</span><span class="v">×'+next.toFixed(2)+'</span><span class="s">'+(n+1)+' jobs, '+n+' of them example history</span></div>'+
      '</div>'+
      '<p class="hint">Future estimates in this postcode area are multiplied by the average, so the range drifts towards what kitchens really cost here.</p>'+
      (Q.applied ? '<div class="note ok">Applied. Step 1 now includes ×'+Q.calib.toFixed(2)+'.</div>'
                 : '<div class="btnrow"><button type="button" class="btn primary" data-qact="apply" data-k="'+next.toFixed(4)+'">Use ×'+next.toFixed(2)+' for future estimates</button></div>')+
    '</div>';
  }
  function qStep5(){
    if(!Q.chosen) return qEmpty('Choose a quote first', 'The follow-up goes out 30 days after the request, once a quote is chosen.', 4, 'Go to the quotes');
    var sym = qSym();
    var opts = ['A','B','D'].map(function(id){ return '<option value="'+id+'"'+(Q.fChosen===id?' selected':'')+'>Contractor '+id+', '+money0(qTotal(Q.quotes[id]))+'</option>'; }).join('')+
      '<option value="none"'+(Q.fChosen==='none'?' selected':'')+'>None of them</option>';
    return '<section class="card"><header><h2>Follow-up</h2><span class="sub">sent '+qDate(Q.sentAt,30)+', 30 days after the request</span></header>'+
      '<div class="body"><div class="q-msg">'+
        '<p><b>How did your kitchen go?</b> Two quick answers help price the next kitchen in your area more accurately.</p>'+
        '<div class="q-g">'+
          '<div class="field"><label for="qu-fChosen">Which quote did you go with?</label><select id="qu-fChosen" data-qu="fChosen">'+opts+'</select></div>'+
          (Q.fChosen!=='none' ? qNum('u','finalPrice','Final agreed price', Q.finalPrice, sym, 10) : '')+
          '<div class="field"><label for="qu-onSite">Did they measure on site?</label><select id="qu-onSite" data-qu="onSite">'+
            '<option value="yes"'+(Q.onSite==='yes'?' selected':'')+'>Yes</option><option value="no"'+(Q.onSite==='no'?' selected':'')+'>No</option></select></div>'+
        '</div>'+
        (Q.fChosen!=='none' ? '<p class="hint" style="margin-top:0">The price is filled in as an example: a little above the quote, as after a site measurement.</p>' : '')+
        '<div class="btnrow"><button type="button" class="btn primary" data-qact="follow">'+(Q.followed ? 'Update answers' : 'Send answers')+'</button></div>'+
      '</div>'+(Q.followed ? qCalib() : '')+'</div></section>';
  }

  /* ---------------- who may see the plans ----------------
     Two ways through. Buy the plans: the cut list, the drawings and the
     Excel file are yours. Or ask for quotes for nothing: you keep the
     drawings, a contractor who accepts sees the plans to price them, and
     once you take an offer and the contractor pays the platform's share,
     both of you get the full plans; the Excel of the parts goes to the
     contractor. The role switch stands in for the three sign-ins a real
     site would have; the checkout is simulated. */
  function access(){
    if(!state.access) state.access = {path:null, paid:false, paidAt:null, role:'customer', dealDone:false, dealAt:null, commission:0, ledger:[]};
    return state.access;
  }
  function role(){ return access().role||'customer'; }
  function ROLE_NAMES(){ return {customer:'Customer', contractor:'Contractor', platform:'Platform'}; }
  function contractorAccepted(){ return !!(Q.sent && Q.simulated); }
  function plansAllowed(){
    var r = role(), a = access();
    if(r==='platform') return true;
    if(r==='contractor') return contractorAccepted() || a.dealDone;
    return a.paid || a.dealDone;
  }
  function excelAllowed(){
    var r = role(), a = access();
    if(r==='platform') return true;
    if(r==='contractor') return a.dealDone;
    return a.paid;
  }
  function detailsAllowed(){ return role()!=='contractor' || access().dealDone; }
  function roleSwitch(){
    var R = ROLE_NAMES();
    return '<span class="seg mini" role="group" aria-label="Seen as">'+Object.keys(R).map(function(k){
      return '<button type="button" data-qact="role" data-r="'+k+'"'+(role()===k?' class="on" aria-pressed="true"':'')+'>'+R[k]+'</button>';
    }).join('')+'</span>';
  }
  function lockCard(what){
    var a = access(), s = state.settings, r = role();
    var inner;
    if(r==='contractor') inner = '<p>The '+what+' opens once you accept a request: then you can price the job from the real plans. The customer’s name and contact come only when they take your offer.</p>'+
      '<div class="btnrow" style="justify-content:center"><button type="button" class="btn primary" data-qact="go" data-step="3">Go to the requests</button></div>';
    else inner = '<p>Your drawings and the estimate are free. The '+what+' is part of the plans, which you can have in one of two ways:</p>'+
      '<div class="q-choices" style="text-align:left;max-width:720px;margin:14px auto 0">'+
        '<div class="q-choice" style="cursor:default;display:block"><b>Buy the plans</b><small>The cut list, the drawings and the Excel of the parts, to build it or have it built anywhere. '+money0(s.planPrice||0)+', once.</small>'+
          '<div class="btnrow" style="margin-top:10px"><button type="button" class="btn primary" data-qact="checkout">Buy the plans for '+money0(s.planPrice||0)+'</button></div></div>'+
        '<div class="q-choice" style="cursor:default;display:block"><b>Ask contractors for quotes</b><small>Free. Contractors near you price the plans; when you take an offer, you and the contractor both get the full plans.</small>'+
          '<div class="btnrow" style="margin-top:10px"><button type="button" class="btn" data-qact="go" data-step="'+(Q.sent ? 3 : 2)+'">'+(Q.sent ? 'See the requests' : 'Request quotes')+'</button></div></div>'+
      '</div>';
    return '<section class="card" data-quotes><div class="empty"><b style="color:var(--ink);font-size:17px">'+what.charAt(0).toUpperCase()+what.slice(1)+' is locked</b>'+inner+
      '<p class="hint" style="margin:14px auto 0">Seen as: '+roleSwitch()+'</p></div></section>';
  }
  function checkoutCard(){
    var s = state.settings;
    return '<section class="card" data-quotes><header><h2>Buy the plans</h2><span class="sub">simulated payment</span></header>'+
      '<div class="body"><div class="tiles" style="margin-bottom:12px">'+
        tile('The plans', money0(s.planPrice||0), 'once, for this project')+
        tile('You get', 'Cut list, drawings, Excel', 'and every later change to them')+
      '</div>'+
      '<div class="note info">A real site would take the card here (Stripe, Netopia). Nothing is charged in this prototype.</div>'+
      '<div class="q-g"><div class="field"><label>Name on the card</label><input type="text" value="" placeholder="Ana Popescu" autocomplete="off"></div>'+
        '<div class="field"><label>Card number</label><input type="text" value="" placeholder="4242 4242 4242 4242" inputmode="numeric" autocomplete="off"></div>'+
        '<div class="field"><label>Expiry</label><input type="text" value="" placeholder="12/28" autocomplete="off"></div></div>'+
      '<div class="btnrow"><button type="button" class="btn primary" data-qact="pay">Pay '+money0(s.planPrice||0)+' (simulated)</button><button type="button" class="btn ghost" data-qact="go" data-step="1">Back</button></div>'+
      '</div></section>';
  }
  function platformCard(){
    var s = state.settings, a = access(), led = a.ledger||[];
    var earned = led.reduce(function(t,l){ return t + (l.amount||0); }, 0);
    return '<section class="card" data-quotes><header><h2>Platform</h2><span class="sub">fees and what came in</span></header>'+
      '<div class="body">'+
        '<div class="q-g">'+qNum('p','planPrice','Price of the plans', s.planPrice, qSym(), 1)+qNum('p','commission','Share of an accepted quote', s.commission, '%', 0.5)+'</div>'+
        '<p class="hint">The customer pays for the plans only when they want them without a contractor. A contractor pays the share when the customer takes their offer; until then neither side sees the other’s details, so the deal cannot go round the platform.</p>'+
        '<div class="tiles">'+tile('Earned', money0(earned), led.length+' entries')+tile('Plans sold', a.paid ? 1 : 0, '')+tile('Deals closed', a.dealDone ? 1 : 0, '')+'</div>'+
        (led.length ? '<div class="tw" style="margin-top:10px"><table class="dt"><thead><tr><th>When</th><th>What</th><th class="n">Amount</th></tr></thead><tbody>'+led.map(function(l){ return '<tr><td>'+esc(l.when)+'</td><td>'+esc(l.what)+'</td><td class="n">'+money0(l.amount)+'</td></tr>'; }).join('')+'</tbody></table></div>' : '')+
        '<div class="btnrow" style="margin-top:12px"><button type="button" class="btn sm ghost" data-qact="reset-access">Reset payments and deals</button></div>'+
      '</div></section>';
  }
  function ledger(what, amount){ var a = access(); a.ledger = a.ledger||[]; a.ledger.push({when:new Date().toISOString().slice(0,10), what:what, amount:amount}); }

  /* ---------------- the view and its side panel ---------------- */
  function renderQuotes(){
    var r = role(), body;
    if(Q.step===0) body = checkoutCard();
    else if(r==='platform') body = platformCard()+[qStep1, qStep2, qStep3, qStep4, qStep5][Q.step-1]();
    else if(r==='contractor') body = (Q.sent ? qStep3() : qEmpty('No request yet', 'A contractor sees a request once a customer sends one. Switch to the customer and send it.', 2, 'Go to the request'));
    else body = [qStep1, qStep2, qStep3, qStep4, qStep5][Q.step-1]();
    return '<div class="qwrap" data-quotes>'+
      '<p class="note info q-mock"><b>Prototype</b><span>Nothing is sent and nothing is charged. The contractors and their quotes are examples; the role switch shows what each side would see on the real site.</span></p>'+
      '<section class="card"><header><h2>'+(r==='contractor' ? 'Requests near you' : r==='platform' ? 'Platform' : 'Plans and quotes')+'</h2>'+roleSwitch()+'</header>'+
        (r==='customer' ? '<div class="body tight">'+qStepper()+'</div>' : '')+'</section>'+
      body+
    '</div>';
  }
  function qInspector(){
    var done = qDone();
    var Y = '<td class="c">✓</td>', N = '<td class="c no">—</td>';
    var rows = [
      ['Drawings and estimate', Y, Y, Y, Y],
      ['Postcode', Y, '<td class="c">Area</td>', '<td class="c">Area</td>', Y],
      ['Cut list and materials', access().paid || access().dealDone ? Y : '<td class="c">Paid</td>', N, Y, Y],
      ['Excel of the parts', access().paid ? Y : N, N, N, Y],
      ['Photos', Y, N, Y, Y],
      ['Name, email, phone', Y, N, N, Y],
      ['The estimate', Y, N, N, N]
    ];
    var a = access(), s = state.settings;
    return '<section class="card" data-quotes><header><h2>Plans and quotes</h2><span class="sub">'+(role()==='customer' ? 'Step '+Q.step+' of 5' : ROLE_NAMES()[role()])+'</span></header>'+
      '<div class="body">'+
        '<div class="tiles" style="margin-bottom:10px">'+
          tile('Plans', a.paid ? 'Bought' : a.dealDone ? 'Open' : 'Locked', a.paid ? money0(s.planPrice) : a.dealDone ? 'through the deal' : money0(s.planPrice)+' or a deal')+
          tile('Deal', a.dealDone ? 'Closed' : Q.chosen ? 'Pending' : Q.sent ? 'Quotes' : '—', a.dealDone ? money0(a.commission)+' to the platform' : Q.chosen ? 'contractor to confirm' : Q.sent ? 'request out' : 'no request yet')+
        '</div>'+
        '<div class="tile hero" data-qlive="mini">'+qMini()+'</div>'+
        '<ol class="q-side">'+Q_STEPS.map(function(n,i){
          var cls = Q.step===i+1 ? 'on' : done[i] ? 'done' : '';
          return '<li'+(cls?' class="'+cls+'"':'')+'><button type="button" data-qact="go" data-step="'+(i+1)+'">'+n+'</button><small>'+Q_STEP_NOTE[i]+'</small></li>';
        }).join('')+'</ol>'+
      '</div></section>'+
      '<section class="card"><header><h2>Who sees what</h2></header><div class="body tight">'+
        '<div class="tw"><table class="dt q-wsw"><thead><tr><th></th><th class="c">You</th><th class="c">Before accepting</th><th class="c">Accepted</th><th class="c">Deal closed</th></tr></thead><tbody>'+
          rows.map(function(r){ return '<tr><td>'+r[0]+'</td>'+r[1]+r[2]+r[3]+r[4]+'</tr>'; }).join('')+
        '</tbody></table></div>'+
        '<ul class="q-rules"><li>Up to 5 contractors within 25 km</li><li>48 hours to accept, then the slot passes on</li><li>The contractor pays the platform '+(s.commission||0)+'% when you take their offer; only then do you see each other’s details</li><li>The final price comes after an on-site measurement</li></ul>'+
        '<div class="btnrow" style="margin-top:12px"><button type="button" class="btn sm" data-qact="reset">Start the prototype over</button></div>'+
      '</div></section>';
  }
  function qRender(){
    if(view!=='quotes') return;
    var ae = document.activeElement, id = ae && ae.id;
    $('canvas').innerHTML = renderQuotes();
    renderInspector();
    if(id){ var n = document.getElementById(id); if(n && n!==document.activeElement){ try{ n.focus({preventScroll:true}); }catch(err){} } }
  }
  function qGo(n){
    Q.step = Math.max(1, Math.min(5, n||1));
    if(role()==='contractor' && Q.step<3) Q.step = 3;
    qRender();
    var top = $('canvas').getBoundingClientRect().top;
    var bar = document.querySelector('.topbar'), off = (bar && getComputedStyle(bar).position==='sticky') ? bar.offsetHeight + 12 : 12;
    if(top < off) window.scrollTo(0, Math.max(0, window.pageYOffset + top - off));
  }
  function qPhotos(files){
    Array.prototype.slice.call(files||[]).forEach(function(f){
      if(Q.photos.length>=8 || !/^image\//.test(f.type)) return;
      try{ Q.photos.push(URL.createObjectURL(f)); }catch(err){}
    });
  }
  function qSend(){
    var c = compute(), er = {};
    if(!c.unitCount){ toast('Add at least one cabinet to the plan first', 2600); return; }
    if(!/^\d{6}$/.test(String(Q.postcode).trim())) er.postcode = 'Enter a 6-digit postcode, for example 400001.';
    if(!String(Q.name).trim()) er.name = 'Enter your name.';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(Q.email).trim())) er.email = 'Enter an email address, for example name@example.ro.';
    if(String(Q.phone).replace(/\D/g,'').length<9) er.phone = 'Enter a phone number with at least 9 digits.';
    if(!Q.consent) er.consent = 'Tick the box so the request can go to contractors.';
    Q.errors = er;
    var keys = Object.keys(er);
    if(keys.length){
      qRender();
      var f = document.getElementById('qf-'+keys[0]);
      if(f){ try{ f.focus({preventScroll:true}); }catch(err){} f.scrollIntoView({block:'center'}); }
      toast(keys.length===1 ? 'Check the highlighted field' : 'Check the '+keys.length+' highlighted fields');
      return;
    }
    var e = qEstimate();
    Q.sent = true; Q.sentAt = new Date(); Q.sentEst = {low:e.low, mid:e.mid, high:e.high};
    Q.quotes = {}; Q_CT.forEach(function(ct){ if(ct.k) Q.quotes[ct.id] = qQuoteFor(ct, e); });
    Q.simulated = false; Q.chosen = null; Q.fChosen = 'none'; Q.followed = false; Q.applied = false; Q.lead = 'preview'; Q.aSent = false;
    qGo(3);
    toast('Request sent to 5 contractors (preview)', 2400);
  }

  /* ---------------- input ---------------- */
  // Text updates the figures that depend on it without rebuilding the form;
  // a choice rebuilds it, so the cards show what is picked.
  function qInput(e){
    var el = e.target, k, choice = el.type==='radio' || el.type==='checkbox' || el.tagName==='SELECT' || el.type==='file';
    if(choice ? e.type!=='change' : e.type!=='input') return;
    if((k = el.getAttribute('data-qf'))){
      if(k.indexOf('inc.')===0) Q.inc[k.slice(4)] = el.checked;
      else if(el.type==='checkbox') Q[k] = el.checked;
      else if(el.type==='file'){ qPhotos(el.files); el.value = ''; }
      else Q[k] = el.value;
      if(Q.errors[k]){
        delete Q.errors[k];
        var fld = el.closest('.field'); if(fld) fld.classList.remove('bad');
        var em = document.getElementById('qe-'+k); if(em) em.remove();
        el.removeAttribute('aria-invalid');
      }
      if(choice) qRender(); else qLive();
      return;
    }
    if((k = el.getAttribute('data-qr'))){
      var v = parseFloat(el.value);
      if(!isNaN(v) && v>=0){ Q.rates[k] = (k==='low' ? Math.min(v, 90) : v); qLive(); }
      return;
    }
    if((k = el.getAttribute('data-qp'))){
      var pv = parseFloat(el.value);
      if(!isNaN(pv) && pv>=0){ state.settings[k] = pv; save(); }
      return;
    }
    if((k = el.getAttribute('data-qa'))){
      if(!Q.quotes) return;
      Q.quotes.A[k] = k==='visit' ? el.value : Math.max(0, parseFloat(el.value)||0);
      qLive(); return;
    }
    if((k = el.getAttribute('data-qu'))){
      Q[k] = el.value;
      if(k==='fChosen'){ if(el.value!=='none' && Q.quotes[el.value]) Q.finalPrice = String(Math.round(qTotal(Q.quotes[el.value])*1.04/10)*10); Q.followed = false; Q.applied = false; qRender(); }
      else if(k==='finalPrice'){ if(Q.followed){ Q.followed = false; Q.applied = false; qRender(); } }
      return;
    }
  }
  document.addEventListener('submit', function(e){
    if(e.target && e.target.id==='q-form'){ e.preventDefault(); qSend(); }
  });
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('[data-qact]');
    if(!b) return;
    var a = b.getAttribute('data-qact');
    if(a==='go'){ if(view!=='quotes'){ view = 'quotes'; render(true); } qGo(+b.getAttribute('data-step')); return; }
    if(a==='plan'){ view = 'plan'; scheduleRender(); window.scrollTo(0,0); return; }
    if(a==='role'){ access().role = b.getAttribute('data-r'); save(); if(view==='quotes') qRender(); else render(true); return; }
    if(a==='checkout'){ if(view!=='quotes'){ view = 'quotes'; render(true); } Q.step = 0; qRender(); window.scrollTo(0,0); return; }
    if(a==='pay'){
      var acc = access(); acc.paid = true; acc.path = 'plans'; acc.paidAt = new Date().toISOString();
      ledger('Plans bought by the customer', state.settings.planPrice||0); save();
      view = 'cut'; render(true); window.scrollTo(0,0); toast('Paid (simulated). The cut list, the drawings and the Excel are yours.', 3200); return;
    }
    if(a==='deal'){
      var acd = access(), fee = Math.round(qTotal(Q.quotes.A)*(state.settings.commission||0)/100);
      acd.dealDone = true; acd.dealAt = new Date().toISOString(); acd.commission = fee; acd.path = 'quotes';
      ledger('Platform share from Contractor A', fee); save();
      qRender(); toast('Job confirmed. Both sides now see each other’s details and the full plans.', 3200); return;
    }
    if(a==='reset-access'){ var keepRole = access().role; state.access = null; access().role = keepRole; save(); qRender(); toast('Payments and deals reset'); return; }
    if(a==='simulate'){ Q.simulated = true; qRender(); toast('48 hours later: 3 accepted, 1 declined, 1 passed on', 2600); return; }
    if(a==='lead'){ Q.lead = b.getAttribute('data-v')==='full' ? 'full' : 'preview'; qRender(); return; }
    if(a==='decline'){ toast('Declined. The slot passes to the next contractor nearby', 2600); return; }
    if(a==='sendA'){ Q.aSent = true; qRender(); toast(Q.simulated ? 'Quote sent. It shows in Compare' : 'Quote sent. It shows in Compare once the others reply', 2600); return; }
    if(a==='choose'){
      var id = b.getAttribute('data-id');
      Q.chosen = id; Q.fChosen = id; Q.finalPrice = String(Math.round(qTotal(Q.quotes[id])*1.04/10)*10);
      Q.followed = false; Q.applied = false; qRender(); toast('Contractor '+id+' chosen'); return;
    }
    if(a==='follow'){
      if(Q.fChosen!=='none' && !(+Q.finalPrice>0)){ toast('Enter the final agreed price'); var fp = document.getElementById('qu-finalPrice'); if(fp) fp.focus(); return; }
      Q.followed = true; Q.applied = false; qRender(); return;

  function tr(s){

        var m = t.match(RO_RX[i][0]);
        if(m) hit = typeof RO_RX[i][1]==='function' ? RO_RX[i][1](m) : t.replace(RO_RX[i][0], RO_RX[i][1]);
