    }).filter(function(r){ return r.qty>0; });
    // lines of your own: counted once for the project, or once per cabinet
    (s.customHw||[]).forEach(function(c){
      var n = (c.qty||0) * (c.per==='cabinet' ? unitCount : 1);
      if(n<=0) return;
      hwRows.push({k:c.id, label:c.name||'Custom item', unit:c.per==='cabinet'?'per cabinet':'per project',
        qty:n, price:c.price||0, cost:n*(c.price||0), custom:true});
    });
    var hwCost = hwRows.reduce(function(a,r){ return a+r.cost; }, 0);

    // Banding: bought by the metre to put on yourself, or done by the cutting
    // service on every edge the parts list marks, at its own price
    var edgeM, edgeCost, edgeShown, edgeRate;
    if(mode==='service'){ edgeM = edgeRunMM/1000; edgeRate = s.serviceEdgePrice||0; edgeShown = edgeM>0; }
    else { edgeM = edgeMM/1000; edgeRate = s.edgePrice; edgeShown = !!s.edgeOn; }
    edgeCost = edgeM*edgeRate;
    var orderFee = mode==='service' ? (s.serviceOrderFee||0) : 0;
    var worktopArea = s.worktopOn ? worktopAreaMM : 0;
    var worktopCost = worktopArea*s.worktopPrice;
    var hours = minutes/60;
    var labourCost = s.labourOn ? hours*s.labourRate : 0;
    var total = sheetCost+hwCost+edgeCost+orderFee+worktopCost+labourCost;
    // prices this mode still lacks (a board with no stock row at all is missing from every mode alike)
    var anyUnpriced = plan.some(function(g){ return g.noPrice; }) || (mode==='service' && edgeM>0 && !(edgeRate>0));

    cache = {lines:lines, plan:plan, hwRows:hwRows, hwTotals:hwTotals, runInfo:runInfo,
      precutArea:precutArea, precutCost:precutCost, mode:mode, orderFee:orderFee, edgeShown:edgeShown, edgeRate:edgeRate, anyUnpriced:anyUnpriced,
      sheetCost:sheetCost, sheetsToBuy:sheetsToBuy, hwCost:hwCost, edgeM:edgeM, edgeCost:edgeCost,
      worktopLen:worktopLen, worktopArea:worktopArea, worktopCost:worktopCost, worktopVaries:worktopVaries,
      minutes:minutes, hours:hours, labourCost:labourCost, total:total,
      pieces:pieces, area:area, unitCount:unitCount};
    return cache;
  }
  function invalidate(){ cache = null; }
  // the project's total in each of the three ways of buying, for comparing them
  function totalsByMode(){
    var keep = state.settings.buyMode, out = {};
    BUY_MODES.forEach(function(m){ state.settings.buyMode = m.id; cache = null; var c = compute(); out[m.id] = {total:c.total, unpriced:c.anyUnpriced}; });
    state.settings.buyMode = keep; cache = null; compute();
    return out;
  }

  // Rough per-unit cost, used in the unit rows and the cost breakdown: its own
  // board area at the board's rate in the current mode, its hardware, its
  // edging, its labour. Sheet counts for the whole project are optimised
  // together in the cutting plan, so these per-unit figures add up to a little
  // more than the project total.
  function unitCost(cab){
    var s = state.settings;
    var sum = unitSummary(cab);
    var mp = rateFor(s.thickness), bp = rateFor(s.back) || mp;
    var mat = sum.mainArea*mp + sum.backArea*bp;
    var hw = hardwareFor(cab), hwc = 0;
    HW.forEach(function(i){ hwc += hw[i.k]*(s.hw[i.k]||0); });
    (s.customHw||[]).forEach(function(c){ if(c.per==='cabinet') hwc += (c.qty||0)*(c.price||0); });
    var edge = buyMode()==='service' ? (sum.edgeRunMM/1000)*(s.serviceEdgePrice||0) : (sum.edgeMM/1000)*s.edgePrice;
    var lab = s.labourOn ? (labourMinutes(cab)/60)*s.labourRate : 0;
    return {material:mat, hardware:hwc, edge:edge, labour:lab, total:mat+hwc+edge+lab};
  }

  /* ================= formatting ================= */
  // Romanian puts the currency after the figure: 1.234,50 lei, 1.234 €
  function numLocale(){ return state.settings.lang==='ro' ? 'ro-RO' : undefined; }
  function withSym(n){
    var cur = state.settings.currency, sym = CUR[cur]||cur;
    return (state.settings.lang==='ro' || cur==='RON') ? n+' '+sym : sym+' '+n;
  }
  function money(v){
    return withSym((v||0).toLocaleString(numLocale(),{minimumFractionDigits:2, maximumFractionDigits:2}));
  }
  function money0(v){
    return withSym(Math.round(v||0).toLocaleString(numLocale()));
  }
  function mm(v){ return Math.round(v)+' mm'; }
  // With banding on, the cut size is what you set the saw to and the finished
  // size is what it becomes once banded — the list shows both.
  // "3 sheets of 18 mm to buy", plus what came out of stock
  function sheetPhrase(g){
    var bits = [];
    if(g.toBuy>0){
      var sizes = g.buySizes.map(function(b){ return b.qty+' \u00d7 '+b.sheetW+'\u00d7'+b.sheetH; }).join(', ');
      bits.push(g.toBuy+' sheet'+(g.toBuy===1?'':'s')+' of '+g.thickness+' mm '+(buyMode()==='service' ? 'cut and banded by the service' : 'to buy')+' ('+sizes+')');
    }
    if(g.precutCount>0){
      bits.push(g.precutArea.toFixed(2)+' m\u00b2 pre-cut to size'+(g.precutRate?' at '+money(g.precutRate)+'/m\u00b2':''));
    }
    if(g.onHandUsed>0){
      var os = g.onHandSizes.map(function(b){ return b.qty+' \u00d7 '+b.sheetW+'\u00d7'+b.sheetH; }).join(', ');
      bits.push(g.onHandUsed+' from stock ('+os+')');
    }
    if(!bits.length) bits.push('nothing needed');
    return bits.join('; ');
  }
  function sheetTileLabel(sh, i, total){
    return 'Sheet '+(i+1)+' of '+total+', '+sh.sheetW+' \u00d7 '+sh.sheetH+
      (sh.onHand ? ', from stock' : (sh.precut ? ', pre-cut' : ''));
  }

  function partNote(p){
    var bits = [];
    if(state.settings.edgeOn && (p.w!==p.finW || p.h!==p.finH) && !/^Finished/.test(p.name)){
      bits.push('cut under, finishes '+p.finW+' × '+p.finH);
    }
    if(p.note) bits.push(p.note);
    return bits.join('; ');
  }
  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(t){ return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

  var SELECTED = null;   // set by the interface before a redraw

  /* ================= the tape measure ================= */
  // Colours are the tape's own, fixed in both themes: a yellow blade with
  // black figures is what a tape looks like, whatever the room.
  function tapeSVG(L, y, reading){
    var H = 124, o = [], F = 'IBM Plex Sans Condensed, Arial Narrow, sans-serif';
    var labelEvery = L>6000 ? 1000 : 500;
    o.push('<rect x="0" y="'+y+'" width="'+L+'" height="'+H+'" fill="#F5C518" stroke="#8C6D00" stroke-width="3"/>');
    for(var m=100; m<L; m+=100){
      var big = m%labelEvery===0, mid = !big && m%500===0;
      o.push('<line x1="'+m+'" y1="'+y+'" x2="'+m+'" y2="'+(y+(big?52:mid?40:26))+'" stroke="#17150D" stroke-width="'+(big?6:4)+'"/>');
      if(big && L-m>260) o.push('<text x="'+m+'" y="'+(y+104)+'" text-anchor="middle" font-family="'+F+'" font-size="50" font-weight="600" fill="#17150D">'+m+'</text>');
    }
    // the hook on the wall, and the case at the far end with the reading
    o.push('<rect x="-22" y="'+(y-10)+'" width="26" height="'+(H+20)+'" rx="4" fill="#4A4F52"/>');
    o.push('<rect x="'+(L+14)+'" y="'+(y-26)+'" width="296" height="'+(H+52)+'" rx="44" fill="#2A2F31" stroke="#5E666A" stroke-width="5"/>');
    o.push('<text x="'+(L+162)+'" y="'+(y+H/2+26)+'" text-anchor="middle" font-family="'+F+'" font-size="76" font-weight="700" fill="#F5C518">'+reading+'</text>');
    return '<g class="tape">'+o.join('')+'</g>';
  }

  // lettering sits on a front or on the carcass, whichever the unit shows
  function labelInk(u){
    if(u.type==='gap') return 'var(--ink-soft)';
    var showsFronts = hasFronts(u) && buildOf(u)!=='carcass';
    return showsFronts ? decorInk(frontDecorOf(u)) : 'var(--carcass-ink)';
  }
  function panelFill(p){ return panelDecorOf(p.u).fill; }

  /* ================= elevation drawing ================= */
  // Drawn in real millimetres: the viewBox is the wall itself, plus a margin on
  // the right for vertical dimensions and a strip under the floor for the run
  // dimension. Every run is rendered at the same scale so they compare directly.
  function elevationSVG(run, maxLen){
    var S = state.standards, g = runGeometry(run);
    var L = Math.max(run.wallLength, 300);
    var ceil = Math.max(S.ceiling, S.plinth+S.tallH+150, g.wallBottom+S.wallH+150, g.topY+50);
    var MAR = 320, DIM = 340;
    var VBW = L+MAR, VBH = ceil+DIM;
    var id = run.id;
    function Y(h){ return ceil-h; }
    var o = [];

    o.push('<defs>'+
      '<pattern id="fill-'+id+'" width="30" height="30" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
        '<line x1="0" y1="0" x2="0" y2="30" stroke="var(--wood)" stroke-width="8" opacity="0.55"/></pattern>'+
      '<pattern id="app-'+id+'" width="44" height="44" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
        '<line x1="0" y1="0" x2="0" y2="44" stroke="var(--stone)" stroke-width="7" opacity="0.5"/></pattern>'+grainPatterns(id)+
    '</defs>');

    // wall face and floor
    o.push('<rect x="0" y="0" width="'+L+'" height="'+ceil+'" fill="var(--surface)" stroke="var(--line)" stroke-width="5"/>');
    o.push('<line x1="-40" y1="'+ceil+'" x2="'+(L+60)+'" y2="'+ceil+'" stroke="var(--ink)" stroke-width="12"/>');
    // the windows and doors in this wall, behind whatever stands in front of them
    runOpenings(run).forEach(function(op){
      var a = Math.max(op.x0, 0), b = Math.min(op.x1, L); if(b-a < 10) return;
      var y1 = Math.min(op.y1, ceil);
      o.push('<rect x="'+a+'" y="'+Y(y1)+'" width="'+(b-a)+'" height="'+(y1-op.y0)+'" fill="'+(op.kind==='window' ? 'var(--surface-2)' : 'var(--panel-3)')+'" stroke="var(--ink-soft)" stroke-width="5"/>');
      if(op.kind==='window'){
        o.push('<rect x="'+(a+40)+'" y="'+(Y(y1)+40)+'" width="'+(b-a-80)+'" height="'+(y1-op.y0-80)+'" fill="var(--paper)" stroke="var(--line)" stroke-width="4"/>');
        o.push('<line x1="'+((a+b)/2)+'" y1="'+(Y(y1)+40)+'" x2="'+((a+b)/2)+'" y2="'+(Y(op.y0)-40)+'" stroke="var(--line)" stroke-width="4"/>');
      } else {
        o.push('<rect x="'+(a+40)+'" y="'+(Y(y1)+40)+'" width="'+(b-a-80)+'" height="'+(y1-op.y0-40)+'" fill="var(--paper)" stroke="var(--line)" stroke-width="4"/>');
        o.push('<circle cx="'+(b-90)+'" cy="'+Y(1000)+'" r="12" fill="var(--ink)"/>');
      }
    });

    // a unit can be mid-edit and momentarily too small to draw anything inside
    function box(x,y,w,h,fill,stroke,sw,dash){
      if(!(w>0) || !(h>0)) return;
      o.push('<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+(stroke||'var(--ink)')+'" stroke-width="'+(sw||7)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>');
    }
    // a box that already exists (fronts only) is drawn in dashes
    function boxDash(u){ return buildOf(u)==='fronts' ? '36,24' : null; }
    // Only the type code goes on the unit itself — widths are dimensioned
    // under the run, the way an elevation drawing carries them, so no label
    // ever lands on a handle or a hinge.
    function label(x,w,yTop,hBox,code,u){
      if(w<260 || hBox<200) return;
      o.push('<text x="'+(x+w/2)+'" y="'+(yTop+hBox/2+22)+'" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="64" fill="'+(u?labelInk(u):'var(--ink-soft)')+'">'+esc(code)+'</text>');
    }

    // ---- floor row: carcasses and appliances
    // Worktop and kickboard are collected as spans and drawn as continuous
    // bands afterwards: the kickboard is one length cut to fit (which is how
    // the cut list generates it), and it stops at an appliance, which stands
    // on the floor with its own front.
    var worktopSpans = [], kickSpans = [];
    g.rows.floor.forEach(function(p){
      var u = p.u, x = p.x, w = u.W, mark = o.length;
      var isTall = isTallUnit(u);
      if(u.type==='gap'){
        var topH = applianceHeight(u);
        drawApplianceFace(o, u, x, Y(topH), w, topH, id);
        if(applianceKind(u)==='other') label(x, w, Y(topH), topH, TYPES.gap.code);
        if(applianceFront(u)) kickSpans.push([x, x+w]);
      } else {
        var cy = Y(S.plinth+u.H);
        box(x, cy, w, u.H, 'var(--carcass)', 'var(--ink)', 7, boxDash(u));
        drawUnitFace(o, u, x, cy, w, u.H, id);
        label(x, w, cy, u.H, TYPES[u.type].code, u);
        kickSpans.push([x, x+w]);
      }
      var hTop = u.type==='gap' ? applianceHeight(u) : S.plinth+u.H;
      o.splice(mark, 0, '<g class="eu'+(u.id===SELECTED?' sel':'')+'" data-unit="'+u.id+'">');
      o.push('<rect class="euhit" x="'+x+'" y="'+Y(hTop)+'" width="'+w+'" height="'+hTop+'" fill="transparent"/></g>');
      if(!isTall) worktopSpans.push([x, x+w]);
    });

    // fillers: front-face strips scribed to the wall, as tall as what they stand beside
    g.fillerGeo.forEach(function(fg){
      box(fg.x, Y(fg.y+fg.H), fg.w, fg.H, 'url(#fill-'+id+')', 'var(--wood)', 6);
      if(fg.row!=='floor') return;
      kickSpans.push([fg.x, fg.x+fg.w]);
      if(!fg.tall) worktopSpans.push([fg.x, fg.x+fg.w]);
    });

    // finished panels, seen edge-on
    g.panels.forEach(function(p){
      box(p.x, Y(p.y+p.H), p.w, p.H, panelFill(p), 'var(--ink)', 5);
      if(p.row==='floor' && !isTallUnit(p.u)) worktopSpans.push([p.x, p.x+p.w]);
    });
    function mergeSpans(list){
      list.sort(function(a,b){ return a[0]-b[0]; });
      var out = [];
      list.forEach(function(sp){
        var last = out[out.length-1];
        if(last && sp[0]<=last[1]+1) last[1] = Math.max(last[1], sp[1]);
        else out.push([sp[0], sp[1]]);
      });
      return out;
    }

    // kickboard: one continuous band per stretch of cabinets
    mergeSpans(kickSpans).forEach(function(sp){
      box(sp[0], Y(S.plinth), sp[1]-sp[0], S.plinth, 'var(--surface-2)', 'var(--line)', 5);
    });
    // worktop over the contiguous base spans, when the project has one
    if(state.settings.worktopOn) mergeSpans(worktopSpans).forEach(function(sp){
      box(sp[0], Y(g.counterH), sp[1]-sp[0], S.worktopT, 'var(--stone-soft)', 'var(--stone)', 6);
    });

    // ---- wall row
    g.rows.wall.forEach(function(p){
      var u = p.u, x = p.x, yTop = Y(wallUnitBottom(u)+u.H), mark = o.length, fb = finBottomT(u);
      box(x, yTop, u.W, u.H, 'var(--carcass)', 'var(--ink)', 7, boxDash(u));
      drawUnitFace(o, u, x, yTop, u.W, u.H, id);
      label(x, u.W, yTop, u.H, TYPES[u.type].code, u);
      o.splice(mark, 0, '<g class="eu'+(u.id===SELECTED?' sel':'')+'" data-unit="'+u.id+'">');
      o.push('<rect class="euhit" x="'+x+'" y="'+yTop+'" width="'+u.W+'" height="'+(u.H+fb)+'" fill="transparent"/></g>');
    });
    // ---- upper row, standing on the wall units' line
    g.rows.upper.forEach(function(p){
      var u = p.u, x = p.x, yTop = Y(g.upperBottom+u.H), mark = o.length, fb = finBottomT(u);
      box(x, yTop, u.W, u.H, 'var(--carcass)', 'var(--ink)', 7, boxDash(u));
      drawUnitFace(o, u, x, yTop, u.W, u.H, id);
      label(x, u.W, yTop, u.H, TYPES[u.type].code, u);
      o.splice(mark, 0, '<g class="eu'+(u.id===SELECTED?' sel':'')+'" data-unit="'+u.id+'">');
      o.push('<rect class="euhit" x="'+x+'" y="'+yTop+'" width="'+u.W+'" height="'+(u.H+fb)+'" fill="transparent"/></g>');
    });

    // finished bottom panels, one board per stretch
    g.bottomGroups.forEach(function(gr){ box(gr.x, Y(gr.y), gr.w, state.settings.thickness, panelDecorOf(gr.units[0]).fill, 'var(--ink)', 5); });

    // ---- cabinets standing on other cabinets
    g.rows.stack.forEach(function(p){
      var u = p.u, x = p.x, yTop = Y(p.y+u.H), mark = o.length;
      box(x, yTop, u.W, u.H, 'var(--carcass)', 'var(--ink)', 7, boxDash(u));
      drawUnitFace(o, u, x, yTop, u.W, u.H, id);
      label(x, u.W, yTop, u.H, TYPES[u.type].code, u);
      o.splice(mark, 0, '<g class="eu'+(u.id===SELECTED?' sel':'')+'" data-unit="'+u.id+'">');
      o.push('<rect class="euhit" x="'+x+'" y="'+yTop+'" width="'+u.W+'" height="'+u.H+'" fill="transparent"/></g>');
    });

    // ---- dimensions: each unit's width on its own chain, then the wall overall
    var uy = ceil+96;
    var chain = g.rows.floor.slice();
    g.panels.filter(function(p){ return p.row==='floor'; }).forEach(function(p){ chain.push({u:{W:p.w, filler:true}, x:p.x}); });
    g.fillerGeo.filter(function(fg){ return fg.row==='floor'; }).forEach(function(fg){ chain.push({u:{W:fg.w, filler:true}, x:fg.x}); });
    chain.sort(function(a,b){ return a.x-b.x; });
    chain.forEach(function(p, i){
      var x0 = p.x, x1 = p.x+p.u.W;
      o.push('<line x1="'+x0+'" y1="'+(uy-34)+'" x2="'+x0+'" y2="'+(uy+34)+'" stroke="var(--ink-soft)" stroke-width="5"/>');
      if(i===chain.length-1) o.push('<line x1="'+x1+'" y1="'+(uy-34)+'" x2="'+x1+'" y2="'+(uy+34)+'" stroke="var(--ink-soft)" stroke-width="5"/>');
      o.push('<line x1="'+x0+'" y1="'+uy+'" x2="'+x1+'" y2="'+uy+'" stroke="var(--ink-soft)" stroke-width="4"/>');
      if(p.u.W>=260){
        o.push('<rect x="'+(x0+p.u.W/2-110)+'" y="'+(uy-34)+'" width="220" height="68" fill="var(--surface-2)"/>');
        o.push('<text x="'+(x0+p.u.W/2)+'" y="'+(uy+21)+'" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="56" fill="var(--ink-soft)">'+Math.round(p.u.W)+'</text>');
      }
    });

    // The wall overall, read off a tape measure: hooked on the left wall,
    // pulled to the right one, the case showing the reading. Drawn at the
    // elevation's own scale, so the numbers on the blade line up with the
    // cabinets above them.
    o.push(tapeSVG(L, ceil+176, run.wallLength));

    function vdim(h, txt){
      o.push('<line x1="'+(L+30)+'" y1="'+Y(h)+'" x2="'+(L+130)+'" y2="'+Y(h)+'" stroke="var(--ink-soft)" stroke-width="5"/>');
      o.push('<text x="'+(L+150)+'" y="'+(Y(h)+22)+'" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="58" fill="var(--ink-soft)">'+txt+'</text>');
    }
    // only dimension heights this run actually has: no worktop on a run of
    // tall units, no wall-unit line when nothing hangs on the wall
    var topDim = 0;
    if(g.worktopLen>0){ vdim(g.counterH, g.counterH+''); topDim = g.counterH; }
    if(g.rows.wall.length){ vdim(g.wallBottom, g.wallBottom+''); topDim = g.wallBottom; }
    if(g.rows.wall.length && g.wallLine.aligned) vdim(g.wallLine.top, g.wallLine.top+'');
    else if(g.rows.upper.length) vdim(g.upperBottom, g.upperBottom+'');
    if(g.rows.upper.length){ var upTop = g.upperBottom + g.rows.upper.reduce(function(a,p){ return Math.max(a, p.u.H); }, 0); vdim(upTop, upTop+''); }
    if(topDim>0){
      o.push('<line x1="'+(L+80)+'" y1="'+Y(0)+'" x2="'+(L+80)+'" y2="'+Y(topDim)+'" stroke="var(--ink-soft)" stroke-width="4" stroke-dasharray="26,18"/>');
    }

    var wpct = Math.max(((L+MAR)/(maxLen+MAR))*100, 34);
    return '<svg class="elev elev-front" viewBox="0 0 '+VBW+' '+VBH+'" style="width:'+wpct.toFixed(1)+'%" role="img" aria-label="Elevation of '+escAttr(run.name)+'">'+o.join('')+'</svg>';

  }

  /* ================= plan (top) view ================= */
  // The run seen from above, at the elevation's scale and aligned under it:
  // the wall along the top, each box as deep as it is, the worktop standing
  // proud of the base units, wall units in dashes since they hang above, and
  // every door swung open to show what it needs clear in front of it.
  function topViewSVG(run, maxLen){
    var S = state.standards, s = state.settings, g = runGeometry(run);
    var L = Math.max(run.wallLength, 300);
    var MAR = 320, WALL = 110, y0 = WALL;
    var wtDeep = g.worktopSpans.reduce(function(a,w){ return Math.max(a, w.D); }, 0);
    var deep = Math.max(S.worktopD, S.baseD, wtDeep, g.rows.floor.reduce(function(a,p){ return Math.max(a, p.u.D||0); }, 0));
    var swing = g.rows.floor.reduce(function(a,p){
      var u = p.u;
      if(u.type==='housing'){
        if(!housingSections(u).some(function(q){ return q.kind==='door' || q.kind==='top'; })) return a;
        return Math.max(a, (u.D||0) + (Math.max(housingDoors(u),1)===1 ? u.W : u.W/2));
      }
      if(u.type!=='door' && u.type!=='sink' && !(u.type==='corner' && (u.opts.cornerStyle||'blind')!=='lazysusan')) return a;
      var dc = u.type==='corner' ? 1 : (u.opts.doorCount||2);
      var dw = u.type==='corner' ? Math.min(Math.max(u.opts.doorWidth||450,200), Math.max(u.W-150,200)) : (dc===1 ? u.W : u.W/2);
      return Math.max(a, (u.D||0)+dw);
    }, 0);
    var VBW = L+MAR, VBH = y0 + Math.max(deep, swing) + 90;
    var id = 'top'+run.id, F = 'IBM Plex Sans Condensed, Arial Narrow, sans-serif';
    var o = [];
    o.push('<defs>'+
      '<pattern id="fill-'+id+'" width="30" height="30" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
        '<line x1="0" y1="0" x2="0" y2="30" stroke="var(--wood)" stroke-width="8" opacity="0.55"/></pattern>'+
      '<pattern id="app-'+id+'" width="44" height="44" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
        '<line x1="0" y1="0" x2="0" y2="44" stroke="var(--stone)" stroke-width="7" opacity="0.5"/></pattern>'+
      '<pattern id="wall-'+id+'" width="40" height="40" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
        '<line x1="0" y1="0" x2="0" y2="40" stroke="var(--ink)" stroke-width="5" opacity="0.35"/></pattern>'+
    '</defs>');
    // the wall itself, and the side walls where a filler meets them
    o.push('<rect x="-60" y="0" width="'+(L+120)+'" height="'+WALL+'" fill="url(#wall-'+id+')" stroke="var(--ink)" stroke-width="7"/>');
    o = o.concat(topViewBody(run, g, y0, id, true));
    // depths, dimensioned off the right-hand end
    // the figure reads along its own line, so a deep worktop and a shallow
    // wall unit both fit in the margin
    function vdim(x, d, txt){
      o.push('<line x1="'+x+'" y1="'+y0+'" x2="'+x+'" y2="'+(y0+d)+'" stroke="var(--ink-soft)" stroke-width="4"/>');
      o.push('<line x1="'+(x-30)+'" y1="'+y0+'" x2="'+(x+30)+'" y2="'+y0+'" stroke="var(--ink-soft)" stroke-width="4"/>');
      o.push('<line x1="'+(x-30)+'" y1="'+(y0+d)+'" x2="'+(x+30)+'" y2="'+(y0+d)+'" stroke="var(--ink-soft)" stroke-width="4"/>');
      var tx = x+58, ty = y0+d/2;
      o.push('<text x="'+tx+'" y="'+ty+'" text-anchor="middle" transform="rotate(-90 '+tx+' '+ty+')" font-family="'+F+'" font-size="50" fill="var(--ink-soft)">'+txt+'</text>');
    }
    if(wtDeep>0){ vdim(L+70, wtDeep, Math.round(wtDeep)+' worktop'); }
    if(g.rows.wall.length || g.rows.upper.length){ vdim(L+210, S.wallD, S.wallD+' wall'); }
    var wpct = Math.max(((L+MAR)/(maxLen+MAR))*100, 34);
    return '<svg class="elev elev-top" viewBox="0 0 '+VBW+' '+VBH+'" style="width:'+wpct.toFixed(1)+'%" role="img" aria-label="Plan of '+escAttr(run.name)+' from above">'+o.join('')+'</svg>';
  }
  // What a run looks like from above, drawn from (0, y0) at its left end on
  // the wall face: the run's own plan and the room plan both draw it.
  function topViewBody(run, g, y0, id, labels){
    var S = state.standards, s = state.settings, F = 'IBM Plex Sans Condensed, Arial Narrow, sans-serif', o = [];
    function rect(x,y,w,h,fill,stroke,sw,dash){
      if(!(w>0) || !(h>0)) return;
      o.push('<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>');
    }
    function label(x,w,yTop,hBox,code){
      if(!labels || w<260 || hBox<200) return;
      o.push('<text x="'+(x+w/2)+'" y="'+(yTop+hBox/2+22)+'" text-anchor="middle" font-family="'+F+'" font-size="64" fill="var(--carcass-ink)">'+esc(code)+'</text>');
    }
    // a door open at ninety degrees: its edge out into the room and the arc it sweeps
    function swingArc(hx, yF, dw, dir){
      if(!(dw>60)) return;
      o.push('<path d="M'+hx+','+yF+' L'+hx+','+(yF+dw)+' A'+dw+' '+dw+' 0 0 '+(dir>0?0:1)+' '+(hx+dir*dw)+','+yF+'" fill="none" stroke="var(--ink-soft)" stroke-width="4" stroke-dasharray="18,14"/>');
    }
    // worktop first: it lies over the base units, so their outlines sit on
    // it; each piece as deep as the cabinets under it ask for
    g.worktopSpans.forEach(function(x){ rect(x.x0, y0, x.x1-x.x0, x.D, 'var(--stone-soft)', 'var(--stone)', 5); });
    // fillers, as deep as what they stand beside; wall-row ones in dashes
    g.fillerGeo.forEach(function(fg){
      if(fg.row==='floor') rect(fg.x, y0, fg.w, fg.D, 'url(#fill-'+id+')', 'var(--wood)', 6);

    });

    g.panels.forEach(function(p){

      else rect(p.x, y0, p.w, p.D, 'none', 'var(--ink)', 5, '30,20');
    });

    g.rows.floor.forEach(function(p){
      var u = p.u, x = p.x, w = u.W, d = Math.max(u.D||0, 100), mark = o.length;

            // a drawer pulled out: its box standing in front of the cabinet
            var ext = Math.max(d-K.slideDepthClearance, 150)*0.75;
            rect(x+s.thickness+K.slideClearanceEach, yF, w-2*s.thickness-2*K.slideClearanceEach, ext, 'none', 'var(--ink-soft)', 4, '18,14');
          } else if(u.type==='housing'){
            var secsT = housingSections(u);
            if(housingDrawers(u)>0){

  /* ================= the room plan ================= */
  function roomPlanSVG(){
    var R = state.room, S = state.standards, W = Math.max(+R.W||0, 500), Dp = Math.max(+R.D||0, 500), WALL = 110, M = 460;
    var id = 'room', F = 'IBM Plex Sans Condensed, Arial Narrow, sans-serif';
    var o = ['<defs>'+
      '<pattern id="fill-'+id+'" width="30" height="30" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
        '<line x1="0" y1="0" x2="0" y2="30" stroke="var(--wood)" stroke-width="8" opacity="0.55"/></pattern>'+
      '<pattern id="app-'+id+'" width="44" height="44" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
        '<line x1="0" y1="0" x2="0" y2="44" stroke="var(--stone)" stroke-width="7" opacity="0.5"/></pattern>'+
      '<pattern id="wall-'+id+'" width="40" height="40" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
        '<line x1="0" y1="0" x2="0" y2="40" stroke="var(--ink)" stroke-width="5" opacity="0.35"/></pattern></defs>'];
    // the walls as a band round the floor
    o.push('<rect x="'+(-WALL)+'" y="'+(-WALL)+'" width="'+(W+2*WALL)+'" height="'+(Dp+2*WALL)+'" fill="url(#wall-'+id+')" stroke="var(--ink)" stroke-width="7"/>');
    o.push('<rect x="0" y="0" width="'+W+'" height="'+Dp+'" fill="var(--surface)" stroke="var(--ink)" stroke-width="7"/>');
    // windows and doors: a break in the wall band, a door with its swing into the room
    (R.openings||[]).forEach(function(op){
      var sp = openingSpan(op), a = sp[0], w = sp[1]-sp[0], m, fr;
      // the band's rectangle in a frame along that wall: x along it from its left corner (facing it), y out of the room
      // the same frame the runs use: x along the wall from its left corner (facing it), y into the room
      if(op.wall==='back')  m = 'translate(0,0)';
      else if(op.wall==='right') m = 'matrix(0,1,-1,0,'+W+',0)';
      else if(op.wall==='left') m = 'matrix(0,-1,1,0,0,'+Dp+')';
      else m = 'matrix(-1,0,0,-1,'+W+','+Dp+')';
      fr = '<g transform="'+m+'">';

        fr += '<rect x="'+a+'" y="'+(-WALL)+'" width="'+w+'" height="'+WALL+'" fill="var(--surface)" stroke="none"/>'+
          '<line x1="'+a+'" y1="'+(-WALL)+'" x2="'+a+'" y2="0" stroke="var(--ink)" stroke-width="7"/><line x1="'+(a+w)+'" y1="'+(-WALL)+'" x2="'+(a+w)+'" y2="0" stroke="var(--ink)" stroke-width="7"/>'+
          '<line x1="'+a+'" y1="0" x2="'+a+'" y2="'+w+'" stroke="var(--ink)" stroke-width="6"/>'+
          '<path d="M'+a+','+w+' A'+w+' '+w+' 0 0 0 '+(a+w)+',0" fill="none" stroke="var(--ink-soft)" stroke-width="4" stroke-dasharray="18,14"/>';
      } else {
        fr += '<rect x="'+a+'" y="'+(-WALL)+'" width="'+w+'" height="'+WALL+'" fill="var(--surface)" stroke="none"/>'+
          '<line x1="'+a+'" y1="'+(-WALL*0.35)+'" x2="'+(a+w)+'" y2="'+(-WALL*0.35)+'" stroke="var(--ink)" stroke-width="5"/>'+
          '<line x1="'+a+'" y1="'+(-WALL*0.65)+'" x2="'+(a+w)+'" y2="'+(-WALL*0.65)+'" stroke="var(--ink)" stroke-width="5"/>'+
          '<line x1="'+a+'" y1="'+(-WALL)+'" x2="'+a+'" y2="0" stroke="var(--ink)" stroke-width="7"/><line x1="'+(a+w)+'" y1="'+(-WALL)+'" x2="'+(a+w)+'" y2="0" stroke="var(--ink)" stroke-width="7"/>';
      }
      o.push(fr+'</g>');
    });
    var labelsOut = [];
    state.runs.forEach(function(run){
      var g = runGeometry(run), Fr = runFrame(run), sel = run.id===selRun && !selUnit;
      o.push('<g class="rrun'+(sel?' sel':'')+'" data-rrun="'+run.id+'" transform="'+Fr.m+'">');
      // the stretch of wall the run has to itself
      o.push('<rect x="0" y="-8" width="'+run.wallLength+'" height="8" fill="var(--tape)"/>');
      o = o.concat(topViewBody(run, g, 0, id, false));
      o.push('</g>');
      // type codes and the run's name are set upright afterwards, whichever way the run faces
      g.rows.floor.forEach(function(p){
        var u = p.u; if(u.W<260) return;
        var c = Fr.fwd(p.x+u.W/2, 0, Math.max(u.D||0,100)/2);
        labelsOut.push('<text x="'+c[0]+'" y="'+(c[2]+21)+'" text-anchor="middle" font-family="'+F+'" font-size="58" fill="var(--carcass-ink)" pointer-events="none">'+esc(TYPES[u.type].code)+'</text>');
      });
      var deep = Math.max(S.worktopD, S.baseD, g.rows.floor.reduce(function(a,p){ return Math.max(a, p.u.D||0); }, 0));
      var nm = Fr.fwd(run.wallLength/2, 0, deep+150);
      labelsOut.push('<text x="'+nm[0]+'" y="'+(nm[2]+24)+'" text-anchor="middle" font-family="'+F+'" font-size="66" font-weight="700" fill="var(--ink)" pointer-events="none">'+esc(run.name)+'</text>');
    });
    o = o.concat(labelsOut);
    // the room's two sizes, read outside the walls
    function dim(x1,y1,x2,y2,txt,vert){
      o.push('<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--ink-soft)" stroke-width="5"/>');
      var tx = (x1+x2)/2, ty = (y1+y2)/2;
      o.push('<text x="'+tx+'" y="'+(vert ? ty : ty-16)+'" text-anchor="middle"'+(vert ? ' transform="rotate(-90 '+tx+' '+ty+')"' : '')+' font-family="'+F+'" font-size="60" fill="var(--ink-soft)">'+txt+'</text>');
    }
    dim(0, -WALL-150, W, -WALL-150, W+' mm', false);
    dim(-WALL-150, Dp, -WALL-150, 0, Dp+' mm', true);
    var VBX = -WALL-M, VBY = -WALL-M-40, VBW = W+2*WALL+2*M, VBH = Dp+2*WALL+2*M;
    return '<svg class="roomplan" viewBox="'+VBX+' '+VBY+' '+VBW+' '+VBH+'" role="img" aria-label="Plan of the room. Drag a run to move it.">'+o.join('')+'</svg>';
  }

  /* ================= 3D view ================= */
  // The run as a solid model: an axonometric projection of boxes in real
  // millimetres, drawn with the same lines and materials as the other two
  // views. Drag turns the camera round the run and tilts it; the picture is
  // rebuilt from the same geometry every frame, so nothing can drift from
  // the cut list.
  var CAM_HOME = {yaw:32, pitch:24, zoom:1, panX:0, panY:0};
  // the viewpoints on the legend: where a fitter would stand to look at the run
  var CAM_VIEWS = {home:{yaw:32, pitch:24}, front:{yaw:0, pitch:6}, left:{yaw:-44, pitch:20}, right:{yaw:44, pitch:20}, top:{yaw:0, pitch:85}, above:{yaw:14, pitch:62}};
  // the compass: looking at the room from that side
  var CAM_SIDES = {front:0, right:90, back:180, left:-90};
  // one wall is only ever looked at from in front of it; the room can be walked all round
  var RUN_YAW = 78;
  var cam = JSON.parse(JSON.stringify(CAM_HOME));
  try{ var cs = JSON.parse(localStorage.getItem('kitchen-run-studio-cam')||'null');
    if(cs && isFinite(cs.yaw) && isFinite(cs.pitch)) cam = {yaw:+cs.yaw, pitch:+cs.pitch, zoom:isFinite(cs.zoom)?+cs.zoom:1, panX:isFinite(cs.panX)?+cs.panX:0, panY:isFinite(cs.panY)?+cs.panY:0}; }catch(e){}
  function clampCam(){
    cam.yaw = ((((+cam.yaw||0)+180)%360)+360)%360-180; cam.pitch = Math.max(2, Math.min(85, cam.pitch));
    cam.zoom = Math.max(0.5, Math.min(6, +cam.zoom||1));
    cam.panX = Math.max(-1, Math.min(1, +cam.panX||0)); cam.panY = Math.max(-1, Math.min(1, +cam.panY||0));
  }
  // how far the doors stand open in the 3D view, 0 shut to 1 square to the front; it swings between the two
  var doorT = 0;
  // the 3D view's own switches, kept on this device
  var dimsOn = false, coachSeen = false;
  try{ dimsOn = localStorage.getItem('kitchen-run-studio-dims')==='on'; coachSeen = localStorage.getItem('kitchen-run-studio-coach')==='seen'; }catch(e){}
  var camSaveT = null;
  function saveCam(){ try{ localStorage.setItem('kitchen-run-studio-cam', JSON.stringify(cam)); }catch(e){} }
  function saveCamSoon(){ clearTimeout(camSaveT); camSaveT = setTimeout(saveCam, 400); }
  function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
  function norm(a){ var l = Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1; return [a[0]/l, a[1]/l, a[2]/l]; }

  // One scene, for one wall or the whole room: the runs it holds, each with
  // the frame that stands it in place, inside the box of the room.
  function scene3dSVG(spec, maxLen){
    var S = state.standards, s = state.settings;
    var T = s.thickness, Tb = s.back, G = s.gap;
    var L = spec.W, Dp = spec.D, ceil = spec.ceil;
    clampCam();
    // one wall is only ever looked at from in front of it
    var yawv = spec.room ? cam.yaw : Math.max(-RUN_YAW, Math.min(RUN_YAW, cam.yaw));
    var th = yawv*Math.PI/180, ph = cam.pitch*Math.PI/180;
    var ct = Math.cos(th), st = Math.sin(th), cp = Math.cos(ph), sp = Math.sin(ph);
    var D = [st*cp, sp, ct*cp];                          // towards the viewer
    var LT = [-0.32, 0.83, 0.46];                        // the light, from above left
    function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
    // The camera stands out along D from the middle of the scene, far enough
    // back that the perspective stays gentle: the way the run reads from the
    // kitchen door, not through a wide lens. Everything projects through it.
    var ctr = [L/2, ceil*0.42, spec.room ? Dp/2 : spec.maxD*0.4];
    var R = (spec.room ? Math.max(L, Dp)*1.7 : Math.max(L, 2400)*2.0) + ceil;
    var C = [ctr[0]+D[0]*R, ctr[1]+D[1]*R, ctr[2]+D[2]*R];
    var fwd = [-D[0], -D[1], -D[2]], rt = norm(cross(fwd, [0,1,0])), upv = cross(rt, fwd);
    // the frame of the run being drawn: its points and directions go through it first
    var XF = null, RM = null;
    function P(x,y,z){
      var q = XF ? XF(x,y,z) : [x,y,z];
      var v = [q[0]-C[0], q[1]-C[1], q[2]-C[2]], zc = dot(v, fwd), k = R/Math.max(zc, R*0.05);
      return [dot(v, rt)*k, -dot(v, upv)*k];
    }
    function pt(q){ return q[0].toFixed(0)+','+q[1].toFixed(0); }
    var id = spec.id;

    // one face: culled when it looks away from the camera, shaded by how squarely the light hits it
    function face(o, pts, n, fill, opt){
      var q0 = XF ? XF(pts[0][0],pts[0][1],pts[0][2]) : pts[0], nn = RM ? RM(n) : n;
      if(dot(nn, [C[0]-q0[0], C[1]-q0[1], C[2]-q0[2]]) <= 0) return;
      var pp = pts.map(function(p){ return pt(P(p[0],p[1],p[2])); }).join(' ');
      var sh = 0.6 + 0.4*Math.max(0, dot(nn, LT));
      o.push('<polygon class="f3" points="'+pp+'" fill="'+fill+'" stroke="'+((opt&&opt.stroke)||'var(--ink)')+'" stroke-width="'+((opt&&opt.sw)||4)+'" stroke-linejoin="round"'+
        ((opt&&opt.dash)?' stroke-dasharray="'+opt.dash+'"':'')+'/>');
      if(sh<0.985 && !(opt&&opt.flat)) o.push('<polygon points="'+pp+'" fill="#000" opacity="'+((1-sh)*0.62).toFixed(2)+'" pointer-events="none"/>');
    }
    // an axis-aligned box; its visible faces never overlap each other, so any order works
    function box(o, x,y,z, w,h,d, fill, opt, skip){
      skip = skip||{};
      if(!(w>0) || !(h>0) || !(d>0)) return;
      if(!skip.px) face(o, [[x+w,y,z],[x+w,y+h,z],[x+w,y+h,z+d],[x+w,y,z+d]], [1,0,0], fill, opt);
      if(!skip.nx) face(o, [[x,y,z+d],[x,y+h,z+d],[x,y+h,z],[x,y,z]], [-1,0,0], fill, opt);
      if(!skip.py) face(o, [[x,y+h,z],[x,y+h,z+d],[x+w,y+h,z+d],[x+w,y+h,z]], [0,1,0], fill, opt);
      if(!skip.ny) face(o, [[x,y,z+d],[x,y,z],[x+w,y,z],[x+w,y,z+d]], [0,-1,0], fill, opt);
      if(!skip.pz) face(o, [[x,y,z+d],[x+w,y,z+d],[x+w,y+h,z+d],[x,y+h,z+d]], [0,0,1], (opt&&opt.front)||fill, opt);
      if(!skip.nz) face(o, [[x+w,y,z],[x,y,z],[x,y+h,z],[x+w,y+h,z]], [0,0,-1], fill, opt);
    }
    function circleAt(o, x,y,z, r, fill){
      var q = P(x,y,z);
      o.push('<circle cx="'+q[0].toFixed(0)+'" cy="'+q[1].toFixed(0)+'" r="'+r+'" fill="'+fill+'" pointer-events="none"/>');
    }
    function lineAt(o, a, b, w, col){
      var q1 = P(a[0],a[1],a[2]), q2 = P(b[0],b[1],b[2]);
      o.push('<line x1="'+q1[0].toFixed(0)+'" y1="'+q1[1].toFixed(0)+'" x2="'+q2[0].toFixed(0)+'" y2="'+q2[1].toFixed(0)+'" stroke="'+(col||'var(--front-ink)')+'" stroke-width="'+(w||9)+'" stroke-linecap="round" pointer-events="none"/>');
    }

    var CARC = 'var(--carcass)', FRONT = 'var(--front)', PAPER = 'var(--paper)', STONE = 'var(--stone-soft)';
    // what the carcass front looks like once a unit is open: the inside of the box
    function interior(o, x,y,z, w,h,d, yFloor, shelves){
      face(o, [[x+T,yFloor,z+Tb],[x+w-T,yFloor,z+Tb],[x+w-T,y+h-T,z+Tb],[x+T,y+h-T,z+Tb]], [0,0,1], PAPER, {sw:3, stroke:'var(--line)'});
      face(o, [[x+T,yFloor,z+d],[x+T,yFloor,z+Tb],[x+w-T,yFloor,z+Tb],[x+w-T,yFloor,z+d]], [0,1,0], CARC, {sw:3, stroke:'var(--line)'});
      face(o, [[x+T,yFloor,z+Tb],[x+T,yFloor,z+d],[x+T,y+h-T,z+d],[x+T,y+h-T,z+Tb]], [1,0,0], CARC, {sw:3, stroke:'var(--line)'});
      face(o, [[x+w-T,yFloor,z+d],[x+w-T,yFloor,z+Tb],[x+w-T,y+h-T,z+Tb],[x+w-T,y+h-T,z+d]], [-1,0,0], CARC, {sw:3, stroke:'var(--line)'});
      (shelves||[]).forEach(function(ys){ box(o, x+T, ys-T/2, z+Tb, w-2*T, T, d-K.shelfSetback-Tb, FRONT, {sw:3}); });
    }
    // the front edges of a box with no front on it
    function frame(o, x,y,z, w,h,d, dash, noBottom){
      var zf = z+d, opt = {sw:4, dash:dash}, yb = noBottom ? y : y+T;
      face(o, [[x,y+h-T,zf],[x+w,y+h-T,zf],[x+w,y+h,zf],[x,y+h,zf]], [0,0,1], CARC, opt);
      if(!noBottom) face(o, [[x,y,zf],[x+w,y,zf],[x+w,y+T,zf],[x,y+T,zf]], [0,0,1], CARC, opt);
      face(o, [[x,yb,zf],[x+T,yb,zf],[x+T,y+h-T,zf],[x,y+h-T,zf]], [0,0,1], CARC, opt);
      face(o, [[x+w-T,yb,zf],[x+w,yb,zf],[x+w,y+h-T,zf],[x+w-T,y+h-T,zf]], [0,0,1], CARC, opt);
    }
    function knob(o, kx, ky, z, col){ circleAt(o, kx, ky, z, 11, col||'var(--front-ink)'); }
    // the grain or the vein, laid over a front's face, and a gloss surface's sheen
    function grain(o, x,y,z, w,h, dec){
      if(!dec) return;
      var pts = [[x,y,z],[x+w,y,z],[x+w,y+h,z],[x,y+h,z]];
      if(hasTexture(dec)) face(o, pts, [0,0,1], 'url(#grain-'+id+'-'+dec.pid+')', {flat:true, sw:0, stroke:'none'});
      if(dec.gloss) face(o, pts, [0,0,1], 'url(#sheen-'+id+')', {flat:true, sw:0, stroke:'none'});
    }
    // a door turned part way open on its hinge: a board standing out from its
    // hinge edge at an angle, t from 0 (shut) to 1 (square to the front)
    function swungDoor(o, hx, y, zf, dw, h, hingeLeft, t, dec){
      var a = t*Math.PI/2, sg = hingeLeft ? 1 : -1;
      var u = [sg*Math.cos(a), 0, Math.sin(a)], v = [sg*Math.sin(a), 0, -Math.cos(a)];
      var B = [hx, y, zf+T];
      function at(du, dv, dy){ return [B[0]+u[0]*du+v[0]*dv, B[1]+dy, B[2]+u[2]*du+v[2]*dv]; }
      var nu = [u[0],0,u[2]], nv = [v[0],0,v[2]], mnu = [-u[0],0,-u[2]], mnv = [-v[0],0,-v[2]];
      var fill = dec.fill, op = {sw:4};
      face(o, [at(0,0,0), at(dw,0,0), at(dw,0,h), at(0,0,h)], mnv, fill, op);          // its face
      face(o, [at(dw,T,0), at(0,T,0), at(0,T,h), at(dw,T,h)], nv, fill, op);           // its back
      face(o, [at(dw,0,0), at(dw,T,0), at(dw,T,h), at(dw,0,h)], nu, fill, op);         // the handle edge
      face(o, [at(0,T,0), at(0,0,0), at(0,0,h), at(0,T,h)], mnu, fill, op);            // the hinge edge
      face(o, [at(0,0,h), at(dw,0,h), at(dw,T,h), at(0,T,h)], [0,1,0], fill, op);      // its top
      face(o, [at(0,T,0), at(dw,T,0), at(dw,0,0), at(0,0,0)], [0,-1,0], fill, op);     // its bottom
    }
    function door(o, x,y,z, w,h, hingeLeft, level, dec){
      dec = dec || decorFront();
      box(o, x, y, z, w, h, T, dec.fill, {sw:4});
      grain(o, x, y, z+T, w, h, dec);
      knob(o, hingeLeft ? x+w-70 : x+70, y+h*((level==='wall'||level==='upper')?0.80:0.20), z+T+2, decorInk(dec));
    }
    function drawerFront(o, x,y,z, w,h, dec){
      dec = dec || decorFront();
      box(o, x, y, z, w, h, T, dec.fill, {sw:4});
      grain(o, x, y, z+T, w, h, dec);
      var hy = y+h*0.65;
      lineAt(o, [x+w*0.32, hy, z+T+2], [x+w*0.68, hy, z+T+2], 10, decorInk(dec));
    }
    // an oven or microwave face in its niche, flush with the fronts
    function applianceBox(o, kind, x,y,z, w,h){
      box(o, x, y, z, w, h, T, STONE, {sw:4, stroke:'var(--stone)', flat:true});
      var zf = z+T+2, win = 'var(--panel-3)', wo = {sw:3, stroke:'var(--stone)', flat:true};
      if(kind==='oven'){
        face(o, [[x+w*0.12,y+h*0.14,zf],[x+w*0.88,y+h*0.14,zf],[x+w*0.88,y+h*0.62,zf],[x+w*0.12,y+h*0.62,zf]], [0,0,1], win, wo);
        lineAt(o, [x+w*0.12, y+h*0.74, zf], [x+w*0.88, y+h*0.74, zf], 10);
        [0.25,0.5,0.75].forEach(function(f){ circleAt(o, x+w*f, y+h*0.89, zf, 5, 'var(--ink)'); });
      } else {
        face(o, [[x+w*0.06,y+h*0.14,zf],[x+w*0.62,y+h*0.14,zf],[x+w*0.62,y+h*0.86,zf],[x+w*0.06,y+h*0.86,zf]], [0,0,1], win, wo);
        circleAt(o, x+w*0.81, y+h*0.38, zf, 5, 'var(--ink)');
      }
    }

    // a unit: its carcass, then what is on its front
    function unit(o, u, x, y, z, w, h, d){
      var build = buildOf(u), carcass = build!=='fronts', fronts = build!=='carcass', dec = frontDecorOf(u);
      var dash = build==='fronts' ? '34,22' : null;
      var open = !fronts || u.type==='shelf' || u.type==='wine' || u.type==='frame';
      if(u.type==='gap'){
        if(applianceFront(u)){
          box(o, x, y+S.plinth, z, w, h-S.plinth, d, CARC, {sw:4, stroke:'var(--stone)'});
          var dg = frontDecorOf(u), fy = y+S.plinth+G, fh = h-S.plinth-2*G;
          box(o, x+G, fy, z+d, w-2*G, fh, T, dg.fill, {sw:4});
          grain(o, x+G, fy, z+d+T, w-2*G, fh, dg);
          lineAt(o, [x+w*0.25, fy+fh-Math.min(fh*0.12, 90), z+d+T+2], [x+w*0.75, fy+fh-Math.min(fh*0.12, 90), z+d+T+2], 10, decorInk(dg));
        } else box(o, x, y, z, w, Math.min(applianceBodyH(u), h), d, CARC, {sw:5, stroke:'var(--stone)', front:'url(#app-'+id+')', flat:true});
        return;
      }
      if(open){
        box(o, x, y, z, w, h, d, CARC, {sw:4, dash:dash}, {pz:true});
        var shelves = [];
        var n = u.type==='shelf' ? (u.opts.shelfCount||3) : u.type==='wine' ? (u.opts.wineRows||5)+1 : u.type==='combo' ? (u.opts.shelfCount||2) : doorShelves(u);
        if(u.type==='combo' && !fronts){
          var dz0 = Math.min(u.opts.drawerZone||300, h-100), lo = y+G+dz0;
          for(var k=1;k<=n;k++) shelves.push(lo+((y+h-T)-lo)*(k/(n+1)));
        } else if(u.type==='wine'){ for(var r=1;r<n;r++) shelves.push(y+h*(r/n)); }
        else { for(var j=1;j<=n;j++) shelves.push(y+h*(j/(n+1))); }
        interior(o, x,y,z, w,h,d, y+T, shelves);
        frame(o, x,y,z, w,h,d, dash);
        return;
      }
      var OPEN = doorT>0.001 && hasOpenableDoors(u);
      // with the doors open the box is drawn like an open one; the doors
      // themselves are added to the scene on their own, standing out at their hinges
      box(o, x, y, z, w, h, d, CARC, {sw:4, dash:dash}, OPEN ? {pz:true} : null);
      var zf = z+d;
      if(u.type==='door' || u.type==='sink'){
        var top = y+G, avail = h-2*G;
        if(OPEN){
          var shO = [], nO = doorShelves(u);
          for(var jo=1;jo<=nO;jo++) shO.push(y+h*(jo/(nO+1)));
          interior(o, x,y,z, w,h,d, y+T, shO);
          frame(o, x,y,z, w,h,d, dash);
        }
        if(u.type==='sink'){ drawerFront(o, x+G, top, zf, w-2*G, K.sinkTrayHeight, dec); top += K.sinkTrayHeight+G; avail -= K.sinkTrayHeight+G; }
        if(OPEN) return;
        var dc = u.opts.doorCount||2, dw = dc===1 ? w-2*G : (w-2*G-G)/2;
        for(var i=0;i<dc;i++) door(o, x+G+i*(dw+G), top, zf, dw, avail, dc===1 ? hingeSide(u)==='left' : i===0, u.level, dec);
      } else if(u.type==='drawer' || u.type==='combo'){
        var nd = u.opts.drawerCount||2, zoneTop = y+G, zoneH = h-2*G;
        if(u.type==='combo'){
          // the drawers sit low; open shelving fills the box above them
          var dz = Math.min(u.opts.drawerZone||300, h-100), lo2 = y+G+dz;
          zoneTop = y+G; zoneH = dz;
          var sc = u.opts.shelfCount||2, sh2 = [];
          for(var k2=1;k2<=sc;k2++) sh2.push(lo2+((y+h-T)-lo2)*(k2/(sc+1)));
          interior(o, x, y, z, w, h, d, lo2, sh2);
          frame(o, x, lo2, z, w, y+h-lo2, d, dash, true);
        }
        var fh = (zoneH-(nd+1)*G)/nd;
        for(var dd=0;dd<nd;dd++) drawerFront(o, x+G, zoneTop+G+dd*(fh+G), zf, w-2*G, fh, dec);
      } else if(u.type==='housing'){
        var nd3 = housingDrawers(u), dc3 = Math.max(housingDoors(u), 1);
        housingSections(u).forEach(function(sec){
          var sy = y+sec.y0, sh = sec.h;
          if(sec.kind==='drawers'){
            var fh3 = (sh-(nd3+1)*G)/nd3;
            for(var q3=0;q3<nd3;q3++) drawerFront(o, x+G, sy+G+q3*(fh3+G), zf, w-2*G, fh3, dec);
          } else if(sec.kind==='door' || sec.kind==='top'){
            var dw3 = dc3===1 ? w-2*G : (w-3*G)/2;
            if(OPEN){
              var scT = sec.kind==='top' ? Math.max(0, Math.round(+u.opts.shelfCount||0)) : 0, shT = [];
              for(var kT=1;kT<=scT;kT++) shT.push(sy+sh*(kT/(scT+1)));
              interior(o, x, sy, z, w, sh, d, sy, shT);
              frame(o, x, sy, z, w, sh, d, dash, true);
            } else for(var i3=0;i3<dc3;i3++) door(o, x+G+i3*(dw3+G), sy+G, zf, dw3, sh-2*G, dc3===1 ? hingeSide(u)==='left' : i3===0, u.level, dec);
          } else if(sec.kind==='open'){
            var sc3 = Math.max(0, Math.round(+u.opts.shelfCount||0)), sh3 = [];
            for(var k3=1;k3<=sc3;k3++) sh3.push(sy+sh*(k3/(sc3+1)));
            interior(o, x, sy, z, w, sh, d, sy, sh3);
            frame(o, x, sy, z, w, sh, d, dash, true);
          } else applianceBox(o, sec.kind, x+G, sy+G, zf, w-2*G, sh-2*G);
        });
      } else if(u.type==='corner'){
        if(OPEN){ interior(o, x,y,z, w,h,d, y+T, []); frame(o, x,y,z, w,h,d, dash); }
        if((u.opts.cornerStyle||'blind')==='lazysusan'){
          var dWL = Math.min(Math.max(u.opts.doorWidth||580, 300), w-2*G);
          if(!OPEN) door(o, x+G, y+G, zf, dWL, h-2*G, true, u.level, dec);
        } else {
          var dW = Math.min(Math.max(u.opts.doorWidth||450,200), Math.max(u.W-150,200));
          if(!OPEN) door(o, x+G, y+G, zf, dW-2*G, h-2*G, true, u.level, dec);
          box(o, x+dW+G, y+G, zf, Math.max(w-dW-2*G,6), h-2*G, T, dec.fill, {sw:4, front:'url(#fill-'+id+')', flat:true});
        }
      }
    }
    // the doors of a unit swung open: each a board standing out from its hinge edge
    function hasOpenableDoors(u){
      if(u.type==='door' || u.type==='sink' || u.type==='corner') return buildOf(u)!=='carcass';
      if(u.type==='housing') return buildOf(u)!=='carcass' && housingSections(u).some(function(q){ return q.kind==='door' || q.kind==='top'; });
      return false;
    }
    function openDoorsOf(u, x, y, z, w, h, d){
      var out = [], dec = frontDecorOf(u), zf = z+d;
      function one(dx, dy, dw, dh, hl){ out.push({hx: hl ? dx : dx+dw, y:dy, z:zf, h:dh, dw:dw, hl:hl, dec:dec}); }
      if(u.type==='door' || u.type==='sink'){
        var top = y+G, avail = h-2*G;
        if(u.type==='sink'){ top += K.sinkTrayHeight+G; avail -= K.sinkTrayHeight+G; }
        var dc = u.opts.doorCount||2, dw = dc===1 ? w-2*G : (w-2*G-G)/2;
        for(var i=0;i<dc;i++) one(x+G+i*(dw+G), top, dw, avail, dc===1 ? hingeSide(u)==='left' : i===0);
      } else if(u.type==='housing'){
        var dc3 = Math.max(housingDoors(u), 1);
        housingSections(u).forEach(function(sec){
          if(sec.kind!=='door' && sec.kind!=='top') return;
          var sy = y+sec.y0, sh = sec.h, dw3 = dc3===1 ? w-2*G : (w-3*G)/2;
          for(var i3=0;i3<dc3;i3++) one(x+G+i3*(dw3+G), sy+G, dw3, sh-2*G, dc3===1 ? hingeSide(u)==='left' : i3===0);
        });
      } else if(u.type==='corner'){
        if((u.opts.cornerStyle||'blind')==='lazysusan') one(x+G, y+G, Math.min(Math.max(u.opts.doorWidth||580, 300), w-2*G), h-2*G, true);
        else one(x+G, y+G, Math.min(Math.max(u.opts.doorWidth||450,200), Math.max(u.W-150,200))-2*G, h-2*G, true);
      }
      return out;
    }

    // ---- the scene: every run's pieces as objects, each knowing where its
    // middle is, painted farthest from the camera first. A worktop counts as
    // just nearer than the nearest unit under it, so it always paints over
    // them; the kickboard, recessed under everything, paints first.
    var objs = [];
    spec.runs.forEach(function(rs, ri){
      var g = rs.g;
      function add(c, draw, u, extra){ var ob = {ri:ri, c:c, draw:draw, u:u}; if(extra) Object.keys(extra).forEach(function(k){ ob[k] = extra[k]; }); objs.push(ob); return ob; }
      // the kickboard: one piece under each stretch of cabinets, as deep as they are
      g.kickSpans.forEach(function(k){
        add([(k.x0+k.x1)/2, S.plinth/2, 0], function(o){ box(o, k.x0, 0, 0, k.x1-k.x0, S.plinth, k.D, 'var(--panel-3)', {sw:4}); }, null, {first:true});
      });
      // fillers: strips flush with the carcass fronts
      g.fillerGeo.forEach(function(fg){
        add([fg.x+fg.w/2, fg.y+fg.H/2, fg.D-T/2], function(o){ box(o, fg.x, fg.y, fg.D-T, fg.w, fg.H, T, FRONT, {sw:4, front:'url(#fill-'+id+')', flat:true}); }, null,
          {x0:fg.x, x1:fg.x+fg.w, y0:fg.y, y1:fg.y+fg.H, tall:fg.row==='floor' && fg.tall, hung:fg.row!=='floor'});
      });
      // finished panels: a board on edge, flush with the fronts
      g.panels.forEach(function(p){
        add([p.x+p.w/2, p.y+p.H/2, p.D/2], function(o){ box(o, p.x, p.y, 0, p.w, p.H, p.D, panelFill(p), {sw:4}); }, null,
          {x0:p.x, x1:p.x+p.w, y0:p.y, y1:p.y+p.H, tall:p.row==='floor' && isTallUnit(p.u), hung:p.row!=='floor'});
      });
      // floor row
      var floorObjs = [];
      // a door swung open stands out in front of everything beside it, so it is an object of its own
      function addOpenDoors(u, x, y, w, h, d){
        if(!(doorT>0.001) || !hasOpenableDoors(u)) return;
        var a = doorT*Math.PI/2;
        openDoorsOf(u, x, y, 0, w, h, d).forEach(function(dd){
          var sg = dd.hl ? 1 : -1, ex = dd.hx + sg*Math.cos(a)*dd.dw;
          add([dd.hx + sg*Math.cos(a)*dd.dw/2, dd.y+dd.h/2, dd.z+T+Math.sin(a)*dd.dw/2], function(o){ swungDoor(o, dd.hx, dd.y, dd.z, dd.dw, dd.h, dd.hl, doorT, dd.dec); }, u,
            {x0:Math.min(dd.hx, ex), x1:Math.max(dd.hx, ex)+T, y0:dd.y, y1:dd.y+dd.h});
        });
      }
      g.rows.floor.forEach(function(p){
        var u = p.u;
        var h = u.type==='gap' ? applianceHeight(u) : u.H;
        var y = u.type==='gap' ? 0 : S.plinth, d = Math.max(u.D||0,100);
        floorObjs.push(add([p.x+u.W/2, y+h/2, d/2], function(o){ unit(o, u, p.x, y, 0, u.W, h, d); }, u, {x0:p.x, x1:p.x+u.W, y0:y, y1:y+h, tall:isTallUnit(u)}));
        addOpenDoors(u, p.x, y, u.W, h, d);
      });
      // worktop slabs, each over the units it covers and as deep as they ask for
      g.worktopSpans.forEach(function(w){
        var sinks = g.rows.floor.filter(function(p){ return p.u.type==='sink' && p.x>=w.x0-1 && p.x+p.u.W<=w.x1+1; });
        var under = floorObjs.filter(function(ob){ return ob.c[0] >= w.x0-1 && ob.c[0] <= w.x1+1; });
        add([(w.x0+w.x1)/2, g.counterH-S.worktopT/2, w.D/2], function(o){
          var yw = g.counterH-S.worktopT;
          box(o, w.x0, yw, 0, w.x1-w.x0, S.worktopT, w.D, STONE, {sw:4, stroke:'var(--stone)'});
          sinks.forEach(function(p){
            var bw = Math.min(p.u.W-180, 520), bd = Math.min(w.D-230, 400);
            if(bw<120 || bd<120) return;
            var bx = p.x+(p.u.W-bw)/2, bz = 90, rr = 40, pts = [];
            for(var i=0;i<=24;i++){
              var a = i/24*Math.PI*2, cxr = (Math.cos(a)>=0 ? bx+bw-rr : bx+rr), czr = (Math.sin(a)>=0 ? bz+bd-rr : bz+rr);
              pts.push([cxr+rr*Math.cos(a), g.counterH, czr+rr*Math.sin(a)]);
            }
            face(o, pts, [0,1,0], PAPER, {sw:4, flat:true});
            circleAt(o, p.x+p.u.W/2, g.counterH, 48, 14, 'var(--ink)');
          });
        }, null, {after:under});
      });
      // wall row, upper row
      g.rows.wall.forEach(function(p){
        var u = p.u, yb = wallUnitBottom(u), d = Math.max(u.D||0,100);
        add([p.x+u.W/2, yb+u.H/2, d/2], function(o){ unit(o, u, p.x, yb, 0, u.W, u.H, d); }, u, {x0:p.x, x1:p.x+u.W, y0:yb, y1:yb+u.H, hung:true});
        addOpenDoors(u, p.x, yb, u.W, u.H, d);
      });
      g.rows.upper.forEach(function(p){
        var u = p.u, d = Math.max(u.D||0,100);
        add([p.x+u.W/2, g.upperBottom+u.H/2, d/2], function(o){ unit(o, u, p.x, g.upperBottom, 0, u.W, u.H, d); }, u, {x0:p.x, x1:p.x+u.W, y0:g.upperBottom, y1:g.upperBottom+u.H, hung:true});
        addOpenDoors(u, p.x, g.upperBottom, u.W, u.H, d);
      });
      g.rows.stack.forEach(function(p){
        var u = p.u, d = Math.max(u.D||0,100);
        add([p.x+u.W/2, p.y+u.H/2, d/2], function(o){ unit(o, u, p.x, p.y, 0, u.W, u.H, d); }, u, {x0:p.x, x1:p.x+u.W, y0:p.y, y1:p.y+u.H, hung:true});
        addOpenDoors(u, p.x, p.y, u.W, u.H, d);
      });
      // finished bottom panels: one board under each stretch; its top and
      // back are covered by the units standing on it, so they are never drawn
      g.bottomGroups.forEach(function(gr){
        add([gr.x+gr.w/2, gr.y-T/2, (gr.D+T)/2], function(o){ box(o, gr.x, gr.y-T, 0, gr.w, T, gr.D+T, panelDecorOf(gr.units[0]).fill, {sw:4}, {py:true, nz:true}); }, null, {x0:gr.x, x1:gr.x+gr.w, y0:gr.y-T, y1:gr.y, hung:true});
      });
    });
    objs.forEach(function(ob){
      var q = spec.runs[ob.ri].F.fwd(ob.c[0], ob.c[1], ob.c[2]);
      ob.depth = Math.sqrt(Math.pow(q[0]-C[0],2)+Math.pow(q[1]-C[1],2)+Math.pow(q[2]-C[2],2));
    });
    // A tall cabinet or panel stands deeper than the wall units beside it, so
    // its side shows in front of them whichever way you look: a hung unit
    // within reach of it at its own height paints before it. A top box
    // standing on it is another matter: that one covers the back of its top,
    // so it keeps its turn after the tall unit. The tall unit itself keeps
    // its place among what stands on the floor beside it.
    var hungObjs = objs.filter(function(ob){ return ob.hung; });
    objs.forEach(function(ob){
      if(!ob.tall) return;
      hungObjs.forEach(function(hb){
        if(hb.ri!==ob.ri) return;
        var gap = Math.max(hb.x0 - ob.x1, ob.x0 - hb.x1);
        var beside = hb.y0 < ob.y1 - 1 && hb.y1 > ob.y0 + 1;
        if(gap <= 650 && beside) hb.depth = Math.max(hb.depth, ob.depth + 1);
      });
    });
    // Where one hung unit stands on another (a top box on a wall unit, a wall
    // unit on its bottom panel) the two meet along one plane: seen from above
    // it, the upper one covers the lower one's top, so it paints after; seen
    // from below it, the lower one hides the upper one's underside, so it
    // paints after instead. However else the two were moved.
    var standObjs = objs.filter(function(ob){ return ob.hung || ob.tall || (ob.u && !isWallLike(ob.u)); });
    hungObjs.forEach(function(top){
      standObjs.forEach(function(under){
        if(top===under || top.ri!==under.ri) return;
        if(Math.abs(top.y0 - under.y1) > 1) return;
        if(top.x0 >= under.x1 - 1 || top.x1 <= under.x0 + 1) return;
        if(C[1] >= top.y0) top.depth = Math.min(top.depth, under.depth - 1);
        else under.depth = Math.min(under.depth, top.depth - 1);
      });
    });
    objs.forEach(function(ob){
      if(ob.after && ob.after.length) ob.depth = Math.min(ob.depth, ob.after.reduce(function(a,x){ return Math.min(a, x.depth); }, Infinity) - 1);
      if(ob.first) ob.depth = 1e12;
    });
    objs.sort(function(a,b){ return b.depth - a.depth; });

    // ---- paint: the room first, then everything in it
    var o = [];
    o.push('<defs>'+
      '<pattern id="fill-'+id+'" width="30" height="30" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+

  // zoom held on the point under the pointer; fx, fy from the view's middle, -0.5 to 0.5
  function zoomAt(z, fx, fy){
    var z0 = cam.zoom||1; z = Math.max(0.5, Math.min(6, z));
    cam.panX = (cam.panX||0) + (fx||0)*(1/z0 - 1/z); cam.panY = (cam.panY||0) + (fy||0)*(1/z0 - 1/z);
    cam.zoom = z; clampCam();
  }
  // a cabinet double-clicked fills the view; empty floor fits the whole again
  function focusOn(svg, eu){
    if(!eu){ animateCam({yaw:cam.yaw, pitch:cam.pitch, zoom:1, panX:0, panY:0}); return; }
    var bb; try{ bb = eu.getBBox(); }catch(e){ return; }
    var bx = +svg.getAttribute('data-bx'), by = +svg.getAttribute('data-by'), bw = +svg.getAttribute('data-bw'), bh = +svg.getAttribute('data-bh');
    if(!(bw>0) || !(bb.width>0)) return;
    var z = Math.max(1, Math.min(5, Math.min(bw/(bb.width*2.4), bh/(bb.height*2.4))));
    animateCam({yaw:cam.yaw, pitch:cam.pitch, zoom:z, panX:(bb.x+bb.width/2-(bx+bw/2))/bw, panY:(bb.y+bb.height/2-(by+bh/2))/bh});
  }
  function v3Hint(w, text){
    var h = w && w.querySelector('.v3hint'); if(!h) return;
    h.textContent = text; h.classList.add('on');
    clearTimeout(h._t); h._t = setTimeout(function(){ h.classList.remove('on'); }, 1600);
  }
  function coachOff(){
    if(coachSeen) return;
    coachSeen = true;
    try{ localStorage.setItem('kitchen-run-studio-coach', 'seen'); }catch(e){}
    document.querySelectorAll('[data-coach]').forEach(function(n){ n.remove(); });
  }
  // the doors swing open or shut in the 3D view, then every drawing follows
  var doorAnim = null;
  function setDoors(open){
    doorsOpenPref = open;
    try{ localStorage.setItem('kitchen-run-studio-doors', open ? 'open' : 'shut'); }catch(e){}
    if(doorAnim) cancelAnimationFrame(doorAnim);
    var from = doorT, to = open ? 1 : 0, t0 = performance.now(), dur = 420;
    if(reduceMotion || !document.querySelector('[data-v3]')){ doorT = to; render(true); return; }
    function step(now){
      var k = Math.min(1, (now-t0)/dur), e = k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2, 2)/2;
      doorT = from + (to-from)*e; draw3dNow();
      if(k<1) doorAnim = requestAnimationFrame(step); else { doorAnim = null; doorT = to; render(true); }
    }
    doorAnim = requestAnimationFrame(step);
  }

  // Fronts and interiors, drawn to the sizes the cut list actually produces:
  // full-overlay fronts set in by the 2 mm reveal with a 3 mm gap between a
  // pair, 35 mm hinge cups bored 21.5 mm from the door edge and 100 mm from
  // each end (a third one once a door passes 1600 mm, matching the hardware
  // count), and shelves at their real board thickness. Shared by the run
  // elevation and the per-cabinet detail drawing, so the two always agree.
  function drawUnitFace(o, u, x, y, w, h, patId){
      var dec = frontDecorOf(u), wood=dec.fill, ink=decorInk(dec), acc='var(--carcass)';
      var grainId = hasTexture(dec) ? 'grain-'+patId+'-'+dec.pid : null;
      if(w<80 || h<80) return;
      var R = state.settings.gap, G = state.settings.gap, T = state.settings.thickness;
      var build = buildOf(u);
      // a box built without its fronts shows its inside, like an open frame
      if(build==='carcass' && u.type!=='shelf' && u.type!=='wine'){
        opening(x, y, w, h);
        if(u.type==='housing'){ housingSections(u).forEach(function(sec){ if(sec.y0>0) board(x+T, y+h-sec.y0, w-2*T); }); }
        if(u.type==='door'){ var sdn = doorShelves(u); for(var jd=1;jd<=sdn;jd++) board(x+T, y+h*(jd/(sdn+1)), w-2*T); }
        if(u.type==='combo'){
          var scc = u.opts.shelfCount||2, dzc = Math.min(u.opts.drawerZone||300, h-100);
          for(var kc=1;kc<=scc;kc++) board(x+T, (y+T)+((y+h-dzc)-(y+T))*(kc/(scc+1)), w-2*T);
        }
        return;
      }

      function front(px,py,pw,ph,op){
        if(!(pw>0) || !(ph>0)) return;
        o.push('<rect x="'+px+'" y="'+py+'" width="'+pw+'" height="'+ph+'" fill="'+wood+'" stroke="var(--ink)" stroke-width="5"/>');
        if(grainId) o.push('<rect x="'+px+'" y="'+py+'" width="'+pw+'" height="'+ph+'" fill="url(#'+grainId+')" pointer-events="none"/>');
      }
      // the inside of the box, for units with no front on them
      function opening(px,py,pw,ph){
        if(!(pw-2*T>0) || !(ph-2*T>0)) return;
        o.push('<rect x="'+(px+T)+'" y="'+(py+T)+'" width="'+(pw-2*T)+'" height="'+(ph-2*T)+'" fill="var(--paper)" stroke="var(--line)" stroke-width="4"/>');
      }
      function board(px,py,pw){          // a shelf or divider seen edge-on
        if(!(pw>0)) return;
        o.push('<rect x="'+px+'" y="'+(py-T/2)+'" width="'+pw+'" height="'+T+'" fill="'+acc+'" stroke="var(--carcass-line)" stroke-width="3"/>');
      }
      function cups(edgeX, dir, py, ph, pw){ // dir: +1 cup sits right of the edge
        var cx = edgeX + dir*21.5;
        var n = hingesForDoor(pw||600, ph), ys = [];
        for(var k=0;k<n;k++) ys.push(py+100 + (ph-200)*(n===1?0:k/(n-1)));
        ys.forEach(function(cy){
          o.push('<circle cx="'+cx+'" cy="'+cy+'" r="17.5" fill="'+ink+'" opacity="0.18" stroke="'+ink+'" stroke-width="4"/>');
        });
      }
      function pull(px,py,pw,ph){        // drawer bar handle, set above centre
        var hy = py+ph*0.35;
        o.push('<line x1="'+(px+pw*0.32)+'" y1="'+hy+'" x2="'+(px+pw*0.68)+'" y2="'+hy+'" stroke="'+ink+'" stroke-width="9" stroke-linecap="round"/>');
      }
      // door knob: near the top on base and tall units, near the bottom on
      // wall units — where a hand actually reaches, and clear of the label
      function knob(kx, py, ph){
        o.push('<circle cx="'+kx+'" cy="'+(py+ph*(isWallLike(u)?0.80:0.20))+'" r="11" fill="'+ink+'"/>');
      }
      // the opening mark an elevation carries: two faint lines from the
      // hinge-side corners to the middle of the handle edge
      function swing(px,py,pw,ph,hl){
        if(!(pw>120) || !(ph>120)) return;
        var hx = hl ? px : px+pw, ox = hl ? px+pw : px;
        o.push('<path d="M'+hx+','+py+' L'+ox+','+(py+ph/2)+' L'+hx+','+(py+ph)+'" fill="none" stroke="'+ink+'" stroke-width="4" stroke-dasharray="26,16" opacity="0.5" pointer-events="none"/>');
      }
      // an oven or microwave in its niche: body, controls, handle, window
      function appliance(kind, px,py,pw,ph){
        if(!(pw>0) || !(ph>0)) return;
        o.push('<rect x="'+px+'" y="'+py+'" width="'+pw+'" height="'+ph+'" fill="var(--stone-soft)" stroke="var(--stone)" stroke-width="5"/>');
        if(kind==='oven'){
          var cy = py+ph*0.11, r = Math.min(16, ph*0.045);
          [0.25,0.5,0.75].forEach(function(f){ o.push('<circle cx="'+(px+pw*f)+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--ink)" stroke-width="4"/>'); });
          o.push('<line x1="'+(px+pw*0.12)+'" y1="'+(py+ph*0.26)+'" x2="'+(px+pw*0.88)+'" y2="'+(py+ph*0.26)+'" stroke="var(--ink)" stroke-width="9" stroke-linecap="round"/>');
          o.push('<rect x="'+(px+pw*0.12)+'" y="'+(py+ph*0.38)+'" width="'+(pw*0.76)+'" height="'+(ph*0.48)+'" rx="8" fill="var(--ink)" opacity="0.2" stroke="var(--ink)" stroke-width="4"/>');
        } else {
          o.push('<rect x="'+(px+pw*0.06)+'" y="'+(py+ph*0.14)+'" width="'+(pw*0.56)+'" height="'+(ph*0.72)+'" rx="8" fill="var(--ink)" opacity="0.2" stroke="var(--ink)" stroke-width="4"/>');
          o.push('<rect x="'+(px+pw*0.70)+'" y="'+(py+ph*0.18)+'" width="'+(pw*0.22)+'" height="'+(ph*0.16)+'" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>');
          o.push('<circle cx="'+(px+pw*0.81)+'" cy="'+(py+ph*0.62)+'" r="'+Math.min(14, ph*0.08)+'" fill="none" stroke="var(--ink)" stroke-width="4"/>');
        }
      }
      // a door with its cups, knob and opening mark; hl: hinged on the left
      function hungDoor(px,py,pw,ph,hl){
        front(px, py, pw, ph);
        if(hl){ cups(px, +1, py, ph, pw); knob(px+pw-70, py, ph); }
        else { cups(px+pw, -1, py, ph, pw); knob(px+70, py, ph); }
        swing(px, py, pw, ph, hl);
      }

      var OPEN = doorsOpen();
      // a door drawn open: the inside shows, and the door stands edge-on at its hinge
      function openDoor(px,py,pw,ph,hl){ front(hl ? px : px+pw-T, py, T, ph); }
      if(u.type==='door' || u.type==='sink'){
        var top = y+R, avail = h-2*R;
        if(OPEN){
          opening(x, y, w, h);
          if(u.type==='door'){ var sdo = doorShelves(u); for(var js=1;js<=sdo;js++) board(x+T, y+h*(js/(sdo+1)), w-2*T); }
        }
        if(u.type==='sink'){              // tip-out tray front above the doors
          front(x+R, top, w-2*R, K.sinkTrayHeight);
          pull(x+R, top, w-2*R, K.sinkTrayHeight);
          top += K.sinkTrayHeight+G; avail -= K.sinkTrayHeight+G;
        }
        var dc = u.opts.doorCount||2;
        var dw = dc===1 ? w-2*R : (w-2*R-G)/2;
        for(var i=0;i<dc;i++){
          // a single door hinges on the side chosen for it; a pair on its outer edges
          var hl1 = dc===1 ? hingeSide(u)==='left' : i===0, dx1 = x+R+i*(dw+G);
          if(OPEN) openDoor(dx1, top, dw, avail, hl1); else hungDoor(dx1, top, dw, avail, hl1);
        }
      } else if(u.type==='drawer' || u.type==='combo'){
        var n = u.opts.drawerCount||2;
        var zoneTop = y+R, zoneH = h-2*R;
        if(u.type==='combo'){
          var dz = Math.min(u.opts.drawerZone||300, h-100);
          zoneTop = y+h-R-dz; zoneH = dz;
          opening(x, y, w, h-dz);         // open shelving above the drawer zone
          var sc = u.opts.shelfCount||2;
          for(var k=1;k<=sc;k++) board(x+T, (y+T)+((y+h-dz)-(y+T))*(k/(sc+1)), w-2*T);
        }
        // fronts share the zone with a 3 mm gap above, below and between
        var fh = (zoneH-(n+1)*G)/n;
        for(var d=0;d<n;d++){
          var by = zoneTop+G+d*(fh+G);
          front(x+R, by, w-2*R, fh, 0.26);
          pull(x+R, by, w-2*R, fh);
        }
      } else if(u.type==='housing'){
        var ndF = housingDrawers(u), dcF = Math.max(housingDoors(u), 1);
        housingSections(u).forEach(function(sec){
          var sy = y+h-sec.y1, sh = sec.h;      // the section's top, in drawing space
          if(sec.kind==='drawers'){
            var fhF = (sh-(ndF+1)*G)/ndF;
            for(var q=0;q<ndF;q++){ var byF = sy+G+q*(fhF+G); front(x+R, byF, w-2*R, fhF); pull(x+R, byF, w-2*R, fhF); }
          } else if(sec.kind==='door' || sec.kind==='top'){
            var dwF = dcF===1 ? w-2*R : (w-2*R-G)/2;
            if(OPEN){
              opening(x, sy, w, sh);
              if(sec.kind==='top'){ var scO = Math.max(0, Math.round(+u.opts.shelfCount||0)); for(var jO=1;jO<=scO;jO++) board(x+T, sy+sh*(jO/(scO+1)), w-2*T); }
            }
            for(var iF=0;iF<dcF;iF++){
              var hlF = dcF===1 ? hingeSide(u)==='left' : iF===0, dxF = x+R+iF*(dwF+G);
              if(OPEN) openDoor(dxF, sy+G, dwF, sh-2*G, hlF); else hungDoor(dxF, sy+G, dwF, sh-2*G, hlF);
            }
          } else if(sec.kind==='open'){
            opening(x, sy, w, sh);
            var scF = Math.max(0, Math.round(+u.opts.shelfCount||0));
            for(var jF=1;jF<=scF;jF++) board(x+T, sy+sh*(jF/(scF+1)), w-2*T);
          } else appliance(sec.kind, x+R, sy+G, w-2*R, sh-2*G);
        });
      } else if(u.type==='shelf'){
        opening(x, y, w, h);
        var n2 = u.opts.shelfCount||3;
        for(var j=1;j<=n2;j++) board(x+T, y+h*(j/(n2+1)), w-2*T);
      } else if(u.type==='wine'){
        opening(x, y, w, h);
        var rows = (u.opts.wineRows||5)+1;
        for(var r2=1;r2<rows;r2++) board(x+T, y+h*(r2/rows), w-2*T);
      } else if(u.type==='frame'){
        opening(x, y, w, h);
      } else if(u.type==='corner'){
        if((u.opts.cornerStyle||'blind')==='lazysusan'){
          var dWL = Math.max(u.opts.doorWidth||580, 300);
          if(OPEN){ opening(x, y, w, h); openDoor(x+R, y+R, Math.min(dWL-2*R, w-2*R), h-2*R, true); }
          else {
          front(x+R, y+R, Math.min(dWL-2*R, w-2*R), h-2*R);
          cups(x+R, +1, y+R, h-2*R, Math.min(dWL-2*R, w-2*R));
          swing(x+R, y+R, Math.min(dWL-2*R, w-2*R), h-2*R, true);
          }
          o.push('<line x1="'+(x+w*0.62)+'" y1="'+y+'" x2="'+(x+w)+'" y2="'+(y+h*0.32)+'" stroke="'+ink+'" stroke-width="6" stroke-dasharray="30,18"/>');
        } else {
          var dW = Math.min(Math.max(u.opts.doorWidth||450,200), Math.max(u.W-150,200));
          var blindW = Math.max(w-dW, 100);
          if(OPEN){ opening(x, y, w, h); openDoor(x+R, y+R, dW-2*R, h-2*R, true); }
          else hungDoor(x+R, y+R, dW-2*R, h-2*R, true);
          // fixed blind panel beside the door — screwed on, not hinged
          o.push('<rect x="'+(x+dW+G)+'" y="'+(y+R)+'" width="'+Math.max(blindW-G-R,6)+'" height="'+(h-2*R)+'" fill="'+wood+'" stroke="var(--ink)" stroke-width="5"/>');
          o.push('<rect x="'+(x+dW+G)+'" y="'+(y+R)+'" width="'+Math.max(blindW-G-R,6)+'" height="'+(h-2*R)+'" fill="url(#fill-'+patId+')" pointer-events="none"/>');
      }
    }
  }

  // One cabinet on its own: the carcass, its front drawn by exactly the same
  // rules as in the run, and its two overall dimensions. Text is sized from
  // the drawn scale so a 2100 mm tall unit reads the same as a 720 mm one.
  function unitFrontSVG(u){
    var W = Math.max(u.W,100), H = Math.max(u.type==='gap' ? applianceHeight(u) : u.H, 100);
    var ML=40, MT=60;
    // A 2100 mm unit is drawn at half the scale of a 720 mm one, so the
    // margins have to be sized from the text, not fixed: lay out once to find
    // the scale, then size the margins to the text that scale needs.
    function fit(mr, mb){
      var vbW = W+ML+mr, vbH = H+MT+mb;
      var pxH = 300, pxW = pxH*vbW/vbH;
      if(pxW>250){ pxW = 250; pxH = pxW*vbH/vbW; }
      return {vbW:vbW, vbH:vbH, pxW:pxW, fs:Math.max(Math.round(13/(pxW/vbW)), 8)};
    }
    var f = fit(260, 260);
    var MR = 130+f.fs*1.5, MB = 130+f.fs*1.7;
    f = fit(MR, MB);
    if(f.fs > 8){ MR = 130+f.fs*1.5; MB = 130+f.fs*1.7; f = fit(MR, MB); }
    var vbW = f.vbW, vbH = f.vbH, pxW = f.pxW, fs = f.fs;
    var x = ML, y = MT, id = 'u'+u.id;
    var o = ['<defs><pattern id="fill-'+id+'" width="30" height="30" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
      '<line x1="0" y1="0" x2="0" y2="30" stroke="var(--wood)" stroke-width="8" opacity="0.55"/></pattern>'+
      '<pattern id="app-'+id+'" width="44" height="44" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
      '<line x1="0" y1="0" x2="0" y2="44" stroke="var(--stone)" stroke-width="7" opacity="0.5"/></pattern>'+grainPatterns(id)+'</defs>'];

    if(u.type==='gap'){
      drawApplianceFace(o, u, x, y, W, H, id);
      if(applianceFront(u)) o.push('<rect x="'+x+'" y="'+(y+H-state.standards.plinth)+'" width="'+W+'" height="'+state.standards.plinth+'" fill="var(--surface-2)" stroke="var(--line)" stroke-width="5"/>');
    } else {
      o.push('<rect x="'+x+'" y="'+y+'" width="'+W+'" height="'+H+'" fill="var(--carcass)" stroke="var(--ink)" stroke-width="7"'+(buildOf(u)==='fronts'?' stroke-dasharray="36,24"':'')+'/>');
      drawUnitFace(o, u, x, y, W, H, id);
      if(finBottom(u)) o.push('<rect x="'+x+'" y="'+(y+H)+'" width="'+W+'" height="'+state.settings.thickness+'" fill="'+panelDecorOf(u).fill+'" stroke="var(--ink)" stroke-width="5"/>');
    }

    // width under, height at the right — the two an elevation can carry.
    // The height reads along its own dimension line, so it needs no more
    // margin than its cap height however tall the cabinet is.
    var tick = Math.max(fs*0.5, 34), dy = y+H+130;
    o.push('<line x1="'+x+'" y1="'+dy+'" x2="'+(x+W)+'" y2="'+dy+'" stroke="var(--ink-soft)" stroke-width="5"/>');
    o.push('<line x1="'+x+'" y1="'+(dy-tick)+'" x2="'+x+'" y2="'+(dy+tick)+'" stroke="var(--ink-soft)" stroke-width="5"/>');
    o.push('<line x1="'+(x+W)+'" y1="'+(dy-tick)+'" x2="'+(x+W)+'" y2="'+(dy+tick)+'" stroke="var(--ink-soft)" stroke-width="5"/>');
    o.push('<text x="'+(x+W/2)+'" y="'+(dy+fs*1.35)+'" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="'+fs+'" fill="var(--ink-soft)">'+Math.round(u.W)+'</text>');

    var dx = x+W+110, my = y+H/2, tx = dx+fs*0.85;
    o.push('<line x1="'+dx+'" y1="'+y+'" x2="'+dx+'" y2="'+(y+H)+'" stroke="var(--ink-soft)" stroke-width="5"/>');
    o.push('<line x1="'+(dx-tick)+'" y1="'+y+'" x2="'+(dx+tick)+'" y2="'+y+'" stroke="var(--ink-soft)" stroke-width="5"/>');
    o.push('<line x1="'+(dx-tick)+'" y1="'+(y+H)+'" x2="'+(dx+tick)+'" y2="'+(y+H)+'" stroke="var(--ink-soft)" stroke-width="5"/>');
    o.push('<text x="'+tx+'" y="'+my+'" text-anchor="middle" transform="rotate(-90 '+tx+' '+my+')" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="'+fs+'" fill="var(--ink-soft)">'+Math.round(H)+'</text>');

    // no caption in the drawing — the block header above it already carries
    // the name, the type code and the full W × H × D

    return '<svg viewBox="0 0 '+vbW+' '+vbH+'" style="width:'+Math.round(pxW)+'px" role="img" aria-label="Front elevation of '+
      escAttr(u.name||TYPES[u.type].label)+', '+Math.round(u.W)+' by '+Math.round(H)+' mm">'+o.join('')+'</svg>';
  }

  /* ================= small drawings ================= */
  function typeIcon(type){
    var VBW=60, VBH=50, x0=4, y0=3, w=VBW-8, h=VBH-6;
    var ink='var(--ink)', line='var(--line)', s2='var(--surface-2)', acc='var(--wood)', wood='var(--wood)', stone='var(--stone)';
    var o = ['<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" fill="'+s2+'" stroke="'+ink+'" stroke-width="1.5"/>'];
    if(type==='frame'){
      o.push('<line x1="'+(x0+3)+'" y1="'+(y0+6)+'" x2="'+(x0+w-3)+'" y2="'+(y0+6)+'" stroke="'+line+'" stroke-width="1" stroke-dasharray="2,2"/>');
      o.push('<line x1="'+(x0+3)+'" y1="'+(y0+h-6)+'" x2="'+(x0+w-3)+'" y2="'+(y0+h-6)+'" stroke="'+line+'" stroke-width="1" stroke-dasharray="2,2"/>');
    }
    // Pictograms, not scale drawings — but they still show the construction
    // the tool builds: fronts cover the face, shelves sit between the sides.
    var T = 2.5;
    if(type==='shelf' || type==='combo'){
      var n = type==='shelf' ? 2 : 1, bot = type==='combo' ? y0+h*0.55 : y0+h;
      for(var i=1;i<=n;i++) o.push('<rect x="'+(x0+T)+'" y="'+(y0+(bot-y0)*(i/(n+1))-1)+'" width="'+(w-2*T)+'" height="2" fill="'+acc+'" opacity="0.6"/>');
    }
    if(type==='drawer' || type==='combo'){
      var n2 = type==='combo'?2:3, top = type==='combo' ? y0+h*0.55 : y0, band=(y0+h-top)/n2;
      for(var d=0;d<n2;d++){
        o.push('<rect x="'+(x0+0.6)+'" y="'+(top+d*band+0.9)+'" width="'+(w-1.2)+'" height="'+(band-1.8)+'" fill="'+wood+'" opacity="0.3" stroke="'+ink+'" stroke-width="0.9"/>');
      }
    }
    if(type==='door' || type==='sink'){
      var top2 = type==='sink' ? y0+10 : y0+0.6;
      if(type==='sink') o.push('<rect x="'+(x0+0.6)+'" y="'+(y0+0.6)+'" width="'+(w-1.2)+'" height="8" fill="'+wood+'" opacity="0.22" stroke="'+ink+'" stroke-width="0.7"/>');
      var dw=(w-1.2-1.8)/2;
      for(var k=0;k<2;k++){
        var dx=x0+0.6+k*(dw+1.8);
        o.push('<rect x="'+dx+'" y="'+top2+'" width="'+dw+'" height="'+(y0+h-0.6-top2)+'" fill="'+wood+'" opacity="0.25" stroke="'+ink+'" stroke-width="0.9"/>');
        o.push('<circle cx="'+(k===0?dx+1.6:dx+dw-1.6)+'" cy="'+(top2+4)+'" r="0.9" fill="'+ink+'" opacity="0.5"/>');
      }
    }
    if(type==='wine'){
      for(var r=1;r<3;r++) o.push('<rect x="'+(x0+T)+'" y="'+(y0+h*r/3-1)+'" width="'+(w-2*T)+'" height="2" fill="'+acc+'" opacity="0.6"/>');
      for(var b=0;b<3;b++) o.push('<circle cx="'+(x0+w*((b+0.5)/3))+'" cy="'+(y0+h*0.5)+'" r="3.4" fill="'+wood+'" opacity="0.32" stroke="'+ink+'" stroke-width="0.5"/>');

      for(var hx=sx+4; hx<x0+w-1; hx+=6) o.push('<line x1="'+hx+'" y1="'+(y0+1)+'" x2="'+Math.max(hx-7,sx)+'" y2="'+(y0+h-1)+'" stroke="'+line+'" stroke-width="0.7"/>');
    }

      o.push('<rect x="'+(x0+0.6)+'" y="'+(y0+h*0.74)+'" width="'+(w-1.2)+'" height="'+(h*0.26-0.6)+'" fill="'+wood+'" opacity="0.3" stroke="'+ink+'" stroke-width="0.9"/>');
      o.push('<line x1="'+(x0+w*0.35)+'" y1="'+(y0+h*0.84)+'" x2="'+(x0+w*0.65)+'" y2="'+(y0+h*0.84)+'" stroke="'+ink+'" stroke-width="1" opacity="0.6"/>');
      o.push('<rect x="'+(x0+0.6)+'" y="'+(y0+h*0.36)+'" width="'+(w-1.2)+'" height="'+(h*0.36)+'" fill="'+stone+'" opacity="0.35" stroke="'+ink+'" stroke-width="0.9"/>');
      o.push('<line x1="'+(x0+w*0.2)+'" y1="'+(y0+h*0.43)+'" x2="'+(x0+w*0.8)+'" y2="'+(y0+h*0.43)+'" stroke="'+ink+'" stroke-width="1.3"/>');
      o.push('<rect x="'+(x0+w*0.2)+'" y="'+(y0+h*0.49)+'" width="'+(w*0.6)+'" height="'+(h*0.18)+'" fill="'+ink+'" opacity="0.4"/>');
      o.push('<rect x="'+(x0+0.6)+'" y="'+(y0+0.6)+'" width="'+(w-1.2)+'" height="'+(h*0.34)+'" fill="'+wood+'" opacity="0.25" stroke="'+ink+'" stroke-width="0.9"/>');
      o.push('<circle cx="'+(x0+w-2.4)+'" cy="'+(y0+h*0.1)+'" r="0.9" fill="'+ink+'" opacity="0.5"/>');
