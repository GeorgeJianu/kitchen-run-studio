    room: JSON.parse(JSON.stringify(DEFAULT_ROOM)),
    single: JSON.parse(JSON.stringify(DEFAULT_SINGLE)),
    runs: []
  };
  var dirty = false;      // setup changed since the last full recompute
  var activeTab = 'layout';
  var pickerFor = null;   // run id whose "add cabinet" picker is open
  var pickerType = 'door', pickerLevel = 'base', pickerW = 600;

  function uid(){ return 'u'+Math.random().toString(36).slice(2,9); }

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(p && p.settings && p.runs){
          state = p;
          if(!state.standards) state.standards = JSON.parse(JSON.stringify(DEFAULT_STANDARDS));
          normalize();
          return;
        }
      }
    }catch(e){}
    // a first visit starts with the choice of furniture, not an example kitchen
    state.runs = []; normalize();
  }
  function normalize(){
    var s = state.settings;
    // a project from before per-part grain keeps grain on the decors that show one
    if(s.grainOv===undefined && s.grain==='free') s.grain = 'decor';
    Object.keys(DEFAULT_SETTINGS).forEach(function(k){
      if(s[k]===undefined) s[k] = JSON.parse(JSON.stringify(DEFAULT_SETTINGS[k]));
    });
    Object.keys(DEFAULT_STANDARDS).forEach(function(k){
      if(state.standards[k]===undefined) state.standards[k] = DEFAULT_STANDARDS[k];
    });
    Object.keys(DEFAULT_SETTINGS.hw).forEach(function(k){
      if(s.hw[k]===undefined) s.hw[k] = DEFAULT_SETTINGS.hw[k];
    });
    if(!Array.isArray(s.sheets) || !s.sheets.length) s.sheets = JSON.parse(JSON.stringify(DEFAULT_SETTINGS.sheets));
    s.sheets.forEach(function(r){
      if(r.precutPrice===undefined) r.precutPrice = 0;
      if(r.servicePrice===undefined) r.servicePrice = 0;
      if(r.serviceFee===undefined) r.serviceFee = 0;
    });
    if(s.buyMode!=='precut' && s.buyMode!=='service') s.buyMode = 'self';
    if(!Array.isArray(s.customHw)) s.customHw = [];
    if(!s.grainOv || typeof s.grainOv!=='object') s.grainOv = {};
    // a project from before the two levels is a premium one: banding as it had it
    if(s.tier!=='budget' && s.tier!=='premium'){ s.tier = 'premium'; s.edgeCarcass = s.edgeThickness; s.hwAlt = JSON.parse(JSON.stringify(TIERS.budget.hw)); }
    if(s.lang!=='en' && s.lang!=='ro') s.lang = 'ro';
    if(!state.single || !TYPES[state.single.type]) state.single = JSON.parse(JSON.stringify(DEFAULT_SINGLE));
    if(!state.single.opts) state.single.opts = defaultOpts(state.single.type);
    if(!state.single.qty) state.single.qty = 1;
    state.runs.forEach(function(r){
      if(!Array.isArray(r.units)) r.units = [];
      if(!r.fillers) r.fillers = {bl:null, br:null, wl:null, wr:null, ul:null, ur:null};
      if(r.fillers.ul===undefined){ r.fillers.ul = null; r.fillers.ur = null; }
      if(!r.ends) r.ends = {bl:false, br:false, wl:false, wr:false, ul:false, ur:false};
      if(r.ends.ul===undefined){ r.ends.ul = false; r.ends.ur = false; }
      r.units.forEach(function(u){ if(!u.opts) u.opts = defaultOpts(u.type); if(!u.level) u.level='base'; syncAppliance(u); });
    });
    if(!state.room || !(state.room.W>0)) state.room = JSON.parse(JSON.stringify(DEFAULT_ROOM));
    if(!Array.isArray(state.room.openings)) state.room.openings = [];
    if(s.layout==='room') ensurePlaces();
  }
  // A run new to the room takes the first wall still free, a little way in
  // from the corner so it clears the run already there; after that, the floor.
  function ensurePlaces(){
    var R = state.room, S = state.standards, used = {};
    state.runs.forEach(function(r){ if(r.place && r.place.wall && r.place.wall!=='free') used[r.place.wall] = true; });
    state.runs.forEach(function(r){
      if(r.place && r.place.wall) return;
      var w = ['back','right','left','front'].filter(function(k){ return !used[k]; })[0] || 'free';
      used[w] = true;
      r.place = w==='free'
        ? {wall:'free', off:0, x:Math.round(R.W/20)*10, z:Math.round(R.D/20)*10, rot:0}
        : {wall:w, off:(w==='back' ? 0 : S.worktopD), x:0, z:0, rot:0};
    });
    var longest = state.runs.reduce(function(a,r){ return Math.max(a, r.wallLength); }, 0);
    if(R.W < longest) R.W = longest;
  }
  // Where a run stands in the room. Its own coordinates run x along the run
  // from its left end, z out from its wall, y up. Each wall is read facing it
  // from inside the room, so a wall run's left end is the corner on your left.
  // fwd takes run coordinates into the room; rot turns a direction; m is the
  // same move for the room plan, where y on the page is z in the room.
  function runFrame(run){
    var R = state.room, p = run.place||{wall:'back', off:0}, o = +p.off||0, W = R.W, Dp = R.D;
    if(p.wall==='right') return {wall:'right', fwd:function(x,y,z){ return [W-z, y, o+x]; }, rot:function(n){ return [-n[2], n[1], n[0]]; }, m:'matrix(0,1,-1,0,'+W+','+o+')', axis:[0,1], len:Dp};
    if(p.wall==='left')  return {wall:'left',  fwd:function(x,y,z){ return [z, y, Dp-o-x]; }, rot:function(n){ return [n[2], n[1], -n[0]]; }, m:'matrix(0,-1,1,0,0,'+(Dp-o)+')', axis:[0,-1], len:Dp};
    if(p.wall==='front') return {wall:'front', fwd:function(x,y,z){ return [W-o-x, y, Dp-z]; }, rot:function(n){ return [-n[0], n[1], -n[2]]; }, m:'matrix(-1,0,0,-1,'+(W-o)+','+Dp+')', axis:[-1,0], len:W};
    if(p.wall==='free'){
      // placed by the middle of its footprint, so turning it keeps it where it is
      var r = ((+p.rot||0)%360+360)%360, c = Math.cos(r*Math.PI/180), sn = Math.sin(r*Math.PI/180), px = +p.x||0, pz = +p.z||0;
      if(Math.abs(c)<1e-9) c = 0; if(Math.abs(sn)<1e-9) sn = 0;
      var S = state.standards, hx = run.wallLength/2, hz = Math.max(S.worktopD, S.baseD)/2;
      return {wall:'free', free:true,
        fwd:function(x,y,z){ var u = x-hx, v = z-hz; return [px + u*c - v*sn, y, pz + u*sn + v*c]; },
        rot:function(n){ return [n[0]*c - n[2]*sn, n[1], n[0]*sn + n[2]*c]; },
        m:'matrix('+c+','+sn+','+(-sn)+','+c+','+(px - hx*c + hz*sn)+','+(pz - hx*sn - hz*c)+')', axis:[c, sn], len:Infinity};
    }
    return {wall:'back', fwd:function(x,y,z){ return [o+x, y, z]; }, rot:function(n){ return n; }, m:'translate('+o+',0)', axis:[1,0], len:W};
  }
  // A window or a door in one of the room's walls: where along the wall (from
  // the corner on your left, facing the wall from inside), how wide, how high,
  // and for a window how high its sill is. A door reaches the floor.
  function openingsOn(wall){ return (state.room.openings||[]).filter(function(op){ return op.wall===wall; }); }
  function openingSpan(op){ var o = +op.off||0, w = Math.max(+op.w||0, 100); return [o, o+w]; }
  function openingY(op){ return op.kind==='door' ? [0, Math.max(+op.h||2050, 500)] : [Math.max(+op.sill||0, 0), Math.max(+op.sill||0, 0)+Math.max(+op.h||1200, 200)]; }
  function wallLengthOf(wall){ var R = state.room; return (wall==='back' || wall==='front') ? R.W : R.D; }
  // the same wall's openings in a run's own millimetres (both measured from the same corner)
  function runOpenings(run){
    if(!inRoom()) return [];
    var pl = run.place||{}; if(!pl.wall || pl.wall==='free') return [];
    var o = +pl.off||0;
    return openingsOn(pl.wall).map(function(op){ var sp = openingSpan(op), y = openingY(op); return {kind:op.kind, x0:sp[0]-o, x1:sp[1]-o, y0:y[0], y1:y[1], op:op}; });
  }
  function identityFrame(){ return {wall:'back', fwd:function(x,y,z){ return [x,y,z]; }, rot:function(n){ return n; }, m:'', axis:[1,0], len:Infinity}; }
  function inRoom(){ return state.settings.layout==='room'; }
  function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

  function seed(){
    var S = DEFAULT_STANDARDS;
    function u(type, level, W, name, opts){
      var H = level==='wall' ? S.wallH : level==='upper' ? S.upperH : level==='tall' ? S.tallH : S.baseH;
      var D = (level==='wall' || level==='upper') ? S.wallD : level==='tall' ? S.tallD : S.baseD;
      var o = defaultOpts(type);
      if(opts) Object.keys(opts).forEach(function(k){ o[k]=opts[k]; });
      return {id:uid(), type:type, level:level, name:name, W:W, H:H, D:D, opts:o};
    }
    state.runs = [
      {id:uid(), name:'Wall A, sink run', wallLength:3600, units:[
        u('drawer','base',600,'Pan drawers',{drawerCount:3}),
        u('sink','base',800,'Sink base',{doorCount:2}),
        u('gap','base',600,'Dishwasher',{appliance:'under'}),
        u('door','base',600,'Base cupboard',{doorCount:2}),
        u('corner','base',900,'Corner base',{cornerStyle:'blind', doorWidth:450}),
        u('door','wall',600,'Wall cupboard',{doorCount:1}),
        u('door','wall',800,'Wall cupboard',{doorCount:2}),
        u('shelf','wall',600,'Open shelves',{shelfCount:2})
      ]},
      {id:uid(), name:'Wall B, tall run', wallLength:2400, units:[
        u('shelf','tall',600,'Pantry',{shelfCount:5}),
        u('gap','tall',600,'Fridge / freezer',{appliance:'tall'}),
        u('frame','tall',600,'Oven housing'),
        u('door','tall',600,'Broom cupboard',{doorCount:1})
      ]}
    ];
  }

  // Wall units hang from one line. With tall units in the kitchen that line
  // is the top of the tall units (the way a fitter sets them out); without,
  // it is the splashback height above the counter. Each wall unit hangs
  // from the line by its own height.
  function wallLine(){
    var S = state.standards, counter = S.plinth+S.baseH+S.worktopT, bySplash = counter+S.splash;
    var top = 0;
    if(S.alignTop!==false){
      state.runs.forEach(function(r){ r.units.forEach(function(u){
        if(u.level==='tall') top = Math.max(top, S.plinth+(+u.H||S.tallH));
        else if(isTallApp(u)) top = Math.max(top, applianceHeight(u));
      }); });
    }
    if(top>0 && top-S.wallH >= counter+250) return {aligned:true, top:top, bottom:top-S.wallH};
    return {aligned:false, top:bySplash+S.wallH, bottom:bySplash};
  }
  function wallUnitBottom(u){ var L = wallLine(); return L.aligned ? L.top-u.H : L.bottom; }
  // Top boxes for a high room: a second row standing on the wall units' line,
  // up towards the ceiling. Hung like wall units, they share their depth.
  function upperBottom(){ return wallLine().top; }
  function isWallLike(u){ return u.level==='wall' || u.level==='upper'; }
  // Any unit can stand on a particular cabinet instead of taking its place in
  // a row: a hutch on a base unit, a box on a tall one, a second wall unit on
  // a first, a chest of drawers on another. It sits at that cabinet's place
  // along the wall, shifted by its own space-before. A unit can also sit at
  // a free position of its own: so far from the left, so high off the floor.
  function stackParentId(u){ return (u.opts && u.opts.on) || ''; }
  function stackParentOf(run, u){
    var id = stackParentId(u); if(!id) return null;
    var p = run.units.filter(function(x){ return x.id===id && x!==u; })[0];
    if(!p) return null;
    // a chain of cabinets standing on cabinets is fine; a loop is not
    var q = p, guard = 0;
    while(q && guard++ < 12){ if(q===u) return null; var qid = stackParentId(q); q = qid ? run.units.filter(function(x){ return x.id===qid; })[0] : null; }
    return guard >= 12 ? null : p;
  }
  function isFree(u){ var ps = u.opts && u.opts.pos; return !!(ps && isFinite(+ps.x) && isFinite(+ps.y)); }
  // a stacked unit's shift from the left edge of what it stands on (may be negative)
  function stackOffset(u){ return +(u.opts && u.opts.before)||0; }
  // every unit that stands, directly or not, on this one
  function stackedOn(run, u){
    var out = [], ids = {}; ids[u.id] = 1;
    var more = true, guard = 0;
    while(more && guard++ < 12){
      more = false;
      run.units.forEach(function(x){ var pid = stackParentId(x); if(pid && ids[pid] && !ids[x.id]){ ids[x.id] = 1; out.push(x); more = true; } });
    }
    return out;
  }
  // where a unit sits in its run: its left edge and its underside above the floor
  function unitPlace(g, u){
    var S = state.standards, hit = null;
    g.rows.floor.forEach(function(p){ if(p.u===u) hit = {x:p.x, y:u.type==='gap' ? 0 : S.plinth, row:'floor'}; });
    g.rows.wall.forEach(function(p){ if(p.u===u) hit = {x:p.x, y:wallUnitBottom(u), row:'wall'}; });
    g.rows.upper.forEach(function(p){ if(p.u===u) hit = {x:p.x, y:g.upperBottom, row:'upper'}; });
    g.rows.stack.forEach(function(p){ if(p.u===u) hit = {x:p.x, y:p.y, row:p.parent ? 'on' : 'free', parent:p.parent, parentX:p.parentX}; });
    return hit;
  }
  function syncAppliance(u){
    if(u.type!=='gap' || isWallLike(u)) return;
    if(u.level==='tall') u.opts.appliance = 'tall';
    else if(u.opts.appliance==='tall') u.level = 'tall';
    else u.opts.appliance = 'under';
  }
  function defaultOpts(type, level){
    // a tall housing stacks drawers, oven, microwave and a cupboard; under the
    // worktop it is an oven over one drawer
    if(type==='housing') return level==='base'
      ? {bottom:'drawers', bottomH:120, drawerCount:1, oven:'yes', ovenH:595, micro:'no', microH:380, doorCount:1, shelfCount:1}
      : {bottom:'drawers', bottomH:600, drawerCount:2, oven:'yes', ovenH:595, micro:'yes', microH:380, doorCount:1, shelfCount:1};
    if(type==='shelf')  return {shelfCount:3};
    if(type==='drawer') return {drawerCount:3};
    if(type==='door')   return {doorCount:2};
    if(type==='combo')  return {drawerZone:300, drawerCount:2, shelfCount:2};
    if(type==='sink')   return {doorCount:2};
    if(type==='wine')   return {wineRows:5};
    if(type==='corner') return {cornerStyle:'blind', doorWidth:450};
    if(type==='gap')    return {appliance:'under', kind:'dishwasher', front:'none'};
    return {};
  }

  /* ================= stock sheets ================= */
  function distinctThicknesses(){
    var seen={}, out=[];
    state.settings.sheets.forEach(function(r){ if(!seen[r.thickness]){ seen[r.thickness]=true; out.push(r.thickness); } });
    out.sort(function(a,b){ return a-b; });
    return out;
  }
  // Rows may share a thickness (two sheet sizes of the same board). Quantities
  // pool; the first row's size and price are the ones planning uses.
  // The sheet you would BUY for a thickness: the largest row of that
  // thickness, since a small row is usually a leftover rather than stock.
  // A stock row can be for one decor or for any; a decor's own rows come first.
  // A row for a decor in one surface comes first, then a row for the decor in
  // any surface, then the rows for any decor.
  function rowsFor(thickness, decor){
    var all = state.settings.sheets.filter(function(r){ return r.thickness===thickness; });
    if(!decor) return all;
    var exact = all.filter(function(r){ return r.decor===decor; });
    if(exact.length) return exact;
    var same = all.filter(function(r){ return r.decor && r.decor!=='any' && decorBase(r.decor)===decorBase(decor); });
    if(same.length) return same;
    return all.filter(function(r){ return !r.decor || r.decor==='any'; });
  }
  function buyRowFor(thickness, decor){
    var rows = rowsFor(thickness, decor);
    if(!rows.length) return null;
    return rows.slice().sort(function(a,b){ return (b.sheetW*b.sheetH)-(a.sheetW*a.sheetH); })[0];
  }
  function priceFor(thickness, decor){
    var r = buyRowFor(thickness, decor);
    return r ? (r.price||0) : 0;
  }
  // The three ways of getting the board, each priced its own way: whole sheets
  // by the m² to cut yourself, the pieces cut to size by the m² of the pieces,
  // or a cutting service that charges per sheet, a processing fee per sheet
  // and a price per metre of edge banding.
  var BUY_MODES = [{id:'self', label:'Cut it myself', short:'Cut myself'}, {id:'precut', label:'Pre-cut to size', short:'Pre-cut'}, {id:'service', label:'Cutting service', short:'Cutting service'}];
  function buyMode(){ var m = state.settings.buyMode; return (m==='precut' || m==='service') ? m : 'self'; }
  function modeName(m){ return (BUY_MODES.filter(function(x){ return x.id===m; })[0] || BUY_MODES[0]).label; }
  // a board's cost per m², as the current mode prices it (a service sheet spread over its area)
  function rateFor(thickness, decor){
    var r = buyRowFor(thickness, decor), m = buyMode();
    if(!r) return 0;
    if(m==='precut') return r.precutPrice||0;
    if(m==='service') return ((r.servicePrice||0)+(r.serviceFee||0)) / Math.max(r.sheetW*r.sheetH/1e6, 0.01);
    return r.price||0;
  }
  // what one nested sheet you buy costs in a given mode
  function sheetCostOf(x, m){
    if(m==='precut') return (x.used/1e6)*(x.precutPrice||0);
    if(m==='service') return (x.servicePrice||0)+(x.serviceFee||0);
    return (x.sheetW*x.sheetH/1e6)*(x.price||0);
  }
  function modePriced(x, m){ return m==='precut' ? x.precutPrice>0 : m==='service' ? x.servicePrice>0 : x.price>0; }
  function matLabel(g){ return g.thickness+' mm'+(g.decorLabel ? ', '+g.decorLabel : ''); }
  // Bins the nester may open, in the order it opens them: everything you
  // already have first — smallest first, so offcuts get used up — and then an
  // endless supply of the sheet you would buy. A thickness with no stock row
  // at all still gets planned, against the project's default sheet size.
  // used: how many of each row's sheets an earlier board has already taken
  function binsFor(thickness, decor, used){
    var s = state.settings;
    var rows = rowsFor(thickness, decor);
    var bins = [];
    rows.filter(function(r){ return (r.qty||0) - ((used && used[r.id])||0) > 0; })
        .sort(function(a,b){ return (a.sheetW*a.sheetH)-(b.sheetW*b.sheetH); })
        .forEach(function(r){
          bins.push({sheetW:r.sheetW, sheetH:r.sheetH, price:r.price||0, precutPrice:r.precutPrice||0, servicePrice:r.servicePrice||0, serviceFee:r.serviceFee||0, qty:r.qty - ((used && used[r.id])||0), onHand:true, rowId:r.id});
        });
    var buy = buyRowFor(thickness, decor);
    bins.push(buy
      ? {sheetW:buy.sheetW, sheetH:buy.sheetH, price:buy.price||0, precutPrice:buy.precutPrice||0, servicePrice:buy.servicePrice||0, serviceFee:buy.serviceFee||0, qty:Infinity, onHand:false, unpriced:false}
      : {sheetW:s.defaultSheetW, sheetH:s.defaultSheetH, price:0, precutPrice:0, servicePrice:0, serviceFee:0, qty:Infinity, onHand:false, unpriced:true});
    return bins;
  }

  /* ================= cabinet geometry ================= */
  // A part carries its FINISHED size and which of its edges get banded. With
  // banding switched on the panel is cut undersize by the banding thickness on
  // every banded edge, so the finished part lands on size — a 200 x 400 front
  // with 2 mm banding all round is cut at 196 x 396.
  //   bands.w  edges perpendicular to the width  (the two upright edges)
  //   bands.h  edges perpendicular to the height (top and bottom)
  var ALL_ROUND={w:2,h:2}, BAND_UPRIGHT={w:1,h:0}, BAND_LONG={w:0,h:1}, NO_BAND={w:0,h:0};

  function isFrontPart(name){ return /^door|^diagonal door|drawer front|tray front|blind front|filler|kickboard|base rail \(front\)|appliance front/i.test(name); }
  // "2 mm on the fronts, 0.4 mm on the carcass", or just "2 mm" when the same
  function edgeDesc(){ var s = state.settings, c = s.edgeCarcass===undefined ? s.edgeThickness : s.edgeCarcass; return c===s.edgeThickness ? s.edgeThickness+' mm' : s.edgeThickness+' mm on the fronts, '+c+' mm on the carcass'; }
  function edgeTFor(name){ var s = state.settings; return isFrontPart(name) ? s.edgeThickness : (s.edgeCarcass===undefined ? s.edgeThickness : s.edgeCarcass); }
  function mkPart(name, qty, w, h, thick, bands, note){
    var s = state.settings;
    var bw = (bands && bands.w)||0, bh = (bands && bands.h)||0;
    var finW = Math.round(w), finH = Math.round(h);
    var cutW = finW, cutH = finH, edge = 0;
    // the running length of banding the part asks for, whoever does it
    var edgeRun = (bw*finH + bh*finW)*qty;
    // fronts get the thick banding; carcass parts the thin one (the same on premium)
    var et = edgeTFor(name);
    if(s.edgeOn){
      cutW = finW - bw*et;
      cutH = finH - bh*et;
      edge = edgeRun;
    }
    return {name:name, qty:qty, w:cutW, h:cutH, finW:finW, finH:finH,
      thick:thick, bands:{w:bw,h:bh}, edge:edge, edgeRun:edgeRun, edgeT:et, note:note||'', area:qty*cutW*cutH/1e6};
  }

  // What a cabinet is built of here. 'full' is the whole thing; 'carcass'
  // is the box alone, its fronts and drawers coming from elsewhere (or later);
  // 'fronts' is new doors and drawer fronts for a box that already exists, the
  // refacing job. Drawer boxes are cut from board or bought as a metal system
  // (Tandembox, Metabox and the like), which brings its own runners.
  function buildOf(cab){
    var b = cab.opts && cab.opts.build;
    if(b==='carcass' || b==='fronts') return hasFronts(cab) ? b : (b==='carcass' ? 'carcass' : 'full');
    return 'full';
  }
  function boxesOf(cab){ return (cab.opts && cab.opts.boxes)==='metal' ? 'metal' : 'board'; }
  function hasFronts(cab){ return /^(door|sink|drawer|combo|corner|housing)$/.test(cab.type); }
  // An appliance space stands full height when it is in the tall row (a
  // fridge, its own height, on the floor) and otherwise sits under the
  // worktop (a dishwasher). The row and the appliance option are one setting.
  function isTallApp(u){ return u.type==='gap' && (u.level==='tall' || (u.opts && u.opts.appliance)==='tall'); }
  function isTallUnit(u){ return u.level==='tall' || isTallApp(u); }
  // the top of an appliance space above the floor: a tall one is sized like
  // the tall cabinets, its height above the plinth line, so the two line up
  function applianceHeight(u){
    var S = state.standards;
    if(!isTallApp(u)) return S.plinth+S.baseH;
    // the space runs to the tall cabinets' top whatever stands in it, so the
    // rows above line up; a bigger appliance makes it taller
    return S.plinth + Math.max(Math.max(+u.H||S.tallH, 300), S.tallH);
  }
  // the appliance itself, standing on the floor in its space: its own height
  function applianceBodyH(u){
    var S = state.standards;
    if(!isTallApp(u)) return S.plinth+S.baseH;
    return Math.min(Math.max(+u.H||S.tallH, 300), applianceHeight(u));
  }
  // which appliance the space is for: set, or read from the name, or the usual one for the row
  var APPLIANCES = [{id:'dishwasher', label:'Dishwasher'}, {id:'fridge', label:'Fridge or freezer'}, {id:'oven', label:'Oven'}, {id:'washing', label:'Washing machine'}, {id:'other', label:'Something else'}];
  function applianceKind(u){
    var k = u.opts && u.opts.kind;
    if(k && APPLIANCES.some(function(a){ return a.id===k; })) return k;
    var n = (u.name||'').toLowerCase();
    if(/dish/.test(n)) return 'dishwasher';
    if(/fridge|freez|refrig/.test(n)) return 'fridge';
    if(/oven|cooker/.test(n)) return 'oven';

  }
  // an integrated appliance wears a furniture door, cut like any other front
  function applianceFront(u){ return u.type==='gap' && (u.opts && u.opts.front)==='door'; }
  function applianceFrontH(u){ return Math.max(applianceHeight(u) - state.standards.plinth, 100); }
  function applianceParts(cab){
    var s = state.settings, g = s.gap, out = [];
    if(applianceFront(cab)) out.push(mkPart('Door (appliance front)', 1, cab.W-2*g, applianceFrontH(cab)-2*g, s.thickness, ALL_ROUND, 'screwed to the appliance\u2019s own door with its fixing kit; no hinges'));
    return out;
  }
  // the sign for an appliance, drawn in its space: a small line drawing, centred
  function applianceSign(kind, cx, cy, sz, ink){
    var o = [], k = sz, st = ' fill="none" stroke="'+ink+'" stroke-width="5" opacity="0.7"';
    if(kind==='dishwasher'){
      o.push('<rect x="'+(cx-k/2)+'" y="'+(cy-k/2)+'" width="'+k+'" height="'+k+'" rx="10"'+st+'/>');
      o.push('<line x1="'+(cx-k/2)+'" y1="'+(cy-k/2+k*0.22)+'" x2="'+(cx+k/2)+'" y2="'+(cy-k/2+k*0.22)+'"'+st+'/>');
      o.push('<circle cx="'+(cx+k*0.3)+'" cy="'+(cy-k/2+k*0.11)+'" r="'+(k*0.05)+'"'+st+'/>');
      o.push('<path d="M'+(cx-k*0.32)+','+(cy+k*0.22)+' q'+(k*0.08)+',-'+(k*0.1)+' '+(k*0.16)+',0 t'+(k*0.16)+',0 t'+(k*0.16)+',0 t'+(k*0.16)+',0"'+st+'/>');
      o.push('<path d="M'+(cx-k*0.26)+','+(cy-k*0.04)+' a'+(k*0.26)+' '+(k*0.26)+' 0 0 1 '+(k*0.52)+',0"'+st+'/>');
    } else if(kind==='fridge'){
      o.push('<rect x="'+(cx-k*0.34)+'" y="'+(cy-k*0.6)+'" width="'+(k*0.68)+'" height="'+(k*1.2)+'" rx="8"'+st+'/>');
      o.push('<line x1="'+(cx-k*0.34)+'" y1="'+(cy-k*0.18)+'" x2="'+(cx+k*0.34)+'" y2="'+(cy-k*0.18)+'"'+st+'/>');
      o.push('<line x1="'+(cx+k*0.2)+'" y1="'+(cy-k*0.5)+'" x2="'+(cx+k*0.2)+'" y2="'+(cy-k*0.3)+'"'+st+'/>');
      o.push('<line x1="'+(cx+k*0.2)+'" y1="'+(cy-k*0.06)+'" x2="'+(cx+k*0.2)+'" y2="'+(cy+k*0.24)+'"'+st+'/>');
    } else if(kind==='oven'){
      o.push('<rect x="'+(cx-k/2)+'" y="'+(cy-k*0.4)+'" width="'+k+'" height="'+(k*0.8)+'" rx="8"'+st+'/>');
      o.push('<rect x="'+(cx-k*0.36)+'" y="'+(cy-k*0.1)+'" width="'+(k*0.72)+'" height="'+(k*0.4)+'" rx="6"'+st+'/>');
      [-0.25,0,0.25].forEach(function(f){ o.push('<circle cx="'+(cx+k*f)+'" cy="'+(cy-k*0.26)+'" r="'+(k*0.05)+'"'+st+'/>'); });
    } else if(kind==='washing'){
      o.push('<rect x="'+(cx-k/2)+'" y="'+(cy-k/2)+'" width="'+k+'" height="'+k+'" rx="10"'+st+'/>');
      o.push('<circle cx="'+cx+'" cy="'+(cy+k*0.08)+'" r="'+(k*0.3)+'"'+st+'/>');
      o.push('<circle cx="'+cx+'" cy="'+(cy+k*0.08)+'" r="'+(k*0.2)+'"'+st+'/>');
      o.push('<rect x="'+(cx-k*0.42)+'" y="'+(cy-k*0.42)+'" width="'+(k*0.3)+'" height="'+(k*0.12)+'"'+st+'/>');
    }
    return o.join('');
  }
  // an appliance space in a front drawing: its own face hatched, or a furniture
  // door over it, and the sign of what it holds
  function drawApplianceFace(o, u, x, y, w, h, patId){
    var g = state.settings.gap, kind = applianceKind(u);
    if(applianceFront(u)){
      // the door hangs between the plinth line and the top, level with the fronts beside it
      var S = state.standards, dec = frontDecorOf(u), ink = decorInk(dec);
      var px = x+g, py = y+g, pw = w-2*g, ph = h-S.plinth-2*g;      // y runs down the page: the door hangs from the top, the plinth is below it
      o.push('<rect x="'+px+'" y="'+py+'" width="'+pw+'" height="'+ph+'" fill="'+dec.fill+'" stroke="var(--ink)" stroke-width="5"/>');
      if(hasTexture(dec)) o.push('<rect x="'+px+'" y="'+py+'" width="'+pw+'" height="'+ph+'" fill="url(#grain-'+patId+'-'+dec.pid+')" pointer-events="none"/>');
      // the bar handle an appliance door gets, along the top
      o.push('<line x1="'+(px+pw*0.25)+'" y1="'+(py+Math.min(ph*0.12, 90))+'" x2="'+(px+pw*0.75)+'" y2="'+(py+Math.min(ph*0.12, 90))+'" stroke="'+ink+'" stroke-width="9" stroke-linecap="round"/>');
      if(kind!=='other' && pw>=300 && ph>=300) o.push(applianceSign(kind, px+pw/2, py+ph/2+(ph>900 ? 0 : 30), Math.min(pw, ph)*0.3, ink));
    } else {
      // the appliance on the floor at its own height; whatever the space has
      // left above it is drawn as the empty niche it is
      var bh = Math.min(applianceBodyH(u), h), by = y+h-bh;
      if(bh < h-1) o.push('<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+(h-bh)+'" fill="none" stroke="var(--stone)" stroke-width="5" stroke-dasharray="30,20"/>');
      o.push('<rect x="'+x+'" y="'+by+'" width="'+w+'" height="'+bh+'" fill="url(#app-'+patId+')" stroke="var(--stone)" stroke-width="7"/>');
      if(kind!=='other' && w>=300 && bh>=300) o.push(applianceSign(kind, x+w/2, by+bh/2, Math.min(w, bh)*0.32, 'var(--ink)'));
    }
  }
  function hasDrawers(cab){ return cab.type==='drawer' || cab.type==='combo' || (cab.type==='housing' && housingDrawers(cab)>0); }
  // the adjustable shelves behind a door unit's doors: one in a base or wall
  // unit, four in a tall one, none in a top box, unless you say otherwise
  function doorShelves(u){
    if(u.type!=='door') return 0;
    var n = u.opts && u.opts.shelfCount;
    if(n===undefined || n===null || n==='') return u.level==='tall' ? 4 : u.level==='upper' ? 0 : 1;
    return Math.max(0, Math.round(+n||0));
  }
  // A single door hinges on the side you choose (left by default, so it opens
  // from the right); a pair always hinges on its outer edges.
  function hingeSide(u){ return (u.opts && u.opts.hinge)==='right' ? 'right' : 'left'; }
  function singleDoor(u){
    var o = u.opts||{};
    if(u.type==='door' || u.type==='sink') return (o.doorCount||2)===1;
    if(u.type==='housing') return housingDoors(u)===1;
    return false;
  }

  // An oven housing is sections stacked from the floor up, each a niche
  // between fixed shelves: drawers or a door at the bottom, the oven, a
  // microwave over it, and a cupboard on top with whatever height is left.
  // Turn the appliances off and it is a tall cupboard with drawers under it.
  function housingDoors(u){ var d = u.opts && u.opts.doorCount; return (d===undefined || d===null || d==='') ? 1 : Math.max(0, Math.min(2, Math.round(+d))); }
  function housingDrawers(u){ var o = u.opts||{}; return (o.bottom||'drawers')==='drawers' ? Math.max(1, Math.round(+o.drawerCount||2)) : 0; }
  function housingSections(u){
    var o = u.opts||{}, H = +u.H||0, secs = [], y = 0;
    var bottom = o.bottom||'drawers', ovenOn = (o.oven||'yes')!=='no', micOn = (o.micro||'yes')!=='no';
    var oH = ovenOn ? Math.max(+o.ovenH||595, 200) : 0, mH = micOn ? Math.max(+o.microH||380, 150) : 0;
    var bH = bottom==='none' ? 0 : Math.min(Math.max(+o.bottomH||0, 0), Math.max(H-oH-mH, 0));
    function add(kind, h){ if(!(h>0) || y>=H) return; var y1 = Math.min(y+h, H); secs.push({kind:kind, y0:y, y1:y1, h:y1-y}); y = y1; }
    if(bH>0) add(bottom==='door' ? 'door' : 'drawers', bH);
    if(ovenOn) add('oven', oH);
    if(micOn) add('micro', mH);
    var rest = H-y;
    if(rest>=60) add(housingDoors(u)>0 ? 'top' : 'open', rest);
    else if(rest>0 && secs.length){ secs[secs.length-1].y1 = H; secs[secs.length-1].h += rest; }
    return secs;
  }
  // how much taller the sections want the cabinet than it is
  function housingOver(u){
    var o = u.opts||{};
    var need = ((o.bottom||'drawers')==='none' ? 0 : Math.max(+o.bottomH||0, 0))
      + ((o.oven||'yes')!=='no' ? Math.max(+o.ovenH||595, 200) : 0) + ((o.micro||'yes')!=='no' ? Math.max(+o.microH||380, 150) : 0);
    return need - (+u.H||0);
  }
  function housingKindLabel(k){ return k==='drawers' ? 'drawers' : k==='door' ? 'bottom door' : k==='oven' ? 'oven' : k==='micro' ? 'microwave' : k==='top' ? 'top cupboard' : 'open shelves'; }
  function housingStackText(u){
    var secs = housingSections(u), nd = housingDrawers(u);
    var bits = secs.map(function(q){ return (q.kind==='drawers' ? nd+' drawer'+(nd===1?'':'s') : housingKindLabel(q.kind))+' '+Math.round(q.h); });
    var over = housingOver(u);
    return 'From the floor up: '+bits.join(', ')+' mm.'+
      (over>0 ? ' The sections ask for '+Math.round(over)+' mm more than the cabinet is tall — make it taller or trim a section.' : '');
  }
  function buildTag(cab){
    var b = buildOf(cab), bits = [];
    if(b==='carcass') bits.push('carcass only');
    if(b==='fronts') bits.push('fronts only');
    if(hasDrawers(cab) && b!=='fronts' && boxesOf(cab)==='metal') bits.push('metal drawers');
    return bits.join(', ');
  }

  // A finished (decorative) panel on an exposed side: floor to worktop on a
  // base unit, the unit's own height on a wall unit, flush with the fronts.
  // It is cut oversize all round by the scribe allowance, so it can be
  // scribed to the wall and floor on site, and its front edge gets banded.
  function finishedPanelPart(name, Hp, Dp){
    var s = state.settings, a = Math.max(0, s.scribe||0);
    var p = mkPart(name, 1, Dp+2*a, Hp+2*a, s.thickness, NO_BAND,
      (a>0 ? 'cut '+a+' mm oversize all round, finishes '+Math.round(Dp)+' × '+Math.round(Hp)+'; ' : '')+'scribe to the wall and floor on site, then band the front edge');
    p.finW = Math.round(Dp); p.finH = Math.round(Hp);
    // its front edge is banded once it is scribed
    p.bands = {w:1, h:0}; p.edgeRun = Hp;
    if(s.edgeOn) p.edge = Hp;
    return p;
  }
  function finSides(u){ var f = (u.opts && u.opts.fin)||'none'; return {l: f==='left'||f==='both', r: f==='right'||f==='both'}; }
  // A finished panel screwed to the underside of a wall unit, flush with the
  // fronts, where the carcass bottom would otherwise show from below. A
  // finished side on the same unit runs down past it to cover its end.
  function finBottom(u){ return isWallLike(u) && (u.opts && u.opts.finBottom)==='yes'; }
  function finBottomT(u){ return finBottom(u) ? state.settings.thickness : 0; }
  // the board under a unit, when its neighbours share it: null when it stands alone
  function bottomGroupOf(u){
    if(!finBottom(u)) return null;
    var f = findUnit(u.id); if(!f) return null;
    var g = runGeometry(f.run).bottomGroups.filter(function(gr){ return gr.units.indexOf(u)>=0; })[0];
    return (g && g.units.length>1) ? g : null;
  }
  // How far a cabinet reaches from the wall: its carcass, plus a front where
  // it has one. A finished panel is cut to that, so it finishes flush with the
  // doors on a cabinet that has doors and with the carcass on one that does not.
  function frontPlane(u){
    var S = state.standards, T = state.settings.thickness, D = u.D||(isWallLike(u) ? S.wallD : S.baseD);
    var fronted = (hasFronts(u) && buildOf(u)!=='carcass') || applianceFront(u);
    return D + (fronted ? T : 0);
  }
  function bottomPanelPart(u){
    var s = state.settings, T = s.thickness;
    return mkPart('Finished bottom panel', 1, u.W, frontPlane(u), T, BAND_LONG, 'screwed up under the carcass from inside, flush with the front; band the front edge');
  }
  // how deep the worktop is over a carcass of depth D: over a shallower unit
  // it keeps its usual overhang rather than its usual depth; over a deeper
  // one (an open unit flush with the doors, a free-standing appliance) it
  // stays the usual depth as long as it still covers the carcass by 20 mm
  function worktopDepthFor(D){
    var S = state.standards, ovh = S.worktopD - S.baseD;
    return D <= S.baseD ? Math.max(D + ovh, 100) : Math.max(S.worktopD, D + 20);
  }
  // how deep the kickboard reaches under a carcass of depth D: set back from its front
  function kickDepthFor(D){
    var s = state.settings;
    return Math.max(D - (s.baseType==='ladder' ? s.toeRecess : 50), 20);
  }
  function panelSize(u){
    var S = state.standards;
    var Hp = isWallLike(u) ? u.H + finBottomT(u) : (u.type==='gap' ? applianceHeight(u) : S.plinth+u.H);
    return {H:Hp, D:frontPlane(u)};
  }
  function sidePanelParts(cab){
    var fs = finSides(cab), out = [];
    if(finBottom(cab) && !bottomGroupOf(cab)) out.push(bottomPanelPart(cab));
    if(!fs.l && !fs.r) return out;
    var ps = panelSize(cab);
    if(fs.l) out.push(finishedPanelPart('Finished side panel (left)', ps.H, ps.D));
    if(fs.r) out.push(finishedPanelPart('Finished side panel (right)', ps.H, ps.D));
    return out;
  }

  function housingParts(cab){
    var s = state.settings, T=s.thickness, Tb=s.back, g=s.gap, W=cab.W, H=cab.H, D=cab.D, parts=[];
    var build = buildOf(cab), carcass = build!=='fronts', fronts = build!=='carcass';
    var secs = housingSections(cab), dc = Math.max(housingDoors(cab), 1);
    var boxes = carcass && housingDrawers(cab)>0 && boxesOf(cab)==='board';
    if(carcass){
      parts.push(mkPart('Side panel (L/R)', 2, D, H, T, BAND_UPRIGHT, 'front edge faces the room'));
      parts.push(mkPart('Top panel', 1, W-2*T, D, T, BAND_LONG, 'front edge faces the room'));
      parts.push(mkPart('Bottom panel', 1, W-2*T, D, T, BAND_LONG, 'front edge faces the room'));
      parts.push(mkPart('Back panel', 1, W, H, Tb, NO_BAND, 'external — screwed to rear edges; cut away behind the oven for ventilation'));
      var fixed = Math.max(secs.length-1, 0);
      if(fixed>0) parts.push(mkPart('Fixed shelf', fixed, W-2*T, D, T, BAND_LONG, 'fixed between the sections — the oven and microwave stand on theirs'));
      var sc = secs.some(function(q){ return q.kind==='top' || q.kind==='open'; }) ? Math.max(0, Math.round(+cab.opts.shelfCount||0)) : 0;
      if(sc>0) parts.push(mkPart('Shelf', sc, W-2*T, Math.max(D-K.shelfSetback,50), T, BAND_LONG, 'adjustable, in the top cupboard'));
    }
    secs.forEach(function(sec){
      if(sec.kind==='drawers'){
        var n = housingDrawers(cab), Td = s.drawerBox||T;
        var frontH = Math.max((sec.h-(n+1)*g)/n, 60);
        var boxH = Math.max(frontH-K.drawerBoxHeightSetback, 40);
        var boxW = Math.max(W-2*T-2*K.slideClearanceEach, 100);
        var boxD = Math.max(D-K.slideDepthClearance, 150);
        if(fronts) parts.push(mkPart('Drawer front', n, W-2*g, frontH, T, ALL_ROUND, 'gap '+g+' mm all round, bottom section'));
        if(boxes){
          parts.push(mkPart('Drawer box front/back', n*2, boxW, boxH, Td, BAND_LONG, 'top edge up'));
          parts.push(mkPart('Drawer box side', n*2, boxD, boxH, Td, BAND_LONG, 'top edge up'));
          parts.push(mkPart('Drawer box bottom', n, Math.max(boxW-2*Td,60), Math.max(boxD-Td,60), Tb, NO_BAND, 'raw edges'));
        }
      } else if((sec.kind==='door' || sec.kind==='top') && fronts){
        var dW = dc===1 ? (W-2*g) : ((W-3*g)/2);
        parts.push(mkPart(sec.kind==='top' ? 'Door (top cupboard)' : 'Door (bottom)', dc, dW, Math.max(sec.h-2*g, 60), T, ALL_ROUND,
          'gap '+g+' mm all round'+(dc===1 ? ', hinged '+hingeSide(cab) : '')));
      }
    });
    return parts.concat(sidePanelParts(cab));
  }

  function unitParts(cab){
    var s = state.settings;
    if(cab.type==='gap') return applianceParts(cab).concat(sidePanelParts(cab));
    if(cab.type==='housing') return housingParts(cab);
    if(cab.type==='corner') return cornerParts(cab).concat(sidePanelParts(cab));
    var build = buildOf(cab), carcass = build!=='fronts', fronts = build!=='carcass';
    var boxes = carcass && hasDrawers(cab) && boxesOf(cab)==='board';

    var T=s.thickness, Tb=s.back, g=s.gap, W=cab.W, H=cab.H, D=cab.D, parts=[];

    if(carcass){
      parts.push(mkPart('Side panel (L/R)', 2, D, H, T, BAND_UPRIGHT, 'front edge faces the room'));
      if(cab.type==='sink'){
        var rail = Math.min(D, K.sinkStretcherDepth);
        parts.push(mkPart('Front stretcher', 1, W-2*T, rail, T, BAND_LONG, 'top left open for the bowl'));
        parts.push(mkPart('Back stretcher', 1, W-2*T, rail, T, NO_BAND, 'raw edges'));
      } else {
        parts.push(mkPart('Top panel', 1, W-2*T, D, T, BAND_LONG, 'front edge faces the room'));
      }
      parts.push(mkPart('Bottom panel', 1, W-2*T, D, T, BAND_LONG, 'front edge faces the room'));
      parts.push(mkPart('Back panel', 1, W, H, Tb, NO_BAND, 'external — screwed to rear edges'));

      if(cab.type==='shelf' || cab.type==='combo' || cab.type==='door'){
        var sc = cab.type==='shelf' ? (cab.opts.shelfCount||3) : cab.type==='combo' ? (cab.opts.shelfCount||2) : doorShelves(cab);
        if(sc>0) parts.push(mkPart('Shelf', sc, W-2*T, Math.max(D-K.shelfSetback,50), T, BAND_LONG, cab.type==='door' ? 'adjustable, behind the doors' : 'front edge faces the room'));
      }
      if(cab.type==='wine'){
        var wr = cab.opts.wineRows||5;
        if(wr>0) parts.push(mkPart('Wine divider', wr, W-2*T, Math.max(D-K.shelfSetback,50), T, BAND_LONG, 'front edge faces the room'));
      }
    }
    if(cab.type==='drawer' || cab.type==='combo'){
      var n = cab.opts.drawerCount||2;
      var Td = s.drawerBox||T;                 // drawer box board, thinner than the carcass
      var zoneH = cab.type==='combo' ? Math.min(cab.opts.drawerZone||300, H-100) : (H-2*T);
      var frontH = Math.max((zoneH-(n+1)*g)/n, 60);
      var boxH = Math.max(frontH-K.drawerBoxHeightSetback, 40);
      var boxW = Math.max(W-2*T-2*K.slideClearanceEach, 100);
      var boxD = Math.max(D-K.slideDepthClearance, 150);
      // the front is a show part, so it stays on the carcass board
      if(fronts) parts.push(mkPart('Drawer front', n, W-2*g, frontH, T, ALL_ROUND, 'gap '+g+' mm all round'));
      if(boxes){
        parts.push(mkPart('Drawer box front/back', n*2, boxW, boxH, Td, BAND_LONG, 'top edge up'));
        parts.push(mkPart('Drawer box side', n*2, boxD, boxH, Td, BAND_LONG, 'top edge up'));
        parts.push(mkPart('Drawer box bottom', n, Math.max(boxW-2*Td,60), Math.max(boxD-Td,60), Tb, NO_BAND, 'raw edges'));
      }
    }
    if(cab.type==='door' && fronts){
      var dc = cab.opts.doorCount||2;
      var dH = H-2*g;
      var dW = dc===1 ? (W-2*g) : ((W-3*g)/2);
      parts.push(mkPart('Door', dc, dW, dH, T, ALL_ROUND, 'gap '+g+' mm all round'+(dc===1 ? ', hinged '+hingeSide(cab) : '')));
    }
    if(cab.type==='sink' && fronts){
      var tray = K.sinkTrayHeight;
      var dcS = cab.opts.doorCount||2;
      var dHS = Math.max(H-2*g-tray-g, 100);
      var dWS = dcS===1 ? (W-2*g) : ((W-3*g)/2);
      parts.push(mkPart('Tip-out tray front', 1, W-2*g, tray, T, ALL_ROUND, 'gap '+g+' mm all round'));
      parts.push(mkPart('Door', dcS, dWS, dHS, T, ALL_ROUND, 'gap '+g+' mm all round'+(dcS===1 ? ', hinged '+hingeSide(cab) : '')));
    }
    return parts.concat(sidePanelParts(cab));
  }

  function cornerParts(cab){
    var s = state.settings;
    var T=s.thickness, Tb=s.back, g=s.gap, W=cab.W, H=cab.H, D=cab.D, parts=[];
    var style = cab.opts.cornerStyle||'blind';
    var build = buildOf(cab), carcass = build!=='fronts', fronts = build!=='carcass';
    if(style==='lazysusan'){
      var dWL = Math.max(cab.opts.doorWidth||580, 300), dHL = H-2*g;
      if(carcass){
        parts.push(mkPart('Return side panel (left leg)', 1, D, H, T, BAND_UPRIGHT, 'front edge faces the room'));
        parts.push(mkPart('Return side panel (right leg)', 1, D, H, T, BAND_UPRIGHT, 'front edge faces the room'));
        parts.push(mkPart('Back panel (per return wall)', 2, D, H, Tb, NO_BAND, 'external'));
      }
      if(fronts) parts.push(mkPart('Diagonal door', 1, dWL-2*g, dHL, T, ALL_ROUND, 'cut both stiles to the corner angle'));
      return parts;
    }
    var dW = Math.min(Math.max(cab.opts.doorWidth||450,200), Math.max(W-150,200));
    var blindW = Math.max(W-dW, 100);
    var dH = H-2*g;
    if(carcass){
      parts.push(mkPart('Side panel (hinge side)', 1, D, H, T, BAND_UPRIGHT, 'front edge faces the room'));
      parts.push(mkPart('Side panel (blind end)', 1, D, H, T, NO_BAND, 'hidden against the adjoining run'));
      parts.push(mkPart('Top panel', 1, W-2*T, D, T, BAND_LONG, 'front edge faces the room'));
      parts.push(mkPart('Bottom panel', 1, W-2*T, D, T, BAND_LONG, 'front edge faces the room'));
      parts.push(mkPart('Back panel', 1, W, H, Tb, NO_BAND, 'external'));
    }
    if(fronts) parts.push(mkPart('Door', 1, dW-2*g, dH, T, ALL_ROUND, 'gap '+g+' mm all round'));
    if(fronts) parts.push(mkPart('Blind front panel (fixed)', 1, blindW-g, dH, T, ALL_ROUND, 'screwed on, not hinged'));
    return parts;
  }

  function unitSummary(cab){
    var parts = unitParts(cab);
    var s = state.settings;
    var mainArea=0, backArea=0, edgeMM=0, edgeRunMM=0, pieces=0;
    parts.forEach(function(p){
      edgeMM += p.edge; edgeRunMM += p.edgeRun||0; pieces += p.qty;
      if(p.thick===s.back && s.back!==s.thickness) backArea += p.area; else mainArea += p.area;
    });
    return {parts:parts, mainArea:mainArea, backArea:backArea, area:mainArea+backArea, edgeMM:edgeMM, edgeRunMM:edgeRunMM, pieces:pieces};
  }

  /* ================= hardware & labour per unit ================= */
  // Blum sizes the hinge count from the front's height AND its weight (for a
  // 600 mm wide front: 2 hinges up to ~6 kg, 3 up to ~12 kg, then more). The
  // weight comes from the door's area, the board thickness and its density.
  function doorWeightKg(w, h, thick){
    return (w/1000)*(h/1000)*(thick/1000)*(state.settings.density||650);
  }
  function hingesForDoor(w, h){
    var kg = doorWeightKg(w, h, state.settings.thickness);
    var byH = h<=900 ? 2 : h<=1600 ? 3 : h<=2000 ? 4 : 5;
    var byW = kg<=6 ? 2 : kg<=12 ? 3 : kg<=18 ? 4 : 5;
    return Math.max(byH, byW);
  }
  // whole-cabinet weight, board only — what the wall fixings have to carry
  function unitWeightKg(cab){
    var s = state.settings;
    return unitParts(cab).reduce(function(a,p){ return a + p.qty*(p.w/1000)*(p.h/1000)*(p.thick/1000)*(s.density||650); }, 0);
  }
  function hardwareFor(cab){
    var h = {}; HW.forEach(function(i){ h[i.k]=0; });
    if(cab.type==='gap'){ if(applianceFront(cab)){ h.handle += 1; h.screw += 6; } return h; }

    var s = state.settings;
    var build = buildOf(cab), carcass = build!=='fronts', fronts = build!=='carcass';
    if(carcass){
      h.cam += 8;                                   // top and bottom into both sides
      h.screw += Math.ceil(2*(cab.W+cab.H)/100);    // back fixed every ~100 mm
      if(cab.level==='base' || cab.level==='tall'){
        // a built base carries the cabinet instead of legs — it just gets
        // screwed down to the rails
        if(s.baseType==='ladder') h.screw += 4;
        else { h.leg += (cab.W>900?6:4); h.clip += 2; }
      }
      if(isWallLike(cab)){ h.bracket += 1; }
    }
    if(finBottom(cab)) h.screw += 6;
    if(cab.type==='housing'){
      var secsH = housingSections(cab), ndH = housingDrawers(cab), dcH = Math.max(housingDoors(cab), 1);
      if(carcass){
        h.cam += 4*Math.max(secsH.length-1, 0);          // each fixed shelf into both sides
        var scH = secsH.some(function(q){ return q.kind==='top' || q.kind==='open'; }) ? Math.max(0, Math.round(+cab.opts.shelfCount||0)) : 0;
        h.pin += scH*4;
        h.screw += 12;                                    // the appliances' fixing screws
      }
      if(fronts) secsH.forEach(function(sec){
        if(sec.kind==='drawers'){
          h.handle += ndH;
          if(carcass){ if(boxesOf(cab)==='metal') h.metaldrawer += ndH; else h.runner += ndH; h.screw += ndH*8; }
        } else if(sec.kind==='door' || sec.kind==='top'){
          var dWH = dcH===1 ? cab.W-2*s.gap : (cab.W-3*s.gap)/2, perH = hingesForDoor(dWH, Math.max(sec.h-2*s.gap, 60));
          h.hinge += dcH*perH; h.plate += dcH*perH; h.handle += dcH;
        }
      });
      return h;
    }
    if(!fronts){
      // the box alone: its shelf pins and wine dividers, nothing that hangs on it
      var shelves0 = cab.type==='shelf' ? (cab.opts.shelfCount||3) : cab.type==='combo' ? (cab.opts.shelfCount||2) : doorShelves(cab);
      if(shelves0>0) h.pin += shelves0*4;
      if(cab.type==='wine') h.cam += (cab.opts.wineRows||5)*4;
      return h;
    }

    var doors = 0, dW = 0, dH = cab.H - 2*s.gap;
    if(cab.type==='door' || cab.type==='sink'){
      doors = cab.opts.doorCount||2;
      dW = doors===1 ? cab.W-2*s.gap : (cab.W-3*s.gap)/2;
      if(cab.type==='sink') dH = Math.max(dH - K.sinkTrayHeight - s.gap, 100);
    }
    if(cab.type==='corner'){
      doors = 1;
      dW = (cab.opts.cornerStyle||'blind')==='lazysusan'
        ? Math.max(cab.opts.doorWidth||580, 300) - 2*s.gap
        : Math.min(Math.max(cab.opts.doorWidth||450,200), Math.max(cab.W-150,200)) - 2*s.gap;
    }
    if(doors>0){
      var perDoor = hingesForDoor(dW, dH);
      h.hinge += doors*perDoor; h.plate += doors*perDoor; h.handle += doors;
    }
    if(cab.type==='sink' && carcass) h.tipout += 1;
    if(cab.type==='corner' && carcass && (cab.opts.cornerStyle||'blind')==='lazysusan') h.susan += 1;
    if(cab.type==='drawer' || cab.type==='combo'){
      var n = cab.opts.drawerCount||2;
      h.handle += n;
      if(carcass){
        // new fronts on existing drawers need handles only
        if(boxesOf(cab)==='metal') h.metaldrawer += n; else h.runner += n;
        h.screw += n*8;
      }
    }
    if(carcass){
      var shelves = cab.type==='shelf' ? (cab.opts.shelfCount||3) : cab.type==='combo' ? (cab.opts.shelfCount||2) : doorShelves(cab);
      if(shelves>0) h.pin += shelves*4;
      if(cab.type==='wine') h.cam += (cab.opts.wineRows||5)*4;
    }
    return h;
  }

  function labourMinutes(cab){
    if(cab.type==='gap') return applianceFront(cab) ? 15 : 0;
    var build = buildOf(cab), carcass = build!=='fronts', fronts = build!=='carcass';
    var m = (carcass ? 45 : 0) + (finBottom(cab) ? 8 : 0);
    if(cab.type==='housing'){
      var secsL = housingSections(cab), ndL = housingDrawers(cab);
      if(carcass) m += 10*Math.max(secsL.length-1, 0) + (secsL.some(function(q){ return q.kind==='oven'||q.kind==='micro'; }) ? 20 : 0);
      if(fronts && ndL>0) m += ndL * (!carcass ? 10 : boxesOf(cab)==='metal' ? 15 : 25);
      if(fronts) secsL.forEach(function(q){ if(q.kind==='door' || q.kind==='top') m += Math.max(housingDoors(cab),1)*15; });
      if(carcass) m += Math.max(0, Math.round(+cab.opts.shelfCount||0))*8;
      return m;
    }
    if(fronts && (cab.type==='door' || cab.type==='sink')) m += (cab.opts.doorCount||2)*15;
    if(fronts && cab.type==='corner') m += 25;
    if(cab.type==='drawer' || cab.type==='combo'){
      var n = cab.opts.drawerCount||2;
      // a board box takes building; a metal one is fitted; a bare front is hung
      m += n * (!carcass ? 10 : boxesOf(cab)==='metal' ? 15 : 25);
    }
    if(carcass && cab.type==='shelf') m += (cab.opts.shelfCount||3)*8;
    if(carcass && cab.type==='door') m += doorShelves(cab)*8;
    if(carcass && cab.type==='combo') m += (cab.opts.shelfCount||2)*8;
    if(carcass && cab.type==='wine') m += (cab.opts.wineRows||5)*6;
    if(carcass && cab.type==='sink') m += 20;
    return m;
  }

  /* ================= run geometry ================= */
  // Floor row = base + tall units (they share the floor, left to right).
  // Wall row = wall units, placed left to right in their own sequence.
  // Each row can start with a filler against the left wall and end with one
  // against the right wall. A filler typed in is that size; a right-hand one
  // left blank fills a small gap by itself, as a scribe strip would.
  function fillerVal(v){ return (v===null || v===undefined || v==='') ? null : Math.max(0, +v||0); }
  // Finished panels stand beside the cabinets, so each one takes a board
  // thickness of the wall: end panels at the row ends, side panels wherever a
  // cabinet has one.
  // The floor row is laid first. Wall units then flow along the wall and
  // step over anything standing full height below them, a tall unit or a
  // fridge, the way they would have to in the room. Any unit can also keep a
  // set space before it, for a gap you want left open.
  function spaceBefore(u){ return Math.max(0, +(u.opts && u.opts.before)||0); }
  function rowsOf(run){
    var f = run.fillers||{}, e = run.ends||{}, T = state.settings.thickness, S = state.standards;
    var bl = fillerVal(f.bl)||0;
    var floor=[], panels=[], x=bl;
    var su = run.units.filter(function(u){ return stackParentOf(run, u); });
    var fr = run.units.filter(function(u){ return su.indexOf(u)<0 && isFree(u); });
    var off = function(u){ return su.indexOf(u)>=0 || fr.indexOf(u)>=0; };
    var fu = run.units.filter(function(u){ return !isWallLike(u) && !off(u); });
    var wu = run.units.filter(function(u){ return u.level==='wall' && !off(u); });
    var uu = run.units.filter(function(u){ return u.level==='upper' && !off(u); });
    if(e.bl && fu.length){ panels.push({row:'floor', side:'left', kind:'end', x:x, u:fu[0]}); x += T; }
    // what stands full height on the floor, with its top and its finished
    // sides: the wall row has to clear all of it, the upper row only what
    // reaches above its own underside
    var tallAll = [];
    fu.forEach(function(u){
      var fs = finSides(u);
      x += spaceBefore(u);
      var x0 = x;
      if(fs.l){ panels.push({row:'floor', side:'left', kind:'side', x:x, u:u}); x += T; }
      floor.push({u:u, x:x}); x += u.W;
      if(fs.r){ panels.push({row:'floor', side:'right', kind:'side', x:x, u:u}); x += T; }
      if(isTallUnit(u)) tallAll.push({x0:x0, x1:x, top:u.type==='gap' ? applianceHeight(u) : S.plinth+u.H});
    });
    if(e.br && fu.length){ panels.push({row:'floor', side:'right', kind:'end', x:x, u:fu[fu.length-1]}); x += T; }
    var uB = upperBottom();
    // a row hung on the wall: its units flow left to right past the blocks,
    // the first one bringing its filler and end panel with it so the whole
    // block lands together
    function flow(units, row, fl, endL, endR, blocks){
      var items = [], xw = 0, start = 0;
      if(!units.length) fl = 0;      // a filler needs a unit to stand beside
      function clear(x0, w){
        var best = x0, moved = true, guard = 0;
        while(moved && guard++<20){
          moved = false;
          blocks.forEach(function(t){
            if(x0 < t.x1-1 && x0+w > t.x0+1){ x0 = t.x1; moved = true; if(x0+w <= run.wallLength+1) best = x0; }
          });
        }
        // no room past the blocks either: better to show it clashing at the
        // last place it fits on the wall, with a warning, than to push it clean off
        if(x0 + w > run.wallLength + 1) return best;
        return x0;
      }
      units.forEach(function(u, i){
        var fs = finSides(u), lead = i===0 ? fl + (endL ? T : 0) : 0;
        var w = lead + spaceBefore(u) + (fs.l?T:0) + u.W + (fs.r?T:0);
        var nx = clear(xw, w);
        if(i===0){ start = nx; xw = nx + fl; if(endL){ panels.push({row:row, side:'left', kind:'end', x:xw, u:u}); xw += T; } }
        else xw = nx;
        xw += spaceBefore(u);
        if(fs.l){ panels.push({row:row, side:'left', kind:'side', x:xw, u:u}); xw += T; }
        items.push({u:u, x:xw}); xw += u.W;
        if(fs.r){ panels.push({row:row, side:'right', kind:'side', x:xw, u:u}); xw += T; }
      });
      if(endR && units.length){ panels.push({row:row, side:'right', kind:'end', x:xw, u:units[units.length-1]}); xw += T; }
      // what stands to the right of the row: the next block, or the wall
      var stop = run.wallLength;
      blocks.forEach(function(t){ if(t.x0 >= xw-1 && t.x0 < stop) stop = t.x0; });
      return {items:items, start:start, fillerL:fl, end:xw, stop:stop};
    }
    var W = flow(wu, 'wall', fillerVal(f.wl)||0, e.wl, e.wr, tallAll);
    var U = flow(uu, 'upper', fillerVal(f.ul)||0, e.ul, e.ur, tallAll.filter(function(t){ return t.top > uB+1; }));
    // what stands on another cabinet: at that cabinet's place, on its top
    var placed = {}, stack = [];
    // on a base unit it stands on the worktop when there is one; a tall unit and an appliance carry it on their own top
    var wtT = state.settings.worktopOn ? S.worktopT : 0;
    floor.forEach(function(p){ placed[p.u.id] = {x:p.x, top:p.u.type==='gap' ? applianceHeight(p.u) : S.plinth+p.u.H+(isTallUnit(p.u) ? 0 : wtT)}; });
    W.items.forEach(function(p){ placed[p.u.id] = {x:p.x, top:wallUnitBottom(p.u)+p.u.H}; });
    U.items.forEach(function(p){ placed[p.u.id] = {x:p.x, top:uB+p.u.H}; });
    // the free ones sit where they were put
    fr.forEach(function(u){ var ps = u.opts.pos, y = Math.max(0, +ps.y||0); stack.push({u:u, x:+ps.x||0, y:y, parent:null}); placed[u.id] = {x:+ps.x||0, top:y+u.H}; });
    // then each stacked one once what it stands on is placed, so chains work
    var left = su.slice(), guard = 0;
    while(left.length && guard++ < 12){
      left = left.filter(function(u){
        var par = stackParentOf(run, u), at = par && placed[par.id];
        if(!at) return true;
        var x = at.x + stackOffset(u);
        stack.push({u:u, x:x, y:at.top, parent:par, parentX:at.x}); placed[u.id] = {x:x, top:at.top+u.H};
        return false;
      });
    }
    return {floor:floor, wall:W.items, upper:U.items, stack:stack, panels:panels, floorStart:bl, floorEnd:x,
      wallStart:W.start, wallFillerL:W.fillerL, wallEnd:W.end, wallStop:W.stop,
      upperStart:U.start, upperFillerL:U.fillerL, upperEnd:U.end, upperStop:U.stop};
  }

  function runGeometry(run){
    var S = state.standards, s = state.settings, f = run.fillers||{};
    var r = rowsOf(run);
    function autoRight(gap, hasUnits){ return (hasUnits && gap>0 && gap<=s.fillerMax) ? gap : 0; }
    var brSet = fillerVal(f.br), wrSet = fillerVal(f.wr), urSet = fillerVal(f.ur);
    var hasWall = r.wall.length>0, hasUpper = r.upper.length>0;
    var br = brSet===null ? autoRight(run.wallLength - r.floorEnd, true) : brSet;
    var wr = !hasWall ? 0 : (wrSet===null ? autoRight(r.wallStop - r.wallEnd, true) : wrSet);
    var ur = !hasUpper ? 0 : (urSet===null ? autoRight(r.upperStop - r.upperEnd, true) : urSet);
    var fillers = {bl:r.floorStart, br:br, wl:r.wallFillerL, wr:wr, ul:r.upperFillerL, ur:ur,
                   autoBr:brSet===null, autoWr:wrSet===null, autoUr:urSet===null,
                   base:r.floorStart+br, wall:r.wallFillerL+wr, upper:r.upperFillerL+ur};
    var floorLen = r.floorEnd + br, wallLen = r.wallEnd + wr, upperLen = r.upperEnd + ur;
    var floorGap = run.wallLength - floorLen;
    var wallGap  = hasWall ? r.wallStop - wallLen : 0;
    var upperGap = hasUpper ? r.upperStop - upperLen : 0;
    var WL = wallLine(), uB = upperBottom();

    // A filler is as tall as the cabinet it stands beside: base height next
    // to a base unit, the full height next to a tall unit, the wall unit's
    // height on the wall row. Beside an appliance it reaches the appliance top.
    function floorFillerH(u){
      if(!u) return S.baseH;
      if(u.type==='gap') return Math.max(applianceHeight(u)-S.plinth, S.baseH);
      return u.H;
    }
    var fu = r.floor, wu = r.wall, fgeo = [];
    if(fillers.bl>0){ var ul = fu.length ? fu[0].u : null; fgeo.push({row:'floor', side:'left', x:0, w:fillers.bl, y:S.plinth, H:floorFillerH(ul), D:(ul&&ul.D)||S.baseD, tall:!!ul && isTallUnit(ul)}); }
    if(fillers.br>0){ var ur = fu.length ? fu[fu.length-1].u : null; fgeo.push({row:'floor', side:'right', x:r.floorEnd, w:fillers.br, y:S.plinth, H:floorFillerH(ur), D:(ur&&ur.D)||S.baseD, tall:!!ur && isTallUnit(ur)}); }
    if(fillers.wl>0){ var wl0 = wu[0].u; fgeo.push({row:'wall', side:'left', x:r.wallStart, w:fillers.wl, y:wallUnitBottom(wl0), H:wl0.H, D:wl0.D||S.wallD, tall:false}); }
    if(fillers.wr>0){ var wr0 = wu[wu.length-1].u; fgeo.push({row:'wall', side:'right', x:r.wallEnd, w:fillers.wr, y:wallUnitBottom(wr0), H:wr0.H, D:wr0.D||S.wallD, tall:false}); }
    if(fillers.ul>0){ var ul0 = r.upper[0].u; fgeo.push({row:'upper', side:'left', x:r.upperStart, w:fillers.ul, y:uB, H:ul0.H, D:ul0.D||S.wallD, tall:false}); }
    if(fillers.ur>0){ var ur0 = r.upper[r.upper.length-1].u; fgeo.push({row:'upper', side:'right', x:r.upperEnd, w:fillers.ur, y:uB, H:ur0.H, D:ur0.D||S.wallD, tall:false}); }

    // worktop spans base units, under-counter appliances and the base-height
    // fillers, not tall units or full-height appliances; the kickboard runs
    // under every cabinet and filler.
    var wtLen = 0, kickLen = 0;
    fgeo.forEach(function(fg){ if(fg.row==='floor'){ kickLen += fg.w; if(!fg.tall) wtLen += fg.w; } });
    r.floor.forEach(function(p){
      var u = p.u;
      var isTall = isTallUnit(u);
      if(!isTall) wtLen += u.W;
      if(u.type!=='gap' || applianceFront(u)) kickLen += u.W;
    });
    // each panel with its place and size; the worktop runs over the base ones
    var wallBottom = WL.bottom;
    var panels = r.panels.map(function(p){
      var ps = panelSize(p.u), isTall = isTallUnit(p.u);
      if(p.row==='floor' && !isTall) wtLen += s.thickness;
      return {row:p.row, side:p.side, kind:p.kind, x:p.x, w:s.thickness, y:p.row==='wall' ? wallUnitBottom(p.u)-finBottomT(p.u) : p.row==='upper' ? uB-finBottomT(p.u) : 0, H:ps.H, D:ps.D, u:p.u,
        label:(p.kind==='end' ? 'Finished end panel ('+(p.row==='wall'?'wall':p.row==='upper'?'upper':'base')+', '+p.side+')' : 'Finished side panel ('+p.side+')')};
    });
    // The worktop and the kickboard follow the cabinets under them: over a
    // shallower unit the worktop keeps its usual overhang rather than its
    // usual depth, and the kickboard stays its usual distance behind the
    // carcass front. Neighbours at the same depth share one piece.
    var wtPieces = [], kkPieces = [];
    fgeo.forEach(function(fg){ if(fg.row!=='floor') return; kkPieces.push([fg.x, fg.x+fg.w, kickDepthFor(fg.D)]); if(!fg.tall) wtPieces.push([fg.x, fg.x+fg.w, worktopDepthFor(fg.D)]); });
    r.floor.forEach(function(p){
      var u = p.u, Du = u.D||S.baseD;
      if(u.type!=='gap' || applianceFront(u)) kkPieces.push([p.x, p.x+u.W, kickDepthFor(Du)]);
      if(!isTallUnit(u)) wtPieces.push([p.x, p.x+u.W, worktopDepthFor(Du)]);
    });
    panels.forEach(function(p){ if(p.row==='floor' && !isTallUnit(p.u)) wtPieces.push([p.x, p.x+p.w, worktopDepthFor(p.u.D||S.baseD)]); });
    function mergeDeep(list){
      list.sort(function(a,b){ return a[0]-b[0]; });
      var out = [];
      list.forEach(function(q){ var l = out[out.length-1]; if(l && q[0]<=l.x1+1 && Math.abs(l.D-q[2])<0.5) l.x1 = Math.max(l.x1, q[1]); else out.push({x0:q[0], x1:q[1], D:q[2]}); });
      return out;
    }
    var wtSpans = s.worktopOn ? mergeDeep(wtPieces) : [], kkSpans = mergeDeep(kkPieces);
    var wtArea = wtSpans.reduce(function(a,w){ return a + (w.x1-w.x0)*w.D/1e6; }, 0);
    if(!s.worktopOn) wtLen = 0;
    // the highest point anything reaches, for the drawings' sense of the ceiling
    var topY = 0;
    r.floor.forEach(function(p){ topY = Math.max(topY, p.u.type==='gap' ? applianceHeight(p.u) : S.plinth+p.u.H); });
    r.wall.forEach(function(p){ topY = Math.max(topY, wallUnitBottom(p.u)+p.u.H); });
    r.upper.forEach(function(p){ topY = Math.max(topY, uB+p.u.H); });
    r.stack.forEach(function(p){ topY = Math.max(topY, p.y+p.u.H); });

    // a wall unit sitting over a tall unit is a real-world clash
    var tallSpans = r.floor.filter(function(p){
      return isTallUnit(p.u);
    }).map(function(p){ return [p.x, p.x+p.u.W]; });
    var clash = r.wall.some(function(p){
      var a=p.x, b=p.x+p.u.W;
      return tallSpans.some(function(t){ return a < t[1]-1 && b > t[0]+1; });
    });
    var highSpans = r.floor.filter(function(p){ return isTallUnit(p.u) && (p.u.type==='gap' ? applianceHeight(p.u) : S.plinth+p.u.H) > uB+1; })
                           .map(function(p){ return [p.x, p.x+p.u.W]; });
    var clashUpper = r.upper.some(function(p){
      var a=p.x, b=p.x+p.u.W;
      return highSpans.some(function(t){ return a < t[1]-1 && b > t[0]+1; });
    });

    // Finished bottom panels: neighbours that both have one, hanging at the
    // same height and depth with nothing between them, are made as one board.
    function bottomGroups(items, yOf){
      var groups = [];
      items.forEach(function(p){
        var u = p.u; if(!finBottom(u)) return;
        var D = u.D||S.wallD, y = yOf(u), last = groups[groups.length-1];
        var Dp = frontPlane(u) - s.thickness;   // the board is quoted as this plus a board thickness
        if(last && Math.abs(last.x+last.w - p.x) < 0.5 && last.D===Dp && Math.abs(last.y-y) < 0.5){ last.w += u.W; last.units.push(u); }
        else groups.push({x:p.x, w:u.W, D:Dp, y:y, units:[u]});
      });
      return groups;
    }
    var bgroups = bottomGroups(r.wall, function(u){ return wallUnitBottom(u); }).concat(bottomGroups(r.upper, function(){ return uB; }));

    return {rows:r, panels:panels, fillerGeo:fgeo, floorLen:floorLen, wallLen:wallLen, upperLen:upperLen,
      floorGap:floorGap, wallGap:wallGap, upperGap:upperGap, fillers:fillers,
      worktopLen:wtLen, kickLen:kickLen, worktopSpans:wtSpans, kickSpans:kkSpans, worktopArea:wtArea, clash:clash, clashUpper:clashUpper, bottomGroups:bgroups, wallLine:WL, upperBottom:uB, topY:topY,
      counterH:S.plinth+S.baseH+S.worktopT, wallBottom:WL.bottom};
  }

  // Extra panels a run needs on top of its cabinets: scribe fillers, and then
  // either a kickboard clipped to adjustable legs, or a built ladder-frame base
  // the cabinets stand on — two rails with cross members between them, which is
  // how a modular run is levelled on an uneven floor.
  function runExtraParts(run){
    var S = state.standards, s = state.settings, g = runGeometry(run), out = [], F = g.fillers;
    g.fillerGeo.forEach(function(fg){
      out.push(mkPart('Filler / scribe panel ('+(fg.row==='wall' ? 'wall' : fg.row==='upper' ? 'upper' : fg.tall ? 'tall' : 'base')+', '+fg.side+')', 1, fg.w, fg.H, s.thickness, ALL_ROUND,
        (fg.tall ? 'full height beside the tall unit; ' : '')+'scribed to the wall on site'));
    });
    g.panels.filter(function(p){ return p.kind==='end'; }).forEach(function(p){ out.push(finishedPanelPart(p.label, p.H, p.D)); });
    // one board under a stretch of units, in as many pieces as the sheet allows
    g.bottomGroups.filter(function(gr){ return gr.units.length>1; }).forEach(function(gr){
      var T = s.thickness, row = buyRowFor(T), maxLen = row ? Math.max(row.sheetW, row.sheetH) - 2*(s.trim||0) : K.kickMaxPiece;
      var n = Math.max(1, Math.ceil(gr.w/maxLen)), piece = gr.w/n;
      var names = gr.units.map(function(u){ return u.name||TYPES[u.type].label; });
      out.push(mkPart('Finished bottom panel (under '+names[0]+' to '+names[names.length-1]+')', n, piece, gr.D+T, T, BAND_LONG,
        'one board under '+gr.units.length+' units'+(n>1 ? ', in '+n+' pieces as the sheet allows' : '')+'; screwed up from inside, flush with the fronts; band the front edge'));
    });
    if(g.kickLen>0){
      var n = Math.ceil(g.kickLen/K.kickMaxPiece);
      var piece = Math.round(g.kickLen/n);
      if(s.baseType==='ladder'){
        var baseD = Math.max(S.baseD - s.toeRecess, 120);
        out.push(mkPart('Base rail (front)', n, piece, S.plinth, s.thickness, BAND_LONG, 'the visible face — set back '+s.toeRecess+' mm from the cabinet front'));
        out.push(mkPart('Base rail (back)', n, piece, S.plinth, s.thickness, NO_BAND, 'raw — hidden at the wall'));
        var cross = Math.max(2, Math.ceil(g.kickLen/600)+1);
        out.push(mkPart('Base cross member', cross, Math.max(baseD-2*s.thickness,60), S.plinth, s.thickness, NO_BAND,
          'fits between the rails; notch the outer two at the bottom for an uneven floor'));
      } else {
        out.push(mkPart('Kickboard', n, piece, S.plinth, s.thickness, BAND_LONG, 'clips to the legs, cut to fit on site'));
      }
    }
    return out;
  }

  /* ================= sheet nesting ================= */
  // First-Fit Decreasing Height shelf packing, kerf- and trim-aware, over an
  // ORDERED list of bins. Pieces go in tallest-first; each one takes the first
  // open shelf with width to spare, searched across every sheet already opened.
  // When a new shelf-row is needed it lands on the oldest sheet with room, so
  // an earlier sheet's unused floor space is used before another sheet starts.
  // A new sheet is opened from the bin list in order — the stock you already
  // own comes first, so leftovers are consumed before anything is bought.
  // A heuristic, like the ones dedicated cut-list optimisers use: not a
  // guaranteed-optimal nest, and it does not pin grain direction, so parts may
  // nest rotated 90°. Orientation is settled once against the sheet you would
  // buy, so a piece that would only fit an offcut sideways is not rotated.
  // Which way the grain runs on a part, when the board has one: along the
  // height of anything you see standing (sides, doors, fronts, fillers), along
  // the length of anything lying flat or spanning (tops, shelves, rails, drawer
  // box sides). Backs and drawer bottoms don't show, so they are free.
  function grainOf(name){
    if(/back panel|drawer box bottom|cross member/i.test(name)) return null;
    if(/side panel|return side|door|drawer front|tray front|blind front|filler|finished/i.test(name)) return 'h';
    return 'w';
  }
  // A part's grain as set for it: vertical ('h', along its height), horizontal
  // ('w', along its width) or none; set in the cut list per part, else the rule above.
  // owner is the cabinet's id, or the run's for its extras.
  function partGrain(owner, name){
    var o = state.settings.grainOv && state.settings.grainOv[owner+'|'+name];
    if(o==='h' || o==='w') return o;
    if(o==='none') return null;
    return grainOf(name);
  }
  function grainWord(g){ return g==='h' ? 'Vertical' : g==='w' ? 'Horizontal' : 'None'; }
  // whether a board's grain is kept when nesting: on every board, on decors
  // that show a grain or a vein (wood, stone), or never
  function grainPinned(decor){
    var m = state.settings.grain;
    if(m==='length') return true;
    if(m==='decor') return hasTexture(decorById(decor));
    return false;
  }

  function packSheets(pieces, bins, kerf, trim, pinned){
    trim = trim||0;
    if(pinned===undefined) pinned = state.settings.grain==='length';
    var avail = bins.map(function(b){
      return {sheetW:b.sheetW, sheetH:b.sheetH, price:b.price||0, precutPrice:b.precutPrice||0, servicePrice:b.servicePrice||0, serviceFee:b.serviceFee||0, onHand:!!b.onHand, unpriced:!!b.unpriced, rowId:b.rowId,
        left: (b.qty===Infinity || b.qty==null) ? Infinity : b.qty,
        usableW: Math.max(b.sheetW-2*trim, 1), usableH: Math.max(b.sheetH-2*trim, 1)};
    });
    var ref = avail[avail.length-1];          // the buy sheet is the reference

    // With the grain pinned, a part's grain axis must lie along the sheet's
    // long side, so its orientation is fixed and it is never rotated. Otherwise
    // it is oriented to suit the sheet you would buy, and may still be turned
    // later if that is the only way it fits an offcut.
    var longIsW = ref.sheetW >= ref.sheetH;
    var oversized=[], norm=[];
    pieces.forEach(function(p){
      var w=p.w, h=p.h, locked=false;
      if(pinned && p.grain){
        // grain 'h' runs along the part's height; put that axis on the long side
        var wantAlongW = (p.grain==='h') === longIsW;
        if(wantAlongW){ w=p.h; h=p.w; }
        locked = true;
      } else if(!(w<=ref.usableW && h<=ref.usableH) && (h<=ref.usableW && w<=ref.usableH)){ w=p.h; h=p.w; }
      var fits = avail.some(function(a){ return (w<=a.usableW && h<=a.usableH) || (!locked && h<=a.usableW && w<=a.usableH); });
      if(!fits){ oversized.push(p); return; }
      norm.push({w:w, h:h, label:p.label, key:p.key, grain:p.grain, locked:locked});
    });
    norm.sort(function(a,b){ return b.h-a.h; });

    var sheets=[], shelves=[], usedArea=0;
    function bottomOf(i){
      var b=0;
      for(var j=0;j<shelves.length;j++) if(shelves[j].sheetIdx===i) b=Math.max(b, shelves[j].y+shelves[j].h);
      return b;
    }
    // Returns the sheet index and whether the piece had to be turned to fit.
    function openSheet(w,h,locked){
      for(var pass=0; pass<(locked?1:2); pass++){
        var pw = pass===0 ? w : h, ph = pass===0 ? h : w;
        for(var i=0;i<avail.length;i++){
          var a=avail[i];
          if(a.left<=0) continue;
          if(pw<=a.usableW && ph<=a.usableH){
            if(a.left!==Infinity) a.left--;
            sheets.push({items:[], usableW:a.usableW, usableH:a.usableH, sheetW:a.sheetW,
              sheetH:a.sheetH, price:a.price, precutPrice:a.precutPrice, servicePrice:a.servicePrice, serviceFee:a.serviceFee, onHand:a.onHand, unpriced:a.unpriced, rowId:a.rowId});
            return {idx:sheets.length-1, turned:pass===1};
          }
        }
      }
      return null;
    }

    norm.forEach(function(p){
      for(var i=0;i<shelves.length;i++){
        var sh=shelves[i];
        if(p.h>sh.h) continue;
        var sheet = sheets[sh.sheetIdx];
        var need = sh.x===0 ? p.w : p.w+kerf;
        if(sh.x+need<=sheet.usableW){
          var x = sh.x===0 ? 0 : sh.x+kerf;
          sheet.items.push({x:x, y:sh.y, w:p.w, h:p.h, label:p.label, key:p.key, grain:p.grain, locked:p.locked, turned:!!p.turned});
          sh.x = x+p.w; usedArea += p.w*p.h;
          return;
        }
      }
      var idx=-1, y=0, gap=0;
      for(var si=0; si<sheets.length; si++){
        var b = bottomOf(si), g = b>0 ? kerf : 0;
        if(p.w<=sheets[si].usableW && b+g+p.h<=sheets[si].usableH){ idx=si; y=b; gap=g; break; }
      }
      if(idx<0){
        var opened = openSheet(p.w, p.h, p.locked);
        if(!opened){ oversized.push(p); return; }
        idx = opened.idx; y=0; gap=0;
        if(opened.turned){ var tw=p.w; p.w=p.h; p.h=tw; p.turned=true; }
      }
      var row = {sheetIdx:idx, y:y+gap, h:p.h, x:p.w};
      shelves.push(row);
      sheets[idx].items.push({x:0, y:row.y, w:p.w, h:p.h, label:p.label, key:p.key, grain:p.grain, locked:p.locked, turned:!!p.turned});
      usedArea += p.w*p.h;
    });

    // how full each sheet ended up — a barely-used sheet may be cheaper bought
    // as parts cut to size than as a whole sheet
    sheets.forEach(function(sh){
      sh.used = sh.items.reduce(function(a,it){ return a + it.w*it.h; }, 0);
      sh.fill = (sh.usableW*sh.usableH)>0 ? sh.used/(sh.usableW*sh.usableH) : 0;
    });
    var usableArea = sheets.reduce(function(a,s){ return a + s.usableW*s.usableH; }, 0);
    return {sheets:sheets, count:sheets.length, usedArea:usedArea, usableArea:usableArea, oversized:oversized};
  }

  /* ================= whole-project computation ================= */
  // One pass over every run: panels, sheets, hardware, worktop, labour, cost.
  var cache = null;
  function compute(){
    if(cache) return cache;
    var s = state.settings, S = state.standards;
    var lines = [];      // one row per unit, for the cut list and cost table
    var groups = {};     // pieces to nest, keyed by thickness
    var hwTotals = {};   HW.forEach(function(i){ hwTotals[i.k]=0; });
    var edgeMM = 0, edgeRunMM = 0, minutes = 0, pieces = 0, area = 0, unitCount = 0;
    var worktopLen = 0, worktopAreaMM = 0, worktopVaries = false, runInfo = [];
    var mode = buyMode();

    function addPieces(parts, label, owner, unit){
      parts.forEach(function(p){
        var dec = partDecor(p, unit), key = String(p.thick)+'|'+dec;
        if(!groups[key]) groups[key] = {thickness:p.thick, decor:dec, list:[], parts:[]};
        var gr = partGrain(owner, p.name);
        for(var i=0;i<p.qty;i++) groups[key].list.push({w:p.w, h:p.h, label:label+': '+p.name, key:owner+'|'+p.name, grain:gr});
        // the same parts once per line, finished size and banded edges, for an order to a cutting company
        groups[key].parts.push({cab:label, name:p.name, qty:p.qty, L:p.finH, W:p.finW, cutL:p.h, cutW:p.w, thick:p.thick, bands:p.bands, grain:gr, edgeRun:p.edgeRun||0, note:p.note});
      });
    }

    state.runs.forEach(function(run){
      var g = runGeometry(run);
      worktopLen += g.worktopLen;
      worktopAreaMM += g.worktopArea;
      if(g.worktopSpans.some(function(w){ return Math.abs(w.D - S.worktopD) > 0.5; })) worktopVaries = true;
      runInfo.push({run:run, geom:g});

      run.units.forEach(function(u){
        var sum = unitSummary(u);
        var hw = hardwareFor(u);
        var min = labourMinutes(u);
        HW.forEach(function(i){ hwTotals[i.k] += hw[i.k]; });
        edgeMM += sum.edgeMM; edgeRunMM += sum.edgeRunMM; minutes += min; pieces += sum.pieces; area += sum.area;
        if(u.type!=='gap') unitCount++;
        addPieces(sum.parts, u.name||TYPES[u.type].label, u.id, u);
        lines.push({run:run, unit:u, sum:sum, hw:hw, minutes:min});
      });

      var extras = runExtraParts(run);
      if(extras.length){
        extras.forEach(function(p){ edgeMM += p.edge; edgeRunMM += p.edgeRun||0; pieces += p.qty; area += p.area; });
        addPieces(extras, run.name, run.id, null);
        lines.push({run:run, unit:null, extras:extras, sum:{parts:extras}, minutes:0});
      }
    });

    // nest every thickness group
    var plan = [], sheetCost = 0, sheetsToBuy = 0, precutArea = 0, precutCost = 0, usedOnHand = {};
    // thickest board first; within a thickness the carcass board, then the fronts' decors
    Object.keys(groups).sort(function(a,b){
      var ga = groups[a], gb = groups[b];
      if(gb.thickness!==ga.thickness) return gb.thickness-ga.thickness;
      var ca = ga.decor===decorCarcass().id ? 0 : 1, cb = gb.decor===decorCarcass().id ? 0 : 1;
      return ca-cb || decorLabel(ga.decor).localeCompare(decorLabel(gb.decor));
    }).forEach(function(gk){
      var thickness = groups[gk].thickness, decor = groups[gk].decor, list = groups[gk].list;
      var packed = packSheets(list, binsFor(thickness, decor, usedOnHand), s.kerf, s.trim, grainPinned(decor));
      packed.sheets.forEach(function(sh){ if(sh.onHand && sh.rowId) usedOnHand[sh.rowId] = (usedOnHand[sh.rowId]||0)+1; });
      var bought = packed.sheets.filter(function(x){ return !x.onHand; });
      var onHandUsed = packed.count - bought.length;

      // A sheet you would barely use can be cheaper bought as parts cut to
      // size, even at a higher rate per m2 — you pay for what you use instead
      // of carrying the offcut. Only applies to sheets you would buy.
      // Pre-cut and the cutting service price every sheet their own way.
      bought.forEach(function(x){
        // a board with a stock row whose price for this mode is still blank
        x.noPrice = !x.unpriced && !modePriced(x, mode);
        if(mode!=='self'){
          x.precut = mode==='precut'; x.cost = sheetCostOf(x, mode); x.unpriced = x.unpriced || !modePriced(x, mode);
          return;
        }
        var full = (x.sheetW*x.sheetH/1e6)*(x.price||0);
        if(s.precutOn && x.precutPrice>0 && x.fill < (s.precutThreshold/100)){
          var asParts = (x.used/1e6)*x.precutPrice;
          if(asParts < full || x.unpriced){ x.precut = true; x.cost = asParts; return; }
        }
        x.precut = false; x.cost = full;
      });

      var precutSheets = bought.filter(function(x){ return x.precut; });
      var buySheets = bought.filter(function(x){ return !x.precut; });
      var cost = bought.reduce(function(a,x){ return a + x.cost; }, 0);
      var unpriced = (mode==='self' ? buySheets : bought).some(function(x){ return x.unpriced; });
      var gPrecutArea = precutSheets.reduce(function(a,x){ return a + x.used/1e6; }, 0);
      var gPrecutCost = precutSheets.reduce(function(a,x){ return a + x.cost; }, 0);

      var buyBySize = {};
      buySheets.forEach(function(x){
        var k = x.sheetW+'x'+x.sheetH;
        if(!buyBySize[k]) buyBySize[k] = {sheetW:x.sheetW, sheetH:x.sheetH, price:x.price||0, qty:0};
        buyBySize[k].qty++;
      });
      var onHandBySize = {};
      packed.sheets.filter(function(x){ return x.onHand; }).forEach(function(x){
        var k = x.sheetW+'x'+x.sheetH;
        if(!onHandBySize[k]) onHandBySize[k] = {sheetW:x.sheetW, sheetH:x.sheetH, qty:0};
        onHandBySize[k].qty++;
      });

      var util = packed.usableArea>0 ? (packed.usedArea/packed.usableArea)*100 : 0;
      sheetCost += cost; sheetsToBuy += buySheets.length;
      precutArea += gPrecutArea; precutCost += gPrecutCost;
      plan.push({thickness:thickness, decor:decor, decorLabel:decorLabel(decor), pieceCount:list.length, needed:packed.count,
        onHandUsed:onHandUsed, toBuy:buySheets.length,
        precutCount:precutSheets.length, precutArea:gPrecutArea, precutCost:gPrecutCost,
        precutRate: precutSheets.length ? precutSheets[0].precutPrice : 0,
        buySizes:Object.keys(buyBySize).map(function(k){ return buyBySize[k]; }),
        onHandSizes:Object.keys(onHandBySize).map(function(k){ return onHandBySize[k]; }),
        servicePrice: buySheets.length ? buySheets[0].servicePrice||0 : 0, serviceFee: buySheets.length ? buySheets[0].serviceFee||0 : 0,
        parts:groups[gk].parts, edgeRun:groups[gk].parts.reduce(function(a,p){ return a + p.edgeRun; }, 0),
        noPrice:bought.some(function(x){ return x.noPrice; }),
        cost:cost, unpriced:unpriced, utilization:util, sheets:packed.sheets, oversized:packed.oversized});
    });

    // hardware cost
    var hwRows = HW.map(function(i){
      var qty = hwTotals[i.k], price = s.hw[i.k]||0;
      return {k:i.k, label:hwLabel(i), unit:i.unit, qty:qty, price:price, cost:qty*price};
